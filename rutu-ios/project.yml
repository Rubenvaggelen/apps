name: RutuBBQ
options:
  bundleIdPrefix: com.vanaggelen
  deploymentTarget:
    iOS: "17.0"
targets:
  RutuBBQ:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanaggelen.rutubbq
        PRODUCT_NAME: Rutu BBQ
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rutu BBQ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []

