name: Build Rutu BBQ Windows Simulator

on:
  push:
    branches: [ feature/jade-orders ]
    paths:
      - 'rutu-windows/**'
      - '.github/workflows/build-rutu-windows.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rutu-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish Rutu Windows in-app update
        if: github.ref == 'refs/heads/feature/jade-orders'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          installer=$(find dist -maxdepth 1 -type f -name 'Company-Build-Setup-*.exe' | head -1)
          portable=$(find dist -maxdepth 1 -type f -name 'Company-Build-*-Portable.exe' | head -1)
          test -n "$installer" && test -s "$installer"
          test -n "$portable" && test -s "$portable"
          version=$(node -p "require('./package.json').version")
          sha=$(sha256sum "$installer" | awk '{print $1}')
          meta=$(mktemp)
          printf '{"version":"%s","url":"https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Windows.exe","sha256":"%s"}\n' "$version" "$sha" > "$meta"

          keydir=$(mktemp -d)
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$keydir" "$meta"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$keydir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$keydir/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$keydir/askpass"
          chmod 700 "$keydir/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$keydir/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$keydir/key" </dev/null
          opts=(-i "$keydir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          stage=$(ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" 'mktemp -d "$HOME/.rutu-update.XXXXXXXX"')
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" "$installer" "$remote:$stage/Rutu-BBQ-Windows.exe"
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" "$portable" "$remote:$stage/Rutu-BBQ-Bedrijf-Windows.exe"
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" "$meta" "$remote:$stage/windows.json"
          ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" "mkdir -p ~/public_html/rutu-updates ~/dev.vanaggelen.com/rutu-downloads && mv '$stage/Rutu-BBQ-Windows.exe' ~/public_html/rutu-updates/Rutu-BBQ-Windows.exe && mv '$stage/Rutu-BBQ-Bedrijf-Windows.exe' ~/dev.vanaggelen.com/rutu-downloads/Rutu-BBQ-Bedrijf-Windows.exe && mv '$stage/windows.json' ~/public_html/rutu-updates/windows.json && chmod 644 ~/public_html/rutu-updates/Rutu-BBQ-Windows.exe ~/public_html/rutu-updates/windows.json ~/dev.vanaggelen.com/rutu-downloads/Rutu-BBQ-Bedrijf-Windows.exe && rmdir '$stage'"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rutu-bbq-windows-installer
          path: |
            rutu-windows/dist/*.exe
            rutu-windows/dist/*.yml
          if-no-files-found: error
