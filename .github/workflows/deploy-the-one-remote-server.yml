name: Deploy The One Remote Relay

on:
  push:
    branches: [main]
    paths:
      - 'the-one-remote-server/index.php'
      - 'the-one-remote-server/music.php'
      - 'the-one-remote-server/devices.php'
      - 'the-one-remote-server/dedupe-cache.php'
      - 'the-one-remote-server/adopt-hub.php'
      - 'the-one-remote-server/RESET_SHARED_MEDIA_ONCE'
      - '.github/workflows/deploy-the-one-remote-server.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: the-one-remote-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP
        run: |
          php -l the-one-remote-server/index.php
          php -l the-one-remote-server/music.php
          php -l the-one-remote-server/devices.php
          php -l the-one-remote-server/dedupe-cache.php
          php -l the-one-remote-server/adopt-hub.php

      - name: Deploy relay
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE DEPLOY_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "::error::Missing deployment secret: $name"; exit 1; }
          done

          keydir=$(mktemp -d)
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$keydir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$keydir/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$keydir/askpass"
          chmod 600 "$keydir/key" "$keydir/known_hosts"
          chmod 700 "$keydir/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$keydir/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$keydir/key" </dev/null
          unset DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE

          opts=(-i "$keydir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20)
          remote="$DEPLOY_USER@$DEPLOY_HOST"

          # Eenmalige volledige Shared Media reset wanneer de marker in deze commit staat.
          # Alleen servercache/catalogus wordt gewist; lokale USB-sticks blijven onaangeraakt.
          if [ -f the-one-remote-server/RESET_SHARED_MEDIA_ONCE ]; then
            ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" '
              rm -f "$HOME/the-one-music-cache/files/"*.bin 2>/dev/null || true
              rm -f "$HOME/the-one-music-cache/files/"*.part 2>/dev/null || true
              rm -f "$HOME/the-one-music-cache/meta/"*.json 2>/dev/null || true
              rm -f "$HOME/the-one-music-cache/meta/"*.tmp.* 2>/dev/null || true
              echo "SHARED_MEDIA_RESET_DONE"
            '
          fi

          # Ruimte meten en alleen veilige tijdelijke rommel opruimen.
          # Geldige .bin-cache en definitieve catalogusmetadata blijven onaangeraakt.
          ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" '
            echo "=== SPACE BEFORE ==="
            df -h "$HOME" || true
            du -sh "$HOME/the-one-music-cache" "$HOME/the-one-music-cache/files" "$HOME/the-one-music-cache/meta" 2>/dev/null || true
            find "$HOME/the-one-music-cache/files" -maxdepth 1 -type f -name "*.part" -delete 2>/dev/null || true
            find "$HOME/the-one-music-cache/meta" -maxdepth 1 -type f -name "*.sync.json" -delete 2>/dev/null || true
            find "$HOME/the-one-music-cache/meta" -maxdepth 1 -type f -name "*.tmp.*" -delete 2>/dev/null || true
            rm -rf "$HOME"/.the-one-remote-stage.* 2>/dev/null || true
            rm -rf "$HOME"/.the-one-remote-backups/api.* 2>/dev/null || true
            echo "=== SPACE AFTER ==="
            df -h "$HOME" || true
            du -sh "$HOME/the-one-music-cache" "$HOME/the-one-music-cache/files" "$HOME/the-one-music-cache/meta" 2>/dev/null || true
          '

          stage=$(ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" 'mktemp -d "$HOME/.the-one-remote-stage.XXXXXXXX"')
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" the-one-remote-server/dedupe-cache.php "$remote:$stage/dedupe-cache.php"
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" the-one-remote-server/adopt-hub.php "$remote:$stage/adopt-hub.php"
          ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" "php '$stage/dedupe-cache.php'; php '$stage/adopt-hub.php'; echo '=== SPACE AFTER DEDUPE/HUB ADOPT ==='; df -h \"\$HOME\" || true; du -sh \"\$HOME/the-one-music-cache\" 2>/dev/null || true"
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" the-one-remote-server/index.php "$remote:$stage/index.php"
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" the-one-remote-server/music.php "$remote:$stage/music.php"
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" the-one-remote-server/devices.php "$remote:$stage/devices.php"
          ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" "bash -s -- '$stage'" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          target_dir="$HOME/public_html/the-one-remote-api"
          target="$target_dir/index.php"
          music_target="$target_dir/music.php"
          devices_target="$target_dir/devices.php"
          mkdir -p "$target_dir" "$HOME/.the-one-remote-backups"
          php -l "$stage/index.php" >/dev/null
          php -l "$stage/music.php" >/dev/null
          php -l "$stage/devices.php" >/dev/null
          if [ -f "$target" ] || [ -f "$music_target" ] || [ -f "$devices_target" ]; then
            backup=$(mktemp -d "$HOME/.the-one-remote-backups/api.XXXXXXXX")
            [ -f "$target" ] && cp -p "$target" "$backup/index.php" || true
            [ -f "$music_target" ] && cp -p "$music_target" "$backup/music.php" || true
            [ -f "$devices_target" ] && cp -p "$devices_target" "$backup/devices.php" || true
          fi
          cp "$stage/index.php" "$target.new"
          cp "$stage/music.php" "$music_target.new"
          cp "$stage/devices.php" "$devices_target.new"
          chmod 644 "$target.new" "$music_target.new" "$devices_target.new"
          mv -f "$target.new" "$target"
          mv -f "$music_target.new" "$music_target"
          mv -f "$devices_target.new" "$devices_target"
          rm -rf "$stage"
          REMOTE

          curl -fsS --max-time 15 "https://rubenvanaggelen.com/the-one-remote-api/index.php?action=health" |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("service") == "The One Remote Relay"'
          curl -fsS --max-time 15 "https://rubenvanaggelen.com/the-one-remote-api/music.php?action=health" |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("service") == "The One Music Cache"'
          curl -fsS --max-time 15 "https://rubenvanaggelen.com/the-one-remote-api/devices.php?action=health" |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("service") == "The One Main Device Registry"'
