name: Deploy The One Remote Relay (Manual Approval Only)

# Never deploy live auth server automatically on GitHub pushes.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter DEPLOY_THE_ONE_API to authorize live update'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: the-one-remote-relay
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: the-one-production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Confirm explicit production release
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DEPLOY_THE_ONE_API" ]; then
            echo "::error::Explicit production approval phrase is required"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP
        run: |
          php -l the-one-remote-server/index.php
          php -l the-one-remote-server/music.php
          php -l the-one-remote-server/devices.php
          php -l the-one-remote-server/dedupe-cache.php
          php -l the-one-remote-server/adopt-hub.php

      - name: Protect family license endpoints
        run: |
          grep -Fq "if (\$action === 'family_register')" the-one-remote-server/devices.php
          grep -Fq "if (\$action === 'family_check')" the-one-remote-server/devices.php
          grep -Fq "family_signed_request" the-one-remote-server/devices.php
          grep -Fq "the_one_user" the-one-remote-server/devices.php
          grep -Fq "cinema_android" the-one-remote-server/devices.php
          grep -Fq "series_android" the-one-remote-server/devices.php
          grep -Fq "tv_android" the-one-remote-server/devices.php
          grep -Fq "kids_android" the-one-remote-server/devices.php

      - name: Test full signed Family license contract in isolation
        run: python3 the-one-remote-server/tests/license_contract.py

      - name: Deploy relay
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE DEPLOY_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "::error::Missing deployment secret: $name"; exit 1; }
          done

          keydir=$(mktemp -d)
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$keydir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$keydir/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$keydir/askpass"
          chmod 600 "$keydir/key" "$keydir/known_hosts"
          chmod 700 "$keydir/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$keydir/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$keydir/key" </dev/null
          unset DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE

          opts=(-i "$keydir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20)
          remote="$DEPLOY_USER@$DEPLOY_HOST"

          # Deployment is limited to API files. Do not touch Shared Media caches,
          # stored licenses, device registrations, or any other server data.
          stage=$(ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" 'mktemp -d "$HOME/.the-one-remote-stage.XXXXXXXX"')
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" the-one-remote-server/index.php "$remote:$stage/index.php"
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" the-one-remote-server/music.php "$remote:$stage/music.php"
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" the-one-remote-server/devices.php "$remote:$stage/devices.php"
          ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" "bash -s -- '$stage'" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          target_dir="$HOME/public_html/the-one-remote-api"
          target="$target_dir/index.php"
          music_target="$target_dir/music.php"
          devices_target="$target_dir/devices.php"
          mkdir -p "$target_dir" "$HOME/.the-one-remote-backups"
          php -l "$stage/index.php" >/dev/null
          php -l "$stage/music.php" >/dev/null
          php -l "$stage/devices.php" >/dev/null
          # Fail closed if any existing target or recoverable snapshot cannot be verified.
          for name in index.php music.php devices.php; do
            test -s "$target_dir/$name"
          done
          backup=$(mktemp -d "$HOME/.the-one-remote-backups/api.XXXXXXXX")
          for name in index.php music.php devices.php; do
            cp -p "$target_dir/$name" "$backup/$name"
            cmp -s "$backup/$name" "$target_dir/$name"
          done
          echo "RECOVERY_SNAPSHOT=$backup"
          # Roll back all three PHP files on any failed atomic swap or smoke check.
          rollback() {
            trap - ERR
            echo "::error::API release failed. Restoring preserved PHP snapshot: $backup"
            for name in index.php music.php devices.php; do
              [ -f "$backup/$name" ] || continue
              cp -p "$backup/$name" "$target_dir/$name.rollback" || true
              mv -f "$target_dir/$name.rollback" "$target_dir/$name" || true
            done
            for name in index.php music.php devices.php; do
              cmp -s "$backup/$name" "$target_dir/$name" ||
                echo "::error::Rollback verification failed for $name"
            done
          }
          trap rollback ERR
          cp "$stage/index.php" "$target.new"
          cp "$stage/music.php" "$music_target.new"
          cp "$stage/devices.php" "$devices_target.new"
          chmod 644 "$target.new" "$music_target.new" "$devices_target.new"
          mv -f "$target.new" "$target"
          mv -f "$music_target.new" "$music_target"
          mv -f "$devices_target.new" "$devices_target"
          # Smoke tests run before rollback is disarmed: any error restores the backup.
          for endpoint in index.php music.php devices.php; do
            case "$endpoint" in
              index.php) service='The One Remote Relay';;
              music.php) service='The One Music Cache';;
              devices.php) service='The One Main Device Registry';;
            esac
            curl -fsS --max-time 15 "https://rubenvanaggelen.com/the-one-remote-api/$endpoint?action=health" |
              php -r '
                $data=json_decode(stream_get_contents(STDIN),true);
                if (!is_array($data) || ($data["ok"]??false)!==true ||
                    ($data["service"]??"")!==$argv[1]) exit(1);
              ' "$service"
          done

          # Missing/invalid identities must reach the correct Family handler,
          # rather than return a generic 403 from the owner-only fallback.
          for action in family_register family_check; do
            case "$action" in
              family_register) expected_error='Unknown app';;
              family_check) expected_error='Invalid device';;
            esac
            output="$stage/probe-$action.json"
            code=$(curl -sS --max-time 15 -o "$output" -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data '{}' \
              "https://rubenvanaggelen.com/the-one-remote-api/devices.php?action=$action")
            test "$code" = "400"
            php -r '
              $data=json_decode(file_get_contents($argv[1]),true);
              if (!is_array($data) || ($data["error"]??"")!==$argv[2]) exit(1);
            ' "$output" "$expected_error"
          done
          trap - ERR
          rm -rf -- "$stage"
          echo "API_DEPLOYMENT_VERIFIED; RECOVERY_SNAPSHOT=$backup"
          REMOTE
