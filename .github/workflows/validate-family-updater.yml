name: Validate cinema-tv update build
on:
  push:
    branches: [feature/cinema-android-autoupdate-20261014]
    paths:
      - 'cinema-tv/**'
      - '.github/workflows/validate-family-updater.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore approved signing identity
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64"
          umask 077
          mkdir -p ~/.android
          printf '%s' "$KEY_B64" | base64 -d > ~/.android/debug.keystore
      - name: Restore approved Cinema logo
        run: |
          python3 - <<'PY_LOGO'
          import pathlib,base64,hashlib
          root=pathlib.Path('cinema-tv')
          encoded=''.join(p.read_text() for p in sorted((root/'branding').glob('cinema-logo-*.base64')))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='99cdfac91335cd1abada5d896ab777b419e4861e4d38c7f79f9469c563ab0807'
          out=root/'app/src/main/res/drawable/cinema_logo.webp'
          out.write_bytes(data)
          PY_LOGO
      - name: Unit tests and compile (no publication)
        working-directory: cinema-tv
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
