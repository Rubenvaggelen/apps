name: Validate live-android update build
on:
  push:
    branches: [feature/tv-android-autoupdate-20261014]
    paths:
      - 'live-android/**'
      - '.github/workflows/validate-family-updater.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore approved signing identity
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64"
          umask 077
          mkdir -p ~/.android
          printf '%s' "$KEY_B64" | base64 -d > ~/.android/debug.keystore
      - name: Unit tests and compile (no publication)
        working-directory: live-android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
