name: Validate series-android update build
on:
  push:
    branches: [feature/series-android-autoupdate-20261014]
    paths:
      - 'series-android/**'
      - '.github/workflows/validate-family-updater.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore approved signing identity
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64"
          umask 077
          mkdir -p ~/.android
          printf '%s' "$KEY_B64" | base64 -d > ~/.android/debug.keystore
      - name: Restore approved Series logo
        run: |
          python3 - <<'PY_LOGO'
          import pathlib,base64,hashlib
          root=pathlib.Path('series-android')
          encoded=''.join(p.read_text() for p in sorted((root/'branding').glob('series-logo-*.base64')))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='1d9035b0bf27692c2a3cb8630af7f36fc600cd72c837198620a7ad57e008e69f'
          out=root/'app/src/main/res/drawable/series_logo.webp'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          PY_LOGO
      - name: Unit tests and compile (no publication)
        working-directory: series-android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
