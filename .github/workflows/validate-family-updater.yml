name: Validate live-android update build
on:
  push:
    branches: [feature/tv-android-autoupdate-20261014]
    paths:
      - 'live-android/**'
      - '.github/workflows/validate-family-updater.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore approved signing identity
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64"
          umask 077
          mkdir -p ~/.android
          printf '%s' "$KEY_B64" | base64 -d > ~/.android/debug.keystore
      - name: Restore approved Cinema logo
        run: |
          python3 - <<'PY_LOGO'
          import pathlib,base64,hashlib
          root=pathlib.Path('live-android')
          encoded=''.join(p.read_text() for p in sorted((root/'branding').glob('tv-logo-*.base64')))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='a752c2df2c05dc6c242d91a2c48b08b59709a69d389495c3feef47ca7ce4b0c9'
          out=root/'app/src/main/res/drawable/tv_logo.webp'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          PY_LOGO
      - name: Restore approved TV launcher banner
        run: |
          python3 - <<'PY_BANNER'
          import pathlib,base64,hashlib
          root=pathlib.Path('live-android')
          encoded=''.join(p.read_text() for p in sorted((root/'branding').glob('tv-banner-*.base64')))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='a7937794dcbe8006959884b2a3912133f638841cf9c94ff85706f6f15d092d08'
          out=root/'app/src/main/res/drawable-xhdpi/tv_banner.png'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          PY_BANNER
      - name: Unit tests and compile (no publication)
        working-directory: live-android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
