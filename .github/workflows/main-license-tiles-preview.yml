name: Main licensed tiles preview
on:
  push:
    branches:
      - feature/main-android-app-tiles-license-prep-20261014
    paths:
      - 'app/**'
      - 'the-one-remote-server/devices.php'
      - '.github/workflows/main-license-tiles-preview.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify PHP licensing endpoint syntax
        run: php -l the-one-remote-server/devices.php
      - name: Restore fixed owner signing identity for preview
        env:
          SIGNING_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          umask 077
          mkdir -p ~/.android
          printf '%s' "$SIGNING_KEY" | base64 -d > ~/.android/debug.keystore
      - name: Validate Main Android code
        env:
          ORG_GRADLE_PROJECT_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ORG_GRADLE_PROJECT_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Store Main test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-license-tiles-preview
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
