name: Build The One Kids 1131 CoComelon Nederlands
on:
  push:
    branches:
      - feature/kids-cocomelon-nederlands-series-1131-20261027
    paths:
      - 'kids-build-1130/**'
      - '.github/workflows/build-kids-cocomelon-1131.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Android 35 components
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore sanitized Android sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kids-build-1130/buildroot
          base64 -d kids-build-1130/source.zip.b64 > /tmp/kids-src.zip
          base64 -d kids-build-1130/images.zip.b64 > /tmp/kids-img.zip
          echo '366a95965282d09c4b71aba8e799ce8d2b69fab664c59933a80ec44e640c23e6  /tmp/kids-src.zip' | sha256sum -c
          echo '81fb267c7bdb5d283fb68cf15266980dc627a7a3338b368034b8bd801a1b519e  /tmp/kids-img.zip' | sha256sum -c
          unzip -q /tmp/kids-src.zip -d kids-build-1130/buildroot
          unzip -q /tmp/kids-img.zip -d kids-build-1130/buildroot/kids/src/main/res
      - name: Apply Dutch CoComelon source patch and regression tests
        run: python3 kids-build-1130/patches/add-cocomelon-1131.py
      - name: Restore stable owner signing identity
        env:
          SIGNING_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_KEY"
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEY" | base64 -d > "$HOME/.android/debug.keystore"
      - name: Build signed CoComelon NL Kids candidate and run unit tests
        run: gradle -p kids-build-1130/buildroot :kids:testDebugUnitTest :kids:assembleDebug --no-daemon --no-build-cache -PappVersionCode=1131
      - name: Verify owner signing identity, build version, and Kids package
        shell: bash
        run: |
          set -euo pipefail
          APK=kids-build-1130/buildroot/kids/build/outputs/apk/debug/kids-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.gmailorg.kids' versionCode='1131'"
      - name: Assert no private assets
        shell: bash
        run: |
          set -euo pipefail
          APK=kids-build-1130/buildroot/kids/build/outputs/apk/debug/kids-debug.apk
          test -s "$APK"
          ! unzip -Z1 "$APK" | grep -q '^assets/private_'
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: the-one-kids-v1131-cocomelon-nl-signed-test
          path: |
            kids-build-1130/buildroot/kids/build/outputs/apk/debug/kids-debug.apk
