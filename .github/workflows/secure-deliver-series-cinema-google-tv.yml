name: Secure one-time delivery of signed Series and Cinema Google TV APKs
on:
  push:
    branches: [transfer/series-cinema-google-tv-owner-apks-20261106]
    paths: [.github/workflows/secure-deliver-series-cinema-google-tv.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Retrieve original encrypted release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/owner-delivery/series /tmp/owner-delivery/cinema
          gh run download 41660845922 --repo Rubenvaggelen/apps --name the-one-series-google-tv-v142 --dir /tmp/owner-delivery/series
          gh run download 41350885003 --repo Rubenvaggelen/apps --name the-one-cinema-google-tv-sony-v145 --dir /tmp/owner-delivery/cinema
          test -s /tmp/owner-delivery/series/The-One-Series-Google-TV-v1.3.5.apk.enc
          test -s /tmp/owner-delivery/series/key.enc
          test -s /tmp/owner-delivery/series/SHA256SUMS.txt
          test -s /tmp/owner-delivery/cinema/The-One-Cinema-Google-TV-v1.4.5.apk.enc
          test -s /tmp/owner-delivery/cinema/key.enc
          test -s /tmp/owner-delivery/cinema/SHA256SUMS.txt
      - name: Decrypt original artifacts only on restricted GitHub runner
        shell: bash
        env:
          OWNER_SIGNING_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$OWNER_SIGNING_KEY"
          base64 -d <<< "$OWNER_SIGNING_KEY" > /tmp/owner-delivery/owner.keystore
          keytool -importkeystore \
            -srckeystore /tmp/owner-delivery/owner.keystore \
            -srcstorepass android -srcalias androiddebugkey \
            -destkeystore /tmp/owner-delivery/owner.p12 \
            -deststoretype PKCS12 -deststorepass changeit \
            -destkeypass changeit -noprompt >/dev/null
          openssl pkcs12 -in /tmp/owner-delivery/owner.p12 \
            -passin pass:changeit -nodes -nocerts \
            -out /tmp/owner-delivery/owner-private.pem >/dev/null 2>&1
          for app in series cinema; do
            case "$app" in
              series) name='The-One-Series-Google-TV-v1.3.5.apk' ;;
              cinema) name='The-One-Cinema-Google-TV-v1.4.5.apk' ;;
            esac
            base="/tmp/owner-delivery/$app"
            openssl pkeyutl -decrypt \
              -inkey /tmp/owner-delivery/owner-private.pem \
              -in "$base/key.enc" -out "$base/unsealed-key" \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
            openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -pass file:"$base/unsealed-key" -in "$base/$name.enc" \
              -out "$base/$name"
            expected=$(awk '{print $1}' "$base/SHA256SUMS.txt" | head -1)
            actual=$(sha256sum "$base/$name" | awk '{print $1}')
            test "$actual" = "$expected" || { echo "SOURCE_CHECKSUM_FAILED:$app"; exit 1; }
            echo "SOURCE_INTEGRITY_VERIFIED:$app"
            rm -f "$base/unsealed-key"
          done
      - name: Verify stable signature, versions, and correct TV package IDs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BT="$ANDROID_HOME/build-tools/35.0.0"
          keytool -exportcert -keystore /tmp/owner-delivery/owner.keystore \
            -storepass android -alias androiddebugkey \
            -file /tmp/owner-delivery/owner-cert.der >/dev/null
          expected_cert=$(sha256sum /tmp/owner-delivery/owner-cert.der | awk '{print $1}')
          for app in series cinema; do
            case "$app" in
              series)
                apk=/tmp/owner-delivery/series/The-One-Series-Google-TV-v1.3.5.apk
                pkg='com.theone.series.tv'; code=142
                ;;
              cinema)
                apk=/tmp/owner-delivery/cinema/The-One-Cinema-Google-TV-v1.4.5.apk
                pkg='com.theone.cinema.tv'; code=145
                ;;
            esac
            "$BT/apksigner" verify --verbose --print-certs "$apk" > "/tmp/owner-delivery/$app.signature.txt"
            grep -qi "certificate SHA-256 digest: $expected_cert" "/tmp/owner-delivery/$app.signature.txt"
            "$BT/aapt" dump badging "$apk" > "/tmp/owner-delivery/$app.badging.txt"
            grep -q "package: name='$pkg' versionCode='$code'" "/tmp/owner-delivery/$app.badging.txt"
            echo "APK_VERSION_SIGNER_VERIFIED:$app"
          done
      - name: Encrypt checked APKs for this chat recipient only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p protected-outputs
          openssl rand -hex 32 > /tmp/owner-delivery/transfer-key
          openssl pkeyutl -encrypt -pubin \
            -inkey ci/owner-transfer-public-key-20261106.pem \
            -in /tmp/owner-delivery/transfer-key \
            -out protected-outputs/recipient-key.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          for app in series cinema; do
            case "$app" in
              series) name='The-One-Series-Google-TV-v1.3.5.apk' ;;
              cinema) name='The-One-Cinema-Google-TV-v1.4.5.apk' ;;
            esac
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -pass file:/tmp/owner-delivery/transfer-key \
              -in "/tmp/owner-delivery/$app/$name" \
              -out "protected-outputs/$name.enc"
            sha256sum "/tmp/owner-delivery/$app/$name" \
              | sed "s|/tmp/owner-delivery/$app/||" >> protected-outputs/SHA256SUMS.txt
          done
          echo "PRIVATE_APKS_REENCRYPTED_FOR_RECIPIENT=1"
          rm -rf /tmp/owner-delivery
      - name: Transfer only encrypted bytes
        uses: actions/upload-artifact@v4
        with:
          name: owner-encrypted-series-v142-cinema-v145
          path: protected-outputs/
          if-no-files-found: error
          retention-days: 1
      - name: Delete temporary encrypted artifacts from runner
        if: always()
        shell: bash
        run: rm -rf /tmp/owner-delivery protected-outputs
