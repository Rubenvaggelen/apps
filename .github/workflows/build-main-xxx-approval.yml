name: Main v1026 XXX Approval Private Build

on:
  push:
    branches: [feature/main-v1025-shopping-whatsapp-20261016]
    paths:
      - 'app/src/main/java/com/gmailorg/hub/MainDeviceRegistry.kt'
      - 'app/src/main/java/com/gmailorg/hub/WakePcActivity.kt'
      - 'app/src/main/java/com/gmailorg/hub/FamilyAccessRequestGrouping.kt'
      - 'ci/publish-main-xxx-devhub.sh'
      - '.github/workflows/build-main-xxx-approval.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Set Main version code
        shell: bash
        run: echo "VERSION_CODE=1026" >> "$GITHUB_ENV"
      - name: Verify YouTube key is configured
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY secret is missing; Main release blocked."
            exit 1
          fi
      - name: Restore and verify existing TMDB key
        shell: bash
        env:
          TMDB_SECRET: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          tmdb_key="$TMDB_SECRET"
          if [ -z "$tmdb_key" ]; then
            tmdb_key="$(sed -n 's/^TMDB_API_KEY[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1 | tr -d '\r')"
          fi
          if [ -z "$tmdb_key" ]; then
            echo "::error::No TMDB key available in secret or existing project configuration."
            exit 1
          fi
          echo "::add-mask::$tmdb_key"
          echo "ORG_GRADLE_PROJECT_TMDB_API_KEY=$tmdb_key" >> "$GITHUB_ENV"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 15 --max-time 30 "https://api.themoviedb.org/3/configuration?api_key=$tmdb_key")"
          if [ "$status" != "200" ]; then
            echo "::error::Existing TMDB key validation failed (HTTP $status)."
            exit 1
          fi
          echo "TMDB key validated without displaying credentials."
      - name: Restore the working Media Player source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 120 "https://github.com/Rubenvaggelen/apps/releases/download/media-player-v2316/The-One-Media-Player-v2316.apk" -o /tmp/theone-media-source.apk
          echo "2de34daf9ef65ed045a8c49bd337bd9283841a12d2c3047784f40c76e48c6cb8  /tmp/theone-media-source.apk" | sha256sum --check --status
          python3 - <<'PY'
          import zipfile,json,pathlib
          with zipfile.ZipFile("/tmp/theone-media-source.apk") as apk:
              config=json.loads(apk.read("assets/private_xtream.json"))
          if not all(isinstance(config.get(key),str) and config[key].strip() for key in ("server","username","password")):
              raise SystemExit("Working Media Player configuration unavailable; release blocked.")
          target=pathlib.Path("app/src/main/assets/theone_media_source.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(config))
          print("Working Media Player source restored; credentials not displayed.")
          PY
      - name: Bundle verified offline NL supermarket map
        run: python3 .github/scripts/supermarket-snapshot.py
      - name: Build Main only
        env:
          ORG_GRADLE_PROJECT_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --no-build-cache -PappVersionCode=${VERSION_CODE}
      - name: Verify TMDB key is included in Main
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, json
          files = list(pathlib.Path("app/build/generated").rglob("BuildConfig.java"))
          expected = os.environ["ORG_GRADLE_PROJECT_TMDB_API_KEY"]
          found = False
          for path in files:
              text = path.read_text()
              match = re.search(r'TMDB_API_KEY\s*=\s*("(?:[^"\\]|\\.)*")', text)
              if match and json.loads(match.group(1)) == expected:
                  found = True
          if not found:
              raise SystemExit("TMDB key missing from generated Main configuration; release blocked.")
          print("Existing TMDB key included in Main; value not displayed.")
          PY
      - name: Verify independent XXX approval UI and Android package
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ACCESS_MEDIA_PLAYER_XXX' app/src/main/java/com/gmailorg/hub/MainDeviceRegistry.kt
          grep -q 'Media Player XXX' app/src/main/java/com/gmailorg/hub/WakePcActivity.kt
          grep -q 'MainDeviceRegistry.ACCESS_MEDIA_PLAYER_XXX' app/src/main/java/com/gmailorg/hub/FamilyAccessRequestGrouping.kt
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "name='com.gmailorg.hub'.*versionCode='1026'"

      - name: Publish only Main v1026 privately in Dev Hub
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash ci/publish-main-xxx-devhub.sh
