name: Apply Family approval UI fix safely
on:
  push:
    branches: [feature/main-android-app-tiles-license-prep-20261014]
    paths:
      - ci/fix-family-owner-approval-ui.py
      - .github/workflows/apply-family-approval-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply focused Family permission UI patch
        run: |
          python3 ci/fix-family-owner-approval-ui.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/main-license-tiles-preview.yml')
          content=p.read_text(encoding='utf-8')
          assert 'appVersionCode=1017' in content
          assert 'main-license-tiles-preview-v1017' in content
          p.write_text(content.replace('appVersionCode=1017','appVersionCode=1018').replace('main-license-tiles-preview-v1017','main-license-tiles-preview-v1018'),encoding='utf-8')
          print('Main 1018 build planned')
          PY
          git diff --check
          git diff --stat
      - name: Commit narrow patch for Main v1018
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gmailorg/hub/WakePcActivity.kt .github/workflows/main-license-tiles-preview.yml
          git commit -m "Show owner PIN dialog on Cinema Series and TV approval actions"
          git push origin HEAD:feature/main-android-app-tiles-license-prep-20261014
