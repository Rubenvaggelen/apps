name: Build The One Main APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-main.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Set Main version code
        shell: bash
        run: echo "VERSION_CODE=$((923 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Verify YouTube key is configured
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY secret is missing; Main release blocked."
            exit 1
          fi
      - name: Build Main only
        env:
          ORG_GRADLE_PROJECT_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ORG_GRADLE_PROJECT_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle :app:assembleDebug --no-daemon --no-build-cache -PappVersionCode=${VERSION_CODE}
      - name: Release Main only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-v${{ env.VERSION_CODE }}
          name: "The One Main — build ${{ env.VERSION_CODE }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
