name: Build Studio APKs

on:
  push:
    branches: [ studio-domain ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-studio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Studio branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Build separate Studio apps
        run: gradle clean :app:assembleDebug :carradio:assembleDebug --no-daemon --no-build-cache -PappVersionCode=${{ github.run_number }}

      - name: Give APKs clear names
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk The-One-Studio.apk
          cp carradio/build/outputs/apk/debug/carradio-debug.apk The-One-Car-Studio.apk

      - name: Upload both Studio APKs
        uses: actions/upload-artifact@v4
        with:
          name: the-one-studio-apps
          path: |
            The-One-Studio.apk
            The-One-Car-Studio.apk
