name: Rutu Klant v939 - Rutu Spicy Wings
on:
  push:
    branches: [feature/rutu-spicy-wings-eur4-20261021]
    paths: [.github/workflows/rutu-spicy-wings-customer-v939-candidate.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify customer app stock render and prior API regression
        shell: bash
        run: |
          set -euo pipefail
          php -l rutu-server/index.php
          python3 scripts/test-rutu-stock.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path('jadeorders/src/main/java/com/vanaggelen/jadeorders/MainActivity.kt').read_text()
          assert 'soldOut: Set<String> = emptySet()' in src
          assert 'obj.optJSONArray("sold_out")' in src
          assert 'if (soldOut) label(' in src
          assert 'if (name !in announcement.soldOut)' in src
          assert 'val soldInCart = cart.keys.filter' in src
          print('CUSTOMER_SOLD_OUT_VIEW_AND_CART_CONTRACT_OK')
          PY
      - name: Validate selected Spicy Wings product and image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          customer=Path('jadeorders/src/main/java/com/vanaggelen/jadeorders/MainActivity.kt').read_text()
          photo=Path('jadeorders/src/main/res/drawable-nodpi/menu_rutu_spicy_wings.webp').read_bytes()
          assert 'R.drawable.menu_rutu_spicy_wings' in customer
          assert 'Rutu Spicy Wings", 4.00, "Extra' in customer
          assert photo[:4]==b'RIFF' and photo[8:12]==b'WEBP'
          assert hashlib.sha256(photo).hexdigest()=='41f9df4fb2cff20d4a9811fc0f19b8b8039dcc2c2f34dcec49ea7e140c807596'
          print('RUTU_CUSTOMER_SPICY_WINGS_PHOTO_OK')
          PY
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Use original RUTU Android signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64"
          install -d -m 0700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 0600 "$HOME/.android/debug.keystore"
      - name: Compile only RUTU Klant v939
        run: gradle :jadeorders:assembleDebug --no-daemon --no-build-cache -PappVersionCode=939
      - name: Verify version, package and signing identity against current customer app
        shell: bash
        run: |
          set -euo pipefail
          apk=jadeorders/build/outputs/apk/debug/jadeorders-debug.apk
          test -s "$apk"
          sdk="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          signer="$sdk/apksigner"
          aapt="$sdk/aapt"
          "$aapt" dump badging "$apk" | grep -F "versionCode='939'"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.vanaggelen.jadeorders'"
          curl -fLsS --max-time 90 'https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Android.apk' -o /tmp/rutu-customer-v938.apk
          test "$(sha256sum /tmp/rutu-customer-v938.apk | awk '{print $1}')" = 668651f13408998ab0a70a080c011f464faba3b3ae49019357d06d5a524ed53c
          "$aapt" dump badging /tmp/rutu-customer-v938.apk | grep -F "versionCode='938'"
          "$signer" verify --print-certs "$apk" >/tmp/new-client-cert
          "$signer" verify --print-certs /tmp/rutu-customer-v938.apk >/tmp/old-client-cert
          old="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/old-client-cert | head -1)"
          new="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/new-client-cert | head -1)"
          test -n "$old" && test "$old" = "$new"
          echo 'RUTU_CUSTOMER_V939_COMPATIBLE_SIGNING_OK'
      - uses: actions/upload-artifact@v4
        with:
          name: rutu-klant-v939-spicy-wings-candidate
          path: jadeorders/build/outputs/apk/debug/jadeorders-debug.apk
          if-no-files-found: error
