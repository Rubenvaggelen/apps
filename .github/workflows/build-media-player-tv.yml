name: Build The One Media Player TV

on:
  push:
    paths:
      - 'media-player/app/**'
      - 'media-player/tvapp/**'
      - 'media-player/settings.gradle.kts'
      - '.github/workflows/build-media-player-tv.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore permanent TV signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          test -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android >/dev/null

      - name: Keep working YouTube configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("the-one-update/app/build.gradle").read_text(encoding="utf-8")
          tail = source.split("YOUTUBE_API_KEY", 1)[1]
          m = re.search(r"\?:\s*'([^']+)'", tail)
          if not m:
              raise SystemExit("YouTube build configuration unavailable")
          Path("media-player/app/src/main/assets/private_youtube_key.txt").write_text(m.group(1), encoding="utf-8")
          PY

      - name: Build Android TV APK
        run: gradle -p media-player :tvapp:assembleDebug --no-daemon

      - name: Name TV APK
        shell: bash
        run: |
          cp media-player/tvapp/build/outputs/apk/debug/tvapp-debug.apk              media-player/tvapp/build/outputs/apk/debug/The-One-Media-Player-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: the-one-media-player-tv
          path: media-player/tvapp/build/outputs/apk/debug/The-One-Media-Player-TV.apk

      - name: Publish stable Android TV download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="media-player-tv-latest"
          APK="media-player/tvapp/build/outputs/apk/debug/The-One-Media-Player-TV.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "The One Media Player • Android TV" --notes "Aparte Android TV APK van The One Media Player. Bediening met afstandsbediening en Android/Google TV launcher."
          fi
