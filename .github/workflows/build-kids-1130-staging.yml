name: Build Kids 1130 staging
on:
  push:
    branches:
      - kids1130-apk-transfer-20261023
    paths:
      - 'kids-build-1130/**'
      - '.github/workflows/build-kids-1130-staging.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Android 35 components
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore sanitized Android sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kids-build-1130/buildroot
          base64 -d kids-build-1130/source.zip.b64 > /tmp/kids-src.zip
          base64 -d kids-build-1130/images.zip.b64 > /tmp/kids-img.zip
          echo '366a95965282d09c4b71aba8e799ce8d2b69fab664c59933a80ec44e640c23e6  /tmp/kids-src.zip' | sha256sum -c
          echo '81fb267c7bdb5d283fb68cf15266980dc627a7a3338b368034b8bd801a1b519e  /tmp/kids-img.zip' | sha256sum -c
          unzip -q /tmp/kids-src.zip -d kids-build-1130/buildroot
          unzip -q /tmp/kids-img.zip -d kids-build-1130/buildroot/kids/src/main/res
      - name: Create disposable CI debug signing keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Kids CI Only, O=The One, C=NL' -keyalg RSA -keysize 2048 -validity 90 -noprompt
      - name: Build unsigned-private-data-free test APK
        run: gradle -p kids-build-1130/buildroot :kids:testDebugUnitTest :kids:assembleDebug --no-daemon --no-build-cache -PappVersionCode=1130
      - name: Assert no private assets
        shell: bash
        run: |
          set -euo pipefail
          APK=kids-build-1130/buildroot/kids/build/outputs/apk/debug/kids-debug.apk
          test -s "$APK"
          ! unzip -Z1 "$APK" | grep -q '^assets/private_'
          sha256sum "$APK"
      - name: Save signer tool for private offline signing
        shell: bash
        run: |
          mkdir -p kids-build-1130/sign-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" kids-build-1130/sign-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: kids-1130-sanitized-unsigned-private
          path: |
            kids-build-1130/buildroot/kids/build/outputs/apk/debug/kids-debug.apk
            kids-build-1130/sign-tools/apksigner.jar
