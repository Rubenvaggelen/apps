name: RUTU Bedrijf v939 Gratis betaalwijze + naam - signed candidate
on:
  push:
    branches: [feature/rutu-bedrijf-gratis-betaling-v939-20261021]
    paths: [.github/workflows/rutu-gratis-v939-candidate.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Lint backend and client JavaScript
        shell: bash
        run: |
          set -euo pipefail
          php -l rutu-server/index.php
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('rutubusinessandroid/src/main/assets/business.html').read_text()
          php=Path('rutu-server/index.php').read_text()
          assert 'business_customer_registrations' in html and "textContent=c.name" in html
          assert "if ($action === 'business_customer_registrations')" in php
          assert "'registration_type' => 'customer_devices'" in php
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert scripts
          Path('/tmp/rutu-inline.js').write_text('\n'.join(scripts))
          print('KLA NTENBEHEER_SOURCE_CONTRACT_OK')
          PY
          node --check /tmp/rutu-inline.js
          node --check rutubusinessandroid/src/main/assets/rutu-pos.js
      - name: Test authenticated registration API against isolated fixtures
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/www/rutu-api" "$root/rutu-data"
          cp rutu-server/index.php "$root/www/rutu-api/index.php"
          printf '%s\n' 'isolated-ci-business-key' > "$root/rutu-data/business.key"
          cat > "$root/rutu-data/devices.json" <<'JSON'
          {"devices":{"test-device-1":{"registered":"2026-10-17T10:00:00+00:00","customer":"Klant A"},"test-device-2":{"registered":"2026-10-18T10:00:00+00:00","customer":"Klant B"},"test-device-3":{"registered":"2026-10-19T10:00:00+00:00","customer":""}}}
          JSON
          php -S 127.0.0.1:18774 -t "$root/www" >/tmp/rutu-php-test.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$root"' EXIT
          sleep 1
          url='http://127.0.0.1:18774/rutu-api/index.php?action=business_customer_registrations'
          denied="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
          test "$denied" = 401
          denied="$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Rutu-Business-Key: invalid-key' "$url")"
          test "$denied" = 401
          result="$(curl -fsS -H 'X-Rutu-Business-Key: isolated-ci-business-key' "$url")"
          echo "$result" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["ok"] and d["registration_type"]=="customer_devices";assert d["count"]==3 and len(d["registrations"])==3;assert sorted(x["name"] for x in d["registrations"])==["","Klant A","Klant B"];assert all(len(x["id"])==24 for x in d["registrations"]);assert "test-device-" not in json.dumps(d)'
          echo 'RUTU_ISOLATED_AUTH_AND_REGISTRATION_SCHEMA_OK'
      - name: Test Gratis POS on isolated disposable PHP server
        run: python3 scripts/test-rutu-gratis-pos.py
      - name: Load fixed original APK signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo 'Signing secret unavailable'; exit 1; }
          install -d -m 0700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 0600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android >/dev/null
      - name: Build test-only Business v939
        run: gradle :rutubusinessandroid:assembleDebug --no-daemon --no-build-cache -PappVersionCode=939
      - name: Verify signature matches the current live v938 APK
        shell: bash
        run: |
          set -euo pipefail
          apk='rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk'
          test -s "$apk"
          tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          signer="$tools/apksigner"
          "$signer" verify --print-certs "$apk" > /tmp/rutu-candidate-signature.txt
          curl -fLsS --max-time 80 --retry 2 'https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Bedrijf-Android.apk' -o /tmp/rutu-v937.apk
          expected='a9756c70416a14bece36e369301768477cda3c6317eaa6dfc4a1a1b2979b313d'
          actual="$(sha256sum /tmp/rutu-v937.apk | awk '{print $1}')"
          test "$actual" = "$expected" || { echo 'Current production APK differs, no assumption about signing identity'; exit 1; }
          "$signer" verify --print-certs /tmp/rutu-v937.apk > /tmp/rutu-production-signature.txt
          old="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/rutu-production-signature.txt | head -1)"
          new="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/rutu-candidate-signature.txt | head -1)"
          test -n "$old" && test "$old" = "$new" || { echo 'Signature mismatch'; exit 1; }
          echo 'RUTU_V939_CERT_MATCHES_LIVE_V938'
      - uses: actions/upload-artifact@v4
        with:
          name: rutu-bedrijf-gratis-v939-candidate
          path: rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk
          if-no-files-found: error
