name: Family license server guarded deployment
on:
  push:
    branches: [feature/main-android-app-tiles-license-prep-20261014]
    paths: [.github/workflows/family-license-deploy.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  guarded-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Test isolated license contract
        run: |
          php -l the-one-remote-server/devices.php
          php the-one-remote-server/tests/family-license-smoke.php
      - name: Guarded merge and live deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE DEPLOY_KNOWN_HOSTS; do
            test -n "$(printenv "$v")" || { echo "Missing $v"; exit 1; }
          done
          d=$(mktemp -d)
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$d"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$d/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$d/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$d/askpass"
          chmod 600 "$d/key" "$d/known_hosts"
          chmod 700 "$d/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$d/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$d/key" </dev/null
          unset DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE
          o=(-i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=20)
          git fetch --no-tags origin main
          git show origin/main:the-one-remote-server/devices.php > "$d/baseline.php"
          base=$(sha256sum "$d/baseline.php" | cut -d ' ' -f1)
          remote=$(ssh -p "$DEPLOY_PORT" "${o[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'test -f "$HOME/public_html/the-one-remote-api/devices.php" && php -l "$HOME/public_html/the-one-remote-api/devices.php" >/dev/null && sha256sum "$HOME/public_html/the-one-remote-api/devices.php" | cut -d " " -f1')
          test "${#remote}" -eq 64
          if [ "$remote" = "$base" ]; then
            echo 'PREFLIGHT_RESULT=base-matches-live'
          else
            echo 'PREFLIGHT_RESULT=live-server-drift'
            echo '::warning::Live PHP differs from repository baseline. Do not overwrite without reconciliation.'
          fi
          echo "LIVE_SHA256=$remote"
          echo "BASELINE_SHA256=$base"
          # Compare only function/action names and changed-line counts, never print live source.
          ssh -p "$DEPLOY_PORT" "${o[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'cat "$HOME/public_html/the-one-remote-api/devices.php"' > "$d/live.php"
          python3 - "$d/baseline.php" "$d/live.php" <<'PY'
          import sys,re,difflib
          old=open(sys.argv[1],encoding='utf-8').read().splitlines()
          new=open(sys.argv[2],encoding='utf-8').read().splitlines()
          changes=[x for x in difflib.SequenceMatcher(a=old,b=new,autojunk=False).get_opcodes() if x[0]!='equal']
          print('DRIFT_HUNKS='+str(len(changes)))
          print('DRIFT_LINES='+str(sum((a2-a1)+(b2-b1) for _,a1,a2,b1,b2 in changes)))
          pats=r'function\s+[a-zA-Z_][a-zA-Z0-9_]*|\$action\s*===\s*[\x27\x22][a-zA-Z0-9_]+[\x27\x22]'
          labels=set()
          for _,a1,a2,b1,b2 in changes:
              for seq,lo,hi in ((old,a1,a2),(new,b1,b2)):
                  text='\n'.join(seq[max(0,lo-50):min(len(seq),hi+20)])
                  labels.update(re.findall(pats,text))
          print('DRIFT_SYMBOLS='+','.join(sorted(labels)[:35]))
          PY

          # Three-way merge: current live file + GitHub main baseline + new Family changes.
          if git merge-file -p "$d/live.php" "$d/baseline.php" the-one-remote-server/devices.php > "$d/merged.php"; then
            echo 'MERGE_RESULT=clean'
          else
            echo 'MERGE_RESULT=conflict; do not deploy'
            exit 31
          fi
          php -l "$d/merged.php"
          python3 - "$d/live.php" "$d/merged.php" <<'CHECK'
          import sys,re
          def symbols(path):
              code=open(path,encoding='utf-8').read()
              return set(re.findall(r'function\s+([a-zA-Z_][\w]*)\s*\(',code)) | set(re.findall(r'\$action\s*===\s*[\x27\x22]([\w]+)[\x27\x22]',code))
          missing=symbols(sys.argv[1])-symbols(sys.argv[2])
          if missing:
              raise SystemExit('MERGE_REJECTED: existing functions/actions would be lost: '+','.join(sorted(missing)))
          print('MERGE_SYMBOLS_PRESERVED=true')
          CHECK
          cp "$d/merged.php" the-one-remote-server/devices.php
          php the-one-remote-server/tests/family-license-smoke.php
          echo 'MERGED_LICENSE_SMOKE=passed'
          # Install only after a clean 3-way merge, signature-preserving backup,
          # syntax validation, and the isolated Family HTTP contract test.
          stage=$(ssh -p "$DEPLOY_PORT" "${o[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; mktemp -d "$HOME/.the-one-family-stage.XXXXXXXX"')
          scp -O -P "$DEPLOY_PORT" "${o[@]}" "$d/merged.php" "$DEPLOY_USER@$DEPLOY_HOST:$stage/devices.php"
          ssh -p "$DEPLOY_PORT" "${o[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$stage' '$remote'" <<'REMOTE'
          set -euo pipefail
          umask 077
          stage="$1"
          expected="$2"
          target="$HOME/public_html/the-one-remote-api/devices.php"
          test -f "$target"
          actual=$(sha256sum "$target" | cut -d ' ' -f1)
          test "$actual" = "$expected" || { echo 'DEPLOY_ABORTED=live-changed'; exit 9; }
          php -l "$stage/devices.php" >/dev/null
          mkdir -p "$HOME/.the-one-family-backups"
          backup=$(mktemp -d "$HOME/.the-one-family-backups/licensing.XXXXXXXX")
          cp -p "$target" "$backup/devices.php"
          for file in main-devices.json main-device-owner.json; do
            if [ -f "$HOME/the-one-remote-data/$file" ]; then
              cp -p "$HOME/the-one-remote-data/$file" "$backup/$file"
            fi
          done
          candidate=$(mktemp "$target.new.XXXXXXXX")
          cp "$stage/devices.php" "$candidate"
          chmod 644 "$candidate"
          mv "$candidate" "$target"
          if ! curl -fsS --max-time 15 'https://rubenvanaggelen.com/the-one-remote-api/devices.php?action=health' | grep -q '"ok":true'; then
            rollback=$(mktemp "$target.rollback.XXXXXXXX")
            cp -p "$backup/devices.php" "$rollback"
            mv "$rollback" "$target"
            echo 'DEPLOY_RESULT=rolled-back-health-check'
            exit 15
          fi
          rm -f "$stage/devices.php"
          rmdir "$stage"
          echo 'DEPLOY_RESULT=success'
          echo 'BACKUP_RESULT=preserved'
          REMOTE
