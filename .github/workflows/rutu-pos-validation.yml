name: Rutu POS isolated validation

on:
  push:
    branches: [feature/rutu-pos-menu-20261014, feature/rutu-bbqextra-menu-20261014]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and isolated POS integration
        run: |
          php -l rutu-server/index.php
          python3 tests/test_rutu_pos.py
      - name: Check menu images and JS syntax
        run: |
          set -euo pipefail
          node --check rutu-windows/rutu-pos.js
          node --check rutubusinessandroid/src/main/assets/rutu-pos.js
          for p in menu_bbq_extra.webp menu_extra_bout.webp menu_extra_salade.webp; do
            test -s "rutu-windows/assets/menu/$p"
            test -s "rutubusinessandroid/src/main/assets/menu/$p"
            test -s "jadeorders/src/main/res/drawable-nodpi/$p"
          done
          grep -q '"rutu-pos.js"' rutu-windows/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore fixed debug signing key
        shell: bash
        env:
          FIXED_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIXED_KEYSTORE" || { echo "Missing fixed debug signing key"; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$FIXED_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Compile the two Android apps
        run: |
          gradle :jadeorders:assembleDebug :rutubusinessandroid:assembleDebug --no-daemon --no-build-cache -PappVersionCode=999
