name: Build and verify rutubusinessandroid 946
on:
  push:
    branches:
      - fix/rutu-bedrijf-v946-updatecontrole-20261031
    paths:
      - 'rutubusinessandroid/**'
      - '.github/workflows/rutu-business-v946-updater-20261031.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Check approved baseline and requested change
        shell: bash
        run: |
          set -euo pipefail
          test -s 'rutubusinessandroid/src/main/assets/business.html'
          grep -q 'qrPreview' rutubusinessandroid/src/main/assets/business.html
          test -s rutubusinessandroid/src/main/assets/rutu-android-qr.png
          grep -q 'openQrModal' rutubusinessandroid/src/main/assets/business.html
          grep -q 'downloads.theoneforlive.com/rutu-updates/business-android.json' rutubusinessandroid/src/main/java/com/vanaggelen/rutubusiness/RutuBusinessUpdateChecker.kt
          grep -q 'Rutu-BBQ-Bedrijf-Android-v946.apk' rutubusinessandroid/src/main/java/com/vanaggelen/rutubusiness/RutuBusinessUpdateChecker.kt
      - name: Restore fixed app signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64"
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android >/dev/null
      - name: Build approved Rutu app v946
        run: gradle :rutubusinessandroid:assembleDebug --no-daemon --no-build-cache -PappVersionCode=946
      - name: Verify APK version, package and signing against installed release
        shell: bash
        run: |
          set -euo pipefail
          apk='rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk'
          test -s "$apk"
          sdk="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$sdk/aapt" dump badging "$apk" | grep -F "package: name='com.vanaggelen.rutubusiness' versionCode='946'"
          "$sdk/apksigner" verify "$apk"
          curl -fLsS --retry 3 --max-time 90 'https://downloads.theoneforlive.com/rutu-updates/Rutu-BBQ-Bedrijf-Android.apk' -o /tmp/rutu-baseline.apk
          before="$("$sdk/apksigner" verify --print-certs /tmp/rutu-baseline.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          after="$("$sdk/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          test -n "$before" && test "$before" = "$after"
          unzip -p "$apk" assets/rutu-android-qr.png | sha256sum
      - uses: actions/upload-artifact@v4
        with:
          name: RUTU-Bedrijf-v946-Updatecontrole
          path: rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk
          if-no-files-found: error
      - name: Create verified recovery release (no production updater change)
        shell: bash
        run: cp 'rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk' 'RUTU-Bedrijf-v946-Updatecontrole.apk'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rutu-bedrijf-v946-updatecontrole-20261031
          name: 'RUTU-Bedrijf-v946-Updatecontrole'
          files: 'RUTU-Bedrijf-v946-Updatecontrole.apk'
          generate_release_notes: false
