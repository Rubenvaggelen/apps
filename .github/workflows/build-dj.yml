name: Build The One DJ APK

on:
  push:
    branches: [ main ]
    paths:
      - 'thedj/**'
      - '.github/workflows/build-dj.yml'
      - 'windows/the-one-dj/index.html'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-dj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Set independent DJ version code
        shell: bash
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Auto DJ selection and background playback
        run: |
          node windows/the-one-dj/tests/smart-selection.cjs
          node windows/the-one-dj/tests/background-playback.cjs
      - name: Build DJ only
        run: gradle :thedj:assembleDebug --no-daemon --no-build-cache -PappVersionCode=${VERSION_CODE}
      - name: Release DJ only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dj-v${{ env.VERSION_CODE }}
          name: "The One DJ — build ${{ env.VERSION_CODE }}"
          files: thedj/build/outputs/apk/debug/thedj-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
