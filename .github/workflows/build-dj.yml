name: Build The One DJ APK

on:
  push:
    branches: [ main ]
    paths:
      - 'thedj/**'
      - 'windows/the-one-dj/index.html'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-dj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Build DJ only
        run: gradle :thedj:assembleDebug --no-daemon --no-build-cache -PappVersionCode=${{ github.run_number }}
      - name: Release DJ only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dj-v${{ github.run_number }}
          name: "The One DJ — build ${{ github.run_number }}"
          files: thedj/build/outputs/apk/debug/thedj-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
