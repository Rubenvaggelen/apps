name: Build The One Run APK

on:
  push:
    branches: [ main ]
    paths:
      - 'runcoach/**'
      - '.github/workflows/build-run.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Set Run version code
        shell: bash
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build Run only
        run: gradle :runcoach:assembleDebug --no-daemon --no-build-cache -PappVersionCode=${VERSION_CODE}
      - name: Release Run only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-v${{ env.VERSION_CODE }}
          name: "The One Run — build ${{ env.VERSION_CODE }}"
          files: runcoach/build/outputs/apk/debug/runcoach-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
