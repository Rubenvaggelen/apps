name: The One TV Android v109 — XXX category and adult isolation
on:
  push:
    branches: [feature/tv-android-autoupdate-20261014]
    paths: [live-android/**, ci/publish-tv-android-candidate.sh, .github/workflows/live-android.yml]
permissions:
  contents: read
concurrency:
  group: live-android-current
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v3
        with: {gradle-version: '8.7'}
      - name: Restore stable owner signing identity
        env:
          SIGNING_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_KEY"
          mkdir -p ~/.android
          printf '%s' "$SIGNING_KEY" | base64 -d > ~/.android/debug.keystore
      - name: Restore verified existing Media Player configuration
        run: |
          set -euo pipefail
          umask 077
          curl -fLsS --max-time 120 'https://github.com/Rubenvaggelen/apps/releases/download/media-player-v2400/The-One-Media-Player-v2400.apk' -o /tmp/cinema-source.apk
          echo 'a76dfa81c8670d1c044776fa1f10264eff958eca64339d6dd0d6f6ccedb3e04b  /tmp/cinema-source.apk' | sha256sum --check --status
          python3 - <<'PY'
          import zipfile,json,pathlib,hmac,hashlib
          with zipfile.ZipFile('/tmp/cinema-source.apk') as z:
              c=json.loads(z.read('assets/private_xtream.json'))
          if not all(isinstance(c.get(k),str) and c[k].strip() for k in ['server','username','password']):
              raise SystemExit('Media Player configuration unavailable')
          p=pathlib.Path('live-android/app/src/main/assets/private_cinema.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          token=hmac.new(c['password'].encode(),b'the-one-cinema-relay-v1',hashlib.sha256).hexdigest()
          (p.parent/'private_xtream_primary.json').write_text(json.dumps(c))
          PY
          keytool -importkeystore -srckeystore ~/.android/debug.keystore -srcstorepass android -srcalias androiddebugkey -destkeystore /tmp/cinema-signing.p12 -deststoretype PKCS12 -deststorepass changeit -destkeypass changeit -noprompt >/dev/null
          openssl pkcs12 -in /tmp/cinema-signing.p12 -passin pass:changeit -nodes -nocerts -out /tmp/cinema-private.pem >/dev/null 2>&1
          base64 -d live-android/secondary-source.enc.b64 > /tmp/cinema-secondary.enc
          openssl pkeyutl -decrypt -inkey /tmp/cinema-private.pem -in /tmp/cinema-secondary.enc -out live-android/app/src/main/assets/private_xtream_secondary.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python3 - <<'PY_VERIFY'
          import json,pathlib
          c=json.loads(pathlib.Path('live-android/app/src/main/assets/private_xtream_secondary.json').read_text())
          assert c['server']=='http://cqqwnnig.bulidns.com' and all(c.get(k) for k in ['username','password'])
          PY_VERIFY
          rm /tmp/cinema-signing.p12 /tmp/cinema-private.pem /tmp/cinema-secondary.enc
          rm /tmp/cinema-source.apk
      - name: Restore approved Cinema logo
        run: |
          python3 - <<'PY_LOGO'
          import pathlib,base64,hashlib
          root=pathlib.Path('live-android')
          encoded=''.join(p.read_text() for p in sorted((root/'branding').glob('tv-logo-*.base64')))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='a752c2df2c05dc6c242d91a2c48b08b59709a69d389495c3feef47ca7ce4b0c9'
          out=root/'app/src/main/res/drawable/tv_logo.webp'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          PY_LOGO
      - name: Restore approved TV launcher banner
        run: |
          python3 - <<'PY_BANNER'
          import pathlib,base64,hashlib
          root=pathlib.Path('live-android')
          encoded=''.join(p.read_text() for p in sorted((root/'branding').glob('tv-banner-*.base64')))
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='a7937794dcbe8006959884b2a3912133f638841cf9c94ff85706f6f15d092d08'
          out=root/'app/src/main/res/drawable-xhdpi/tv_banner.png'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          PY_BANNER
      - name: Verify native playback test fixture
        run: |
          python3 - <<'PY_FIXTURE'
          import pathlib,base64,hashlib
          root=pathlib.Path('live-android')
          data=base64.b64decode((root/'tests/test-clip.mp4.base64').read_text(),validate=False)
          digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()
          assert digest=='5f9ae34ede49119e518895d59deccba6f242ade0', 'Fixture integrity mismatch'
          p=root/'app/src/debug/assets/test-clip.mp4'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(data)
          PY_FIXTURE
      - name: Verify XXX navigation retains exact channel list
        run: |
          set -euo pipefail
          FILE=live-android/app/src/main/java/com/theone/tv/phone/MainActivity.java
          grep -Fq 'returnButton=button("← Terug naar vorige zenderlijst"' "$FILE"
          grep -Fq 'xxxReturnLocation=rememberListPosition()' "$FILE"
          grep -Fq 'pendingListRestore=previous' "$FILE"
          grep -Fq 'grid.setSelectionFromTop(row,restore.topOffset)' "$FILE"
          grep -Fq 'if(section.equals("xxx")){returnFromXxx();return;}' "$FILE"
          grep -Fq 'playerReturnLocation=rememberListPosition()' "$FILE"
      - name: Verify separate XXX folder and age gate
        run: |
          set -euo pipefail
          grep -Fq 'catalogs.put("xxx",adult)' live-android/app/src/main/java/com/theone/tv/phone/MainActivity.java
          grep -Fq 'adultConfirmed=true;switchSection("xxx")' live-android/app/src/main/java/com/theone/tv/phone/MainActivity.java
          grep -Fq 'live-v2-adult-routed.bin' live-android/app/src/main/java/com/theone/tv/phone/MediaRepository.java
          grep -Fq 'this.category=(adultTitle(title)||adultTitle(category))?"XXX"' live-android/app/src/main/java/com/theone/tv/phone/CatalogEntry.java
      - name: Build and unit test independent TV APK
        working-directory: live-android
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Verify TV launcher package and signature
        working-directory: live-android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/cinema-signature.txt
          keytool -exportcert -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -file /tmp/cinema-owner.der >/dev/null
          OWNER_SHA=$(sha256sum /tmp/cinema-owner.der | cut -d " " -f1)
          grep -i "certificate SHA-256 digest: $OWNER_SHA" /tmp/cinema-signature.txt
          "$BT/aapt" dump badging "$APK" > /tmp/cinema-badging.txt
          grep "package: name='com.theone.tv.phone' versionCode='109'" /tmp/cinema-badging.txt
          grep 'launchable-activity' /tmp/cinema-badging.txt
          mkdir -p deliverable
          cp "$APK" deliverable/The-One-TV-Android-v1.0.9.apk
          sha256sum deliverable/The-One-TV-Android-v1.0.9.apk > deliverable/SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test TV remote navigation, language choice and native playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd live-android && gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Encrypt personal APK before artifact publication
        if: success()
        working-directory: live-android
        run: |
          set -euo pipefail
          umask 077
          mkdir -p protected-deliverable
          openssl rand -hex 32 > /tmp/cinema-artifact-key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass file:/tmp/cinema-artifact-key -in deliverable/The-One-TV-Android-v1.0.9.apk -out protected-deliverable/The-One-TV-Android-v1.0.9.apk.enc
          openssl pkeyutl -encrypt -pubin -inkey owner-artifact-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/cinema-artifact-key -out protected-deliverable/key.enc
          cp deliverable/SHA256SUMS.txt protected-deliverable/SHA256SUMS.txt
          rm /tmp/cinema-artifact-key
      - name: Save personal installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: the-one-live-android-v109
          path: live-android/protected-deliverable/
          retention-days: 7
      - name: Publish Android v109 candidate to authenticated test download only
        if: success()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BUILD_APK_PATH: live-android/deliverable/The-One-TV-Android-v1.0.9.apk
          BUILD_APK_NAME: The-One-TV-Android-1.0.9.apk
        run: bash ci/publish-tv-android-candidate.sh
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-android-test-reports
          path: |
            live-android/app/build/reports/tests/
            live-android/app/build/reports/androidTests/
          retention-days: 7
