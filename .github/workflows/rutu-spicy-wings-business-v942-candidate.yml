name: RUTU Bedrijf v942 - Rutu Spicy Wings
on:
  push:
    branches: [feature/rutu-spicy-wings-eur4-20261021]
    paths: [.github/workflows/rutu-spicy-wings-business-v942-candidate.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK supplied with GitHub Linux runner
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT" || test -d "$ANDROID_HOME" || { echo "Runner Android SDK missing"; exit 1; }
          echo 'ANDROID_SDK_AVAILABLE'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Lint backend and client JavaScript
        shell: bash
        run: |
          set -euo pipefail
          php -l rutu-server/index.php
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('rutubusinessandroid/src/main/assets/business.html').read_text()
          php=Path('rutu-server/index.php').read_text()
          assert 'business_customer_registrations' in html and "textContent=c.name" in html
          assert "if ($action === 'business_customer_registrations')" in php
          assert "'registration_type' => 'customer_devices'" in php
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert scripts
          Path('/tmp/rutu-inline.js').write_text('\n'.join(scripts))
          print('KLA NTENBEHEER_SOURCE_CONTRACT_OK')
          PY
          node --check /tmp/rutu-inline.js
          node --check rutubusinessandroid/src/main/assets/rutu-pos.js
      - name: Assert rotation does not recreate authenticated Activity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=ET.parse('rutubusinessandroid/src/main/AndroidManifest.xml').getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          activity=root.find('application/activity')
          assert activity is not None and activity.get(ns+'name')=='.MainActivity'
          changes=set((activity.get(ns+'configChanges') or '').split('|'))
          assert {'orientation','screenSize','keyboardHidden'}<=changes,changes
          main=Path('rutubusinessandroid/src/main/java/com/vanaggelen/rutubusiness/MainActivity.kt').read_text()
          assert 'override fun onConfigurationChanged(newConfig: Configuration)' in main
          assert 'super.onConfigurationChanged(newConfig)' in main
          assert 'webView.requestLayout()' in main
          assert 'private var businessUnlocked = false' in main
          assert 'requestBusinessCode()' in main
          assert 'savedInstanceState?.getBoolean' not in main
          print('ROTATION_MANIFEST_AND_UNLOCK_LIFECYCLE_OK')
          PY
      - name: Test Uitverkocht stock API, order rejection and customer availability
        shell: bash
        run: |
          set -euo pipefail
          node --check rutubusinessandroid/src/main/assets/rutu-pos.js
          python3 scripts/test-rutu-stock.py
      - name: Validate product, price and chosen image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          server=Path('rutu-server/index.php').read_text()
          pos=Path('rutubusinessandroid/src/main/assets/rutu-pos.js').read_text()
          customer=Path('jadeorders/src/main/java/com/vanaggelen/jadeorders/MainActivity.kt').read_text()
          assert "'Rutu Spicy Wings' => 4.00" in server
          assert "name:'Rutu Spicy Wings',price:4.00" in pos
          assert 'R.drawable.menu_rutu_spicy_wings' in customer
          files=[Path(p).read_bytes() for p in ('rutubusinessandroid/src/main/assets/menu/menu_rutu_spicy_wings.webp','jadeorders/src/main/res/drawable-nodpi/menu_rutu_spicy_wings.webp')]
          assert files[0]==files[1] and files[0][0:4]==b'RIFF' and files[0][8:12]==b'WEBP'
          assert hashlib.sha256(files[0]).hexdigest()=='41f9df4fb2cff20d4a9811fc0f19b8b8039dcc2c2f34dcec49ea7e140c807596'
          print('RUTU_SPICY_WINGS_IMAGE_AND_PRICE_OK')
          PY
      - name: Test authenticated registration API against isolated fixtures
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/www/rutu-api" "$root/rutu-data"
          cp rutu-server/index.php "$root/www/rutu-api/index.php"
          printf '%s\n' 'isolated-ci-business-key' > "$root/rutu-data/business.key"
          cat > "$root/rutu-data/devices.json" <<'JSON'
          {"devices":{"test-device-1":{"registered":"2026-10-17T10:00:00+00:00","customer":"Klant A"},"test-device-2":{"registered":"2026-10-18T10:00:00+00:00","customer":"Klant B"},"test-device-3":{"registered":"2026-10-19T10:00:00+00:00","customer":""}}}
          JSON
          php -S 127.0.0.1:18774 -t "$root/www" >/tmp/rutu-php-test.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$root"' EXIT
          sleep 1
          url='http://127.0.0.1:18774/rutu-api/index.php?action=business_customer_registrations'
          denied="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
          test "$denied" = 401
          denied="$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Rutu-Business-Key: invalid-key' "$url")"
          test "$denied" = 401
          result="$(curl -fsS -H 'X-Rutu-Business-Key: isolated-ci-business-key' "$url")"
          echo "$result" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["ok"] and d["registration_type"]=="customer_devices";assert d["count"]==3 and len(d["registrations"])==3;assert sorted(x["name"] for x in d["registrations"])==["","Klant A","Klant B"];assert all(len(x["id"])==24 for x in d["registrations"]);assert "test-device-" not in json.dumps(d)'
          echo 'RUTU_ISOLATED_AUTH_AND_REGISTRATION_SCHEMA_OK'
      - name: Test Gratis POS on isolated disposable PHP server
        run: python3 scripts/test-rutu-gratis-pos.py
      - name: Load fixed original APK signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo 'Signing secret unavailable'; exit 1; }
          install -d -m 0700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 0600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android >/dev/null
      - name: Build test-only Business v942
        run: gradle :rutubusinessandroid:assembleDebug --no-daemon --no-build-cache -PappVersionCode=942
      - name: Verify signature matches the current live v941 APK
        shell: bash
        run: |
          set -euo pipefail
          apk='rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk'
          test -s "$apk"
          tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          signer="$tools/apksigner"
          "$signer" verify --print-certs "$apk" > /tmp/rutu-candidate-signature.txt
          curl -fLsS --max-time 80 --retry 2 'https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Bedrijf-Android.apk' -o /tmp/rutu-v937.apk
          expected='0dcf87d440724ecd694c64eb2e1da82b1130c8f61caa39f1655969e97452455a'
          actual="$(sha256sum /tmp/rutu-v937.apk | awk '{print $1}')"
          test "$actual" = "$expected" || { echo 'Current production APK differs, no assumption about signing identity'; exit 1; }
          "$signer" verify --print-certs /tmp/rutu-v937.apk > /tmp/rutu-production-signature.txt
          old="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/rutu-production-signature.txt | head -1)"
          new="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/rutu-candidate-signature.txt | head -1)"
          test -n "$old" && test "$old" = "$new" || { echo 'Signature mismatch'; exit 1; }
          echo 'RUTU_V942_CERT_MATCHES_LIVE_V941'
      - uses: actions/upload-artifact@v4
        with:
          name: rutu-bedrijf-v942-spicy-wings-candidate
          path: rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk
          if-no-files-found: error

# Retest after fixing the fixture's expected number of stored orders.
