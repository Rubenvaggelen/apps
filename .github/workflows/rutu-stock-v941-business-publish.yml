name: Publish RUTU Business v941 menu Uitverkocht safely
on:
  push:
    branches: [feature/rutu-uitverkocht-v941-20261021]
    paths: [ci/rutu-stock-v941-release-marker.txt]
permissions:
  contents: read
  actions: read
concurrency:
  group: rutu-stock-v941-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconfirm tested API and client source
        run: |
          set -euo pipefail
          git diff --quiet 1f971828e15a649c70991579fb04720f3f75cf88 HEAD -- rutu-server/index.php rutubusinessandroid/src/main/assets/business.html rutubusinessandroid/src/main/assets/rutu-pos.js rutubusinessandroid/src/main/assets/rutu-pos.css
          php -l rutu-server/index.php
          bash -n ci/deploy-rutu-stock-v941.sh
      - uses: actions/download-artifact@v4
        with:
          name: rutu-bedrijf-v941-stock-candidate
          run-id: 39642060085
          github-token: ${{ github.token }}
          path: /tmp/rutu-v941-stock
      - name: Publish Business v941 APK and stock API only
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE DEPLOY_KNOWN_HOSTS;do
            test -n "$(printenv "$key")" || { echo "Missing required deployment config"; exit 1; }
          done
          apk='/tmp/rutu-v941-stock/rutubusinessandroid-debug.apk'
          test -s "$apk"
          old_php="$(git show 0a234eaeed6cdb311779169c50776a9757a885cc:rutu-server/index.php | sha256sum | awk '{print $1}')"
          new_php="$(sha256sum rutu-server/index.php | awk '{print $1}')"
          new_apk="$(sha256sum "$apk" | awk '{print $1}')"
          meta="$(mktemp)"
          printf '{"versionCode":941,"url":"https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Bedrijf-Android.apk","sha256":"%s"}\n' "$new_apk" > "$meta"
          umask 077
          d="$(mktemp -d)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$d" "$meta"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$d/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$d/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$d/askpass"
          chmod 0600 "$d/key" "$d/known_hosts"
          chmod 0700 "$d/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$d/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$d/key" </dev/null
          unset DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE
          opts=(-i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=20)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          stage="$(ssh -p "$DEPLOY_PORT" ${opts[@]} "$remote" 'mktemp -d "$HOME/.rutu-klantenbeheer-stage.XXXXXXXX"')"
          scp -O -P "$DEPLOY_PORT" ${opts[@]} rutu-server/index.php "$remote:$stage/api.php"
          scp -O -P "$DEPLOY_PORT" ${opts[@]} "$apk" "$remote:$stage/business.apk"
          scp -O -P "$DEPLOY_PORT" ${opts[@]} "$meta" "$remote:$stage/business.json"
          ssh -p "$DEPLOY_PORT" ${opts[@]} "$remote" "bash -s -- '$stage' '$old_php' '$new_php' '$new_apk'" < ci/deploy-rutu-stock-v941.sh
          echo 'RUTU Business v941 Uitverkocht and API published; existing Customer APK left unchanged.' >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --max-time 20 'https://rubenvanaggelen.com/rutu-api/index.php?action=menu_availability' | python3 -c 'import sys,json;o=json.load(sys.stdin);assert o["ok"] and isinstance(o["sold_out"],list)'
          cp "$apk" RUTU-Bedrijf-v941-Uitverkocht.apk
      - name: Publish signed APK in Apps releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rutu-bedrijf-v941
          target_commitish: feature/rutu-uitverkocht-v941-20261021
          name: Rutu Bedrijf v941 - Uitverkocht menubeheer
          prerelease: false
          make_latest: false
          body: |
            Rutu Bedrijf Android v941 - schakel per gerecht Uitverkocht / Weer beschikbaar vanuit de Bedrijfsapp.
            De Rutu-server blokkeert nieuwe bestellingen en aanvullingen met uitverkochte gerechten; bestaande bestellingen blijven ongewijzigd.
            Bestaand: Klantenbeheer, Gratis met naam, scherm draaien zonder opnieuw ontgrendelen.
            De klant-APK is niet door deze Business-release vervangen.
          files: RUTU-Bedrijf-v941-Uitverkocht.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

