name: The One Remote - Logo Only Test
on:
  push:
    branches: [feature/the-one-remote-access-logo-20261020]
    paths:
      - "remoteapp/**"
      - ".github/assets/the_one_remote_access_logo.webp.b64"
      - ".github/workflows/build-remote-logo-test-20261020.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore existing owner signing key
        env:
          OWNER_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$OWNER_KEY"
          mkdir -p ~/.android
          printf '%s' "$OWNER_KEY" | base64 -d > ~/.android/debug.keystore
      - name: Verify branding-only change and unchanged The One theme
        shell: bash
        run: |
          set -euo pipefail
          test -s remoteapp/src/main/res/drawable-nodpi/the_one_remote_access_logo.webp
          test -s remoteapp/src/main/res/drawable-nodpi/the_one_logo.png
          grep -q '@drawable/the_one_remote_access_logo' remoteapp/src/main/AndroidManifest.xml
          grep -q 'R.drawable.the_one_remote_access_logo' remoteapp/src/main/java/com/theone/remote/MainActivity.kt
          grep -q 'Theme.TheOneRemote' remoteapp/src/main/AndroidManifest.xml
          grep -q '#071018' remoteapp/src/main/java/com/theone/remote/MainActivity.kt
          grep -q '#20B7FF' remoteapp/src/main/java/com/theone/remote/MainActivity.kt
          grep -q '#D8A451' remoteapp/src/main/res/values/colors.xml
          grep -q 'remote_gold' remoteapp/src/main/res/values/themes.xml
          echo 'THE_ONE_REMOTE_THEME_UNCHANGED=1'
      - name: Build The One Remote test APK only
        run: gradle :remoteapp:assembleDebug -PappVersionCode=5001 --no-daemon --console=plain
      - name: Verify APK identity, logo and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=remoteapp/build/outputs/apk/debug/remoteapp-debug.apk
          test -s "$APK"
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('remoteapp/build/outputs/apk/debug/remoteapp-debug.apk') as z:
              names=z.namelist()
              assert any(p.startswith('res/') and 'the_one_remote_access_logo' in p for p in names), 'Logo missing in APK'
              assert any(p.startswith('res/') and 'the_one_logo' in p for p in names), 'Original retained'
          print('REMOTE_LOGO_ASSET_OK=1')
          PY
          TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.theone.remote'"
          echo 'THE_ONE_REMOTE_BRANDING_TEST_OK=1'
      - name: Save candidate APK without rollout
        uses: actions/upload-artifact@v4
        with:
          name: The-One-Remote-Logo-Only-TEST
          path: remoteapp/build/outputs/apk/debug/remoteapp-debug.apk
          if-no-files-found: error
