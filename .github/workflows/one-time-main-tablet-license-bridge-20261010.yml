name: One-time Main Tablet License Bridge 2026-10-10
on:
  push:
    branches: [feature/studio-license-management-20261009]
    paths:
      - '.github/workflows/one-time-main-tablet-license-bridge-20261010.yml'
permissions:
  contents: read
concurrency:
  group: one-time-main-tablet-license-live-20261010
  cancel-in-progress: false

jobs:
  tablet-license-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Main grant logic and integration tests
        run: |
          set -euo pipefail
          php -l the-one-remote-server/license-core.php
          php -l the-one-remote-server/main-heartbeat-license-bridge.php
          php tests/main-heartbeat-license-bridge.php
          php tests/main-approval-heartbeat-integration.php
          python3 tests/test_main_live_bridge_patch.py

      - name: Backup and update ONLY old Main grant bridge, never registry data
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE DEPLOY_KNOWN_HOSTS; do
            test -n "$(printenv "$name")" || { echo "::error::Required SSH secret missing ($name)"; exit 1; }
          done
          work=$(mktemp -d)
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$work/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$work/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$work/askpass"
          chmod 600 "$work/key" "$work/known_hosts"
          chmod 700 "$work/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$work/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$work/key" </dev/null
          unset DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          sshdo() {
            ssh -p "$DEPLOY_PORT" -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=20 "$remote" "$@"
          }
          scpdo() {
            scp -O -P "$DEPLOY_PORT" -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=20 "$@"
          }

          scpdo "$remote:public_html/the-one-remote-api/devices.php" "$work/live-devices.php"
          scpdo "$remote:public_html/the-one-remote-api/license-core.php" "$work/live-license-core.php"
          scpdo "$remote:public_html/the-one-remote-api/main-heartbeat-license-bridge.php" "$work/live-bridge.php"
          cmp -s "$work/live-license-core.php" the-one-remote-server/license-core.php ||
            { echo "::error::Live license core differs. Refusing deployment."; exit 1; }
          git show 5566e18b0e00131ab691798e5c598fde0b86b888:the-one-remote-server/main-heartbeat-license-bridge.php > "$work/old-reviewed-bridge.php"
          if ! cmp -s "$work/live-bridge.php" "$work/old-reviewed-bridge.php" &&
             ! cmp -s "$work/live-bridge.php" the-one-remote-server/main-heartbeat-license-bridge.php; then
            echo "::error::Live bridge differs from both reviewed revisions. No deployment."
            exit 1
          fi
          python3 - "$work/live-devices.php" <<'PY'
          import importlib.util, pathlib, re, sys
          spec = importlib.util.spec_from_file_location('bridge_patch', pathlib.Path('scripts/prepare-main-license-live-bridge.py').resolve())
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          source = pathlib.Path(sys.argv[1]).read_text()
          if source.count(mod.MARKER) != 1 or source.count(mod.NEW) != 1 or source.count(mod.OLD) != 0 or source.count('one_license_main_heartbeat_granted') != 1:
              raise SystemExit('ABORT: the live Main registry guard is not the already-reviewed license integration')
          def values(name):
              match = re.search(r'\$' + re.escape(name) + r'\s*=\s*\[(.*?)\];', source, re.S)
              if not match: raise SystemExit('ABORT: missing legacy/CAR allowlist')
              return re.findall(r"'([0-9a-f-]{36})'\s*=>\s*true", match.group(1))
          main = values('theOneApprovedLegacyMainIds')
          car = values('theOneAllowedCarIds')
          if len(main) != 22 or len(set(main)) != 22 or set(car) != {'498714cd-2077-41c6-9a2a-4f352fc61e22','b843ad19-7779-4d3c-ae64-ae8ccd5c2362'} or len(car) != 2:
              raise SystemExit('ABORT: live approved device lists do not match reviewed snapshot')
          print('Verified: exact existing license guard and Main/Car allowlists; registry will not be modified')
          PY
          expected_devices=$(sha256sum "$work/live-devices.php" | cut -d' ' -f1)
          expected_core=$(sha256sum "$work/live-license-core.php" | cut -d' ' -f1)
          expected_bridge=$(sha256sum "$work/live-bridge.php" | cut -d' ' -f1)
          stage=$(sshdo 'mktemp -d "$HOME/.one-main-license-stage.XXXXXXXX"')
          scpdo the-one-remote-server/main-heartbeat-license-bridge.php "$remote:$stage/new-bridge.php"
          sshdo "bash -s -- '$stage' '$expected_devices' '$expected_core' '$expected_bridge'" <<'REMOTE'
          set -Eeuo pipefail
          stage="$1"
          exp_devices="$2"
          exp_core="$3"
          exp_bridge="$4"
          dir="$HOME/public_html/the-one-remote-api"
          devices="$dir/devices.php"
          core="$dir/license-core.php"
          bridge="$dir/main-heartbeat-license-bridge.php"
          [ "$(sha256sum "$devices" | cut -d' ' -f1)" = "$exp_devices" ] || { echo "ABORT: registry changed since validation"; exit 1; }
          [ "$(sha256sum "$core" | cut -d' ' -f1)" = "$exp_core" ] || { echo "ABORT: license core changed"; exit 1; }
          [ "$(sha256sum "$bridge" | cut -d' ' -f1)" = "$exp_bridge" ] || { echo "ABORT: bridge changed"; exit 1; }
          php -l "$stage/new-bridge.php" >/dev/null
          if cmp -s "$bridge" "$stage/new-bridge.php"; then
            echo "LIVE BRIDGE ALREADY CURRENT. No files changed."
            rm -rf "$stage"
            exit 0
          fi
          mkdir -p "$HOME/.the-one-remote-backups"
          backup=$(mktemp -d "$HOME/.the-one-remote-backups/tablet-license-20261010.XXXXXXXX")
          cp -p "$bridge" "$backup/main-heartbeat-license-bridge.php"
          rollback() { echo "ROLLBACK bridge from preserved backup"; cp -p "$backup/main-heartbeat-license-bridge.php" "$bridge"; }
          trap 'rollback' ERR
          cp "$stage/new-bridge.php" "$bridge.new"
          chmod --reference="$bridge" "$bridge.new"
          mv "$bridge.new" "$bridge"
          php -l "$bridge" >/dev/null
          for attempt in 1 2 3; do
            if curl -fsS --max-time 20 "https://rubenvanaggelen.com/the-one-remote-api/devices.php?action=health" |
               php -r '$x=json_decode(stream_get_contents(STDIN),true); exit(($x["ok"]??false)===true && ($x["service"]??"")==="The One Main Device Registry" ? 0 : 1);'; then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "Health check failed"; false; }
            sleep 2
          done
          trap - ERR
          rm -rf "$stage"
          echo "SUCCESS: only live Main license bridge updated; original kept in private backup."
          REMOTE
          curl -fsS --max-time 20 "https://rubenvanaggelen.com/the-one-remote-api/devices.php?action=health" |
            python3 -c 'import json,sys;x=json.load(sys.stdin);assert x.get("ok") is True and x.get("service")=="The One Main Device Registry"'
