name: Build The One Main Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/the-one-main/**'
      - '.github/workflows/build-the-one-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp Windows build number
        shell: pwsh
        run: |
          @"
          namespace TheOneMain.Windows;

          public static class BuildInfo
          {
              public const int Version = ${{ github.run_number }};
          }
          "@ | Set-Content -Encoding UTF8 .\windows\the-one-main\BuildInfo.cs

      - name: Reuse The One Main YouTube configuration
        shell: pwsh
        run: |
          $source = Get-Content .\the-one-update\app\build.gradle -Raw
          $match = [regex]::Match($source, "YOUTUBE_API_KEY.*?\?:\s*'([^']+)'", [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $match.Success) { throw "YouTube configuration from The One Main not found" }
          $key = $match.Groups[1].Value

          $kieSource = Get-Content .\the-one-update\app\src\main\java\com\gmailorg\hub\KieApiConfig.kt -Raw
          $kieMatch = [regex]::Match($kieSource, 'API_KEY\s*=\s*"([^"]+)"')
          if (-not $kieMatch.Success) { throw "KIE configuration from The One Main not found" }
          $kieKey = $kieMatch.Groups[1].Value

          @"
          namespace TheOneMain.Windows;

          public static class BuildSecrets
          {
              public const string YouTubeApiKey = "$key";
              public const string KieApiKey = "$kieKey";
              public const string KieChatUrl = "https://api.kie.ai/gpt-5-2/v1/chat/completions";
          }
          "@ | Set-Content -Encoding UTF8 .\windows\the-one-main\BuildSecrets.cs

      - name: Generate Windows icon from The One logo
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $sourcePath = (Resolve-Path '.\windows\the-one-main\Assets\the_one_logo.png').Path
          $iconPath = Join-Path (Split-Path $sourcePath) 'the_one_logo.ico'

          $source = [System.Drawing.Image]::FromFile($sourcePath)
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $bitmap.SetResolution(96, 96)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
          $graphics.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality

          $scale = [Math]::Min(256.0 / $source.Width, 256.0 / $source.Height)
          $w = [int][Math]::Round($source.Width * $scale)
          $h = [int][Math]::Round($source.Height * $scale)
          $x = [int]((256 - $w) / 2)
          $y = [int]((256 - $h) / 2)
          $graphics.DrawImage($source, $x, $y, $w, $h)

          $pngStream = New-Object System.IO.MemoryStream
          $bitmap.Save($pngStream, [System.Drawing.Imaging.ImageFormat]::Png)
          $pngBytes = $pngStream.ToArray()

          $icoStream = New-Object System.IO.MemoryStream
          $writer = New-Object System.IO.BinaryWriter($icoStream)
          $writer.Write([uint16]0)
          $writer.Write([uint16]1)
          $writer.Write([uint16]1)
          $writer.Write([byte]0)
          $writer.Write([byte]0)
          $writer.Write([byte]0)
          $writer.Write([byte]0)
          $writer.Write([uint16]1)
          $writer.Write([uint16]32)
          $writer.Write([uint32]$pngBytes.Length)
          $writer.Write([uint32]22)
          $writer.Write($pngBytes)
          $writer.Flush()
          [System.IO.File]::WriteAllBytes($iconPath, $icoStream.ToArray())

          $writer.Dispose()
          $icoStream.Dispose()
          $pngStream.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
          $source.Dispose()

      - name: Publish single EXE
        shell: pwsh
        run: |
          dotnet publish .\windows\the-one-main\TheOneMain.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o .\out\the-one-main-windows

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path .\out\the-one-main-windows\* -DestinationPath .\The-One-Main-Windows.zip -Force

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-One-Main-Windows
          path: The-One-Main-Windows.zip
          if-no-files-found: error

      - name: Publish Windows-only update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ github.run_number }}
          name: "The One Main Windows — build ${{ github.run_number }}"
          prerelease: true
          make_latest: false
          files: The-One-Main-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
