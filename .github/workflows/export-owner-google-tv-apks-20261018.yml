name: Export verified Sony Cinema v1.4.4 APK for owner
on:
  push:
    branches: [feature/media-player-adult-5min-20261016]
    paths: [.github/workflows/export-owner-google-tv-apks-20261018.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Export verified Cinema v144 owner APK from protected delivery
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            test -n "${!key}" || { echo "Missing secure delivery configuration"; exit 1; }
          done
          folder=$(mktemp -d)
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$folder"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$folder/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$folder/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$folder/askpass"
          chmod 600 "$folder/key" "$folder/known_hosts"
          chmod 700 "$folder/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$folder/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$folder/key" </dev/null
          unset DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE
          opts=(-i "$folder/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$folder/known_hosts" -o ConnectTimeout=15)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          mkdir -p owner-apks
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" "$remote:/home/vanawiwj/dev.vanaggelen.com/sony-bravia-audio-tests/The-One-Cinema-Google-TV-Sony-1.4.4.apk" owner-apks/The-One-Cinema-Google-TV-v1.4.4.apk
          cat > "$folder/expected" <<'SHA'
          ebe99608716d817aee8b9a604bdb9b95f483634935dccb1b795c737ec7ec3bd1  owner-apks/The-One-Cinema-Google-TV-v1.4.4.apk
          SHA
          sha256sum -c "$folder/expected"
          for file in owner-apks/*.apk; do
            test "$(stat -c '%s' "$file")" -gt 100000
            unzip -tq "$file" > /dev/null
          done
          echo VERIFIED_OWNER_TV_APKS=1
      - name: Temporary owner-only handover artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-One-Cinema-Google-TV-v144-owner-verified
          path: owner-apks/*.apk
          retention-days: 1
          if-no-files-found: error
