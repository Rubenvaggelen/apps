name: The One TV source availability (redacted)
on:
  push:
    branches: [feature/tv-android-autoupdate-20261014]
    paths: ['.github/workflows/the-one-xtream-health.yml']
permissions:
  contents: read
jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restore configured providers without printing identities
        env:
          SIGNING_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_KEY"
          mkdir -p /tmp/theone-health
          printf '%s' "$SIGNING_KEY" | base64 -d > /tmp/theone-health/owner.keystore
          curl -fLsS --max-time 90 'https://github.com/Rubenvaggelen/apps/releases/download/media-player-v2400/The-One-Media-Player-v2400.apk' -o /tmp/theone-health/media-player.apk
          echo 'a76dfa81c8670d1c044776fa1f10264eff958eca64339d6dd0d6f6ccedb3e04b  /tmp/theone-health/media-player.apk' | sha256sum --check --status
          python3 - <<'PY'
          import pathlib,zipfile,json
          with zipfile.ZipFile('/tmp/theone-health/media-player.apk') as z:
              cfg=json.loads(z.read('assets/private_xtream.json'))
          if not all(cfg.get(k) for k in ('server','username','password')):
              raise SystemExit('Primary config invalid')
          pathlib.Path('/tmp/theone-health/primary.json').write_text(json.dumps(cfg))
          PY
          keytool -importkeystore -srckeystore /tmp/theone-health/owner.keystore -srcstorepass android -srcalias androiddebugkey -destkeystore /tmp/theone-health/owner.p12 -deststoretype PKCS12 -deststorepass changeit -destkeypass changeit -noprompt >/dev/null
          openssl pkcs12 -in /tmp/theone-health/owner.p12 -passin pass:changeit -nodes -nocerts -out /tmp/theone-health/owner.pem >/dev/null 2>&1
          base64 -d live-android/secondary-source.enc.b64 > /tmp/theone-health/secondary.enc
          openssl pkeyutl -decrypt -inkey /tmp/theone-health/owner.pem -in /tmp/theone-health/secondary.enc -out /tmp/theone-health/secondary.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python3 - <<'PY'
          import json,pathlib
          cfg=json.loads(pathlib.Path('/tmp/theone-health/secondary.json').read_text())
          if not all(cfg.get(k) for k in ('server','username','password')):
              raise SystemExit('Secondary config invalid')
          PY
      - name: Probe both provider APIs (sanitized output only)
        run: |
          python3 - <<'PY'
          import json,pathlib,urllib.request,urllib.parse,urllib.error,time,concurrent.futures,re
          base=pathlib.Path('/tmp/theone-health')
          def probe(label,filename):
              try:
                  cfg=json.loads((base/filename).read_text())
                  alive=True; results=[]; category_rows=[]
                  for action,key in [('get_live_categories','category_id'),('get_live_streams','stream_id')]:
                      url=cfg['server'].rstrip('/')+'/player_api.php?'+urllib.parse.urlencode({'username':cfg['username'],'password':cfg['password'],'action':action})
                      start=time.monotonic()
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'TheOneTV/1.0','Accept':'application/json'})
                          with urllib.request.urlopen(req,timeout=20) as res:
                              status=res.status
                              payload=res.read(30000001)
                          elapsed=int((time.monotonic()-start)*1000)
                          if len(payload)>30000000: raise ValueError('oversize')
                          rows=json.loads(payload.decode('utf-8'))
                          count=len(rows) if isinstance(rows,list) else 0
                          if action=='get_live_streams' and isinstance(rows,list):
                              import re
                              valid=[x for x in rows if isinstance(x,dict) and x.get('name')]
                              strict=[(i,x) for i,x in enumerate(valid) if re.match(r'^\s*NL(?:$|[^a-zA-Z0-9])',str(x.get('name','')),re.I)]
                              npo=[(i,x) for i,x in enumerate(valid) if re.search(r'(?i)\bnpo\s*[12]\b',str(x.get('name','')))]
                              first_strict=next((i+1 for i,_ in strict),0)
                              results.append(f'{action}:nl_prefix_count={len(strict)},first_nl_position={first_strict},first_2000_nl={sum(i<2000 for i,_ in strict)},npo12_count={len(npo)},npo12_first_positions={[i+1 for i,_ in npo[:8]]}')
                          ok=status==200 and count>0
                          results.append(f'{action}:status={status},records={count},ms={elapsed},ok={str(ok).lower()}')
                          if action=='get_live_categories' and isinstance(rows,list):
                              category_rows=rows
                          if action=='get_live_streams' and isinstance(rows,list):
                              strict=lambda row:bool(re.match(r'^\s*NL(?=$|[^A-Za-z0-9])',str(row.get('name','')),re.I))
                              positions=[i for i,row in enumerate(rows) if isinstance(row,dict) and strict(row)]
                              results.append(f'NL_PREFIX_TOTAL={len(positions)},FIRST_NL_INDEX={positions[0] if positions else -1},NL_IN_FIRST_1170={sum(p<1170 for p in positions)},NL_IN_FIRST_2341={sum(p<2341 for p in positions)},NL_IN_FIRST_4096={sum(p<4096 for p in positions)}')
                              nl_categories={str(c.get('category_id')) for c in category_rows if isinstance(c,dict) and re.search(r'(^|[^a-zA-Z])(nl|nederland|netherlands|holland)(?=$|[^a-zA-Z])',str(c.get('category_name','')),re.I)}
                              covered=sum(any(cid.strip() in nl_categories for cid in str(rows[i].get('category_id','')).split(',')) for i in positions)
                              results.append(f'NL_CATEGORY_CANDIDATES={len(nl_categories)},NL_PREFIX_COVERED_BY_COUNTRY_CATEGORY={covered}/{len(positions)}')
                              from collections import Counter
                              counts=Counter(str(rows[i].get('category_id','')) for i in positions)
                              results.append(f'NL_ACTIVE_CATEGORIES={len(counts)},NL_LARGEST_CATEGORY_COUNTS={list(v for k,v in counts.most_common(12))}')
                              category_names={str(c.get('category_id')):str(c.get('category_name','')) for c in category_rows if isinstance(c,dict)}
                              ordered=sorted(nl_categories,key=lambda cid:category_names.get(cid,'').lower())
                              results.append(f'NL_SORTED_FIRST_3_COVERAGE={sum(counts.get(cid,0) for cid in ordered[:3])},FIRST_6_COVERAGE={sum(counts.get(cid,0) for cid in ordered[:6])},FIRST_10_COVERAGE={sum(counts.get(cid,0) for cid in ordered[:10])}')

                              if counts:
                                  category_id=counts.most_common(1)[0][0]
                                  test_url=cfg['server'].rstrip('/')+'/player_api.php?'+urllib.parse.urlencode({'username':cfg['username'],'password':cfg['password'],'action':'get_live_streams','category_id':category_id})
                                  test_start=time.monotonic()
                                  try:
                                      with urllib.request.urlopen(urllib.request.Request(test_url,headers={'User-Agent':'TheOneTV/1.0'}),timeout=15) as category_res:
                                          test_status=category_res.status
                                          test_rows=json.loads(category_res.read(30000001).decode('utf-8'))
                                      matched=sum(1 for row in test_rows if isinstance(row,dict) and strict(row)) if isinstance(test_rows,list) else 0
                                      results.append(f'NL_CATEGORY_FILTER_HTTP={test_status},NL_MATCHING_ROWS={matched},MS={int((time.monotonic()-test_start)*1000)}')
                                  except Exception as err:
                                      results.append(f'NL_CATEGORY_FILTER_ERROR={type(err).__name__}')
                          if not ok: alive=False
                      except urllib.error.HTTPError as err:
                          results.append(f'{action}:status={err.code},ok=false'); alive=False
                      except Exception as err:
                          results.append(f'{action}:error={type(err).__name__},ok=false'); alive=False
                  return label,alive,results
              except Exception as err:
                  return label,False,[f'config_error={type(err).__name__}']
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              statuses=list(pool.map(lambda t:probe(*t),[('SOURCE_1','primary.json'),('SOURCE_2','secondary.json')]))
          for name,alive,results in statuses:
              print(name+'_AVAILABLE='+str(alive).lower())
              for result in results: print(name+'_'+result)
          print('AVAILABLE_PROVIDERS='+str(sum(int(item[1]) for item in statuses))+'/2')
          PY
      - name: Erase temporary private configurations
        if: always()
        run: rm -rf /tmp/theone-health
