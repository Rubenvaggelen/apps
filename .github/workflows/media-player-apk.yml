name: Build The One Media Player APK

on:
  push:
    branches:
      - media-player-build
    paths:
      - 'media-player/**'
      - '.github/workflows/media-player-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare stable package
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('media-player/app/src/main/java/com/theone/mediaplayer')
          for p in root.glob('*.java'):
              s = p.read_text()
              s = s.replace('package com.theone.mediaplayer;', 'package com.theone.mediaplayer.stable;', 1)
              p.write_text(s)
          p = Path('media-player/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('namespace = "com.theone.mediaplayer"', 'namespace = "com.theone.mediaplayer.stable"')
          s = s.replace('applicationId = "com.theone.mediaplayer"', 'applicationId = "com.theone.mediaplayer.stable"')
          import re
          s = re.sub(r'versionCode = \d+', 'versionCode = 101', s)
          s = re.sub(r'versionName = "[^"]+"', 'versionName = "1.0.1-stable"', s)
          p.write_text(s)
          p = Path('media-player/app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('android:label="The One Media Player"', 'android:label="The One Media Player Stable"')
          p.write_text(s)
          PY

      - name: Build unsigned stable release APK
        working-directory: media-player
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload unsigned stable APK
        uses: actions/upload-artifact@v4
        with:
          name: the-one-media-player-stable-v1.0.1-unsigned
          path: media-player/app/build/outputs/apk/release/app-release-unsigned.apk
