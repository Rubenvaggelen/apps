name: Build The One Media Player APK

on:
  push:
    branches:
      - media-player-build
    paths:
      - 'media-player/**'
      - '.github/workflows/media-player-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Remove fullscreen back overlay
        run: python -c "from pathlib import Path; p=Path('media-player/app/src/main/java/com/theone/mediaplayer/MainActivity.java'); s=p.read_text(); a=s.index('        Button back = button(\"← Terug\");'); b=s.index('        setContentView(root);', a); p.write_text(s[:a] + s[b:])"

      - name: Bump APK version
        run: python -c "from pathlib import Path; p=Path('media-player/app/build.gradle.kts'); s=p.read_text().replace('versionCode = 4','versionCode = 5').replace('versionName = \"0.3.1-hotfix\"','versionName = \"0.3.2-fullscreen\"'); p.write_text(s)"

      - name: Build unsigned release APK
        working-directory: media-player
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: the-one-media-player-v0.3.2-unsigned
          path: media-player/app/build/outputs/apk/release/app-release-unsigned.apk
