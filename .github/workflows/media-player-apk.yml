name: Build The One Media Player APK

on:
  push:
    branches:
      - media-player-build
    paths:
      - 'media-player/**'
      - '.github/workflows/media-player-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Remove player overlay and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('media-player/app/src/main/java/com/theone/mediaplayer/MainActivity.java')
          s = p.read_text()
          old = '''        Button back = button("← Terug");
        back.setOnClickListener(v -> showShell("Live TV"));
        FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP | Gravity.START);
        lp.setMargins(dp(16), dp(16), 0, 0);
        root.addView(back, lp);

'''
          if old not in s:
              raise SystemExit('Expected player back-button block not found')
          p.write_text(s.replace(old, ''))

          g = Path('media-player/app/build.gradle.kts')
          t = g.read_text()
          t = t.replace('versionCode = 4', 'versionCode = 5')
          t = t.replace('versionName = "0.3.1-hotfix"', 'versionName = "0.3.2-fullscreen"')
          g.write_text(t)
          PY

      - name: Build unsigned release APK
        working-directory: media-player
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: the-one-media-player-v0.3.2-unsigned
          path: media-player/app/build/outputs/apk/release/app-release-unsigned.apk
