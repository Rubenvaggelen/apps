name: Build The One Media Player

on:
  push:
    paths:
      - 'media-player/**'
      - '.github/workflows/build-media-player.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MEDIA_PLAYER_KEYSTORE_PATH: ${{ github.workspace }}/media-player-fixed.keystore
      MEDIA_PLAYER_KEYSTORE_PASSWORD: android
      MEDIA_PLAYER_KEY_ALIAS: androiddebugkey
      MEDIA_PLAYER_KEY_PASSWORD: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: signing key secret is empty"
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$MEDIA_PLAYER_KEYSTORE_PATH"
          chmod 600 "$MEDIA_PLAYER_KEYSTORE_PATH"
          keytool -list -keystore "$MEDIA_PLAYER_KEYSTORE_PATH" -alias androiddebugkey -storepass android >/dev/null

      - name: Build signed V19-based APK
        run: gradle -p media-player clean assembleRelease --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs media-player/app/build/outputs/apk/release/app-release.apk
          cp media-player/app/build/outputs/apk/release/app-release.apk media-player/app/build/outputs/apk/release/The-One-Media-Player-V19-Requested.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: the-one-media-player-v19-requested-signed
          path: media-player/app/build/outputs/apk/release/The-One-Media-Player-V19-Requested.apk

      - name: Smoke-test Media Player on Android emulator
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r media-player/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.theone.mediaplayer/com.theone.mediaplayer.MainActivity
            sleep 4
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee /tmp/activity.txt
            adb logcat -d > /tmp/logcat.txt
            if grep -q 'FATAL EXCEPTION' /tmp/logcat.txt; then
              grep -A 40 -B 5 'FATAL EXCEPTION' /tmp/logcat.txt
              exit 1
            fi
            grep -q 'com.theone.mediaplayer' /tmp/activity.txt
            echo 'MEDIA_PLAYER_SMOKE_TEST_OK'
