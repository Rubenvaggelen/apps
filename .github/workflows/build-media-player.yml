name: Build The One Media Player

on:
  push:
    paths:
      - 'media-player/**'
      - '.github/workflows/build-media-player.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MEDIA_PLAYER_KEYSTORE_BASE64: ${{ secrets.MEDIA_PLAYER_KEYSTORE_BASE64 }}
      MEDIA_PLAYER_KEYSTORE_PASSWORD: ${{ secrets.MEDIA_PLAYER_KEYSTORE_PASSWORD }}
      MEDIA_PLAYER_KEY_ALIAS: ${{ secrets.MEDIA_PLAYER_KEY_ALIAS }}
      MEDIA_PLAYER_KEY_PASSWORD: ${{ secrets.MEDIA_PLAYER_KEY_PASSWORD }}
      MEDIA_PLAYER_KEYSTORE_PATH: ${{ github.workspace }}/media-player/the-one-media-player.jks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Media Player debug APK
        run: gradle -p media-player clean assembleDebug --no-daemon

      - name: Upload Media Player APK
        uses: actions/upload-artifact@v4
        with:
          name: the-one-media-player-apk
          path: media-player/app/build/outputs/apk/debug/app-debug.apk

      - name: Collect Android signing tools
        shell: bash
        run: |
          mkdir -p android-signing-tools/lib
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" android-signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" android-signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" android-signing-tools/lib/

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: android-signing-tools

      - name: Prepare Media Player signing key
        if: env.MEDIA_PLAYER_KEYSTORE_BASE64 != '' && env.MEDIA_PLAYER_KEYSTORE_PASSWORD != '' && env.MEDIA_PLAYER_KEY_ALIAS != '' && env.MEDIA_PLAYER_KEY_PASSWORD != ''
        shell: bash
        run: |
          printf '%s' "$MEDIA_PLAYER_KEYSTORE_BASE64" | base64 --decode > "$MEDIA_PLAYER_KEYSTORE_PATH"
          test -s "$MEDIA_PLAYER_KEYSTORE_PATH"

      - name: Build signed Media Player update
        if: env.MEDIA_PLAYER_KEYSTORE_BASE64 != '' && env.MEDIA_PLAYER_KEYSTORE_PASSWORD != '' && env.MEDIA_PLAYER_KEY_ALIAS != '' && env.MEDIA_PLAYER_KEY_PASSWORD != ''
        shell: bash
        run: |
          gradle -p media-player assembleRelease --no-daemon
          test -s media-player/app/build/outputs/apk/release/app-release.apk
          cp media-player/app/build/outputs/apk/release/app-release.apk              media-player/app/build/outputs/apk/release/The-One-Media-Player-v21.apk

      - name: Publish Media Player v2.1 update
        if: env.MEDIA_PLAYER_KEYSTORE_BASE64 != '' && env.MEDIA_PLAYER_KEYSTORE_PASSWORD != '' && env.MEDIA_PLAYER_KEY_ALIAS != '' && env.MEDIA_PLAYER_KEY_PASSWORD != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: media-player-v2100
          target_commitish: ${{ github.sha }}
          name: The One Media Player v2.1
          body: |
            The One Media Player update:
            - corrected movie year metadata (no internal Unix timestamps)
            - compact two-line movie titles
            - provider, year and rating on one clean line
            - premium neon buttons throughout the app
            - selectable subtitle tracks during playback
          files: media-player/app/build/outputs/apk/release/The-One-Media-Player-v21.apk
          overwrite_files: true

      - name: Smoke-test Media Player on Android emulator
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r media-player/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.theone.mediaplayer/com.theone.mediaplayer.MainActivity
            sleep 4
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee /tmp/activity.txt
            adb logcat -d > /tmp/logcat.txt
            if grep -q 'FATAL EXCEPTION' /tmp/logcat.txt; then
              grep -A 40 -B 5 'FATAL EXCEPTION' /tmp/logcat.txt
              exit 1
            fi
            grep -q 'com.theone.mediaplayer' /tmp/activity.txt
            echo 'MEDIA_PLAYER_SMOKE_TEST_OK'
