name: Build The One Media Player

on:
  push:
    paths:
      - 'media-player/**'
      - '.github/workflows/build-media-player.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Media Player debug APK
        run: gradle -p media-player clean assembleDebug --no-daemon

      - name: Upload Media Player APK
        uses: actions/upload-artifact@v4
        with:
          name: the-one-media-player-apk
          path: media-player/app/build/outputs/apk/debug/app-debug.apk

      - name: Collect Android signing tools
        shell: bash
        run: |
          mkdir -p android-signing-tools/lib
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" android-signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" android-signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" android-signing-tools/lib/

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: android-signing-tools

      - name: Smoke-test Media Player on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r media-player/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.theone.mediaplayer/com.theone.mediaplayer.MainActivity
            sleep 4
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee /tmp/activity.txt
            adb logcat -d > /tmp/logcat.txt
            if grep -q 'FATAL EXCEPTION' /tmp/logcat.txt; then
              grep -A 40 -B 5 'FATAL EXCEPTION' /tmp/logcat.txt
              exit 1
            fi
            grep -q 'com.theone.mediaplayer' /tmp/activity.txt
            echo 'MEDIA_PLAYER_SMOKE_TEST_OK'
