name: Build The One Media Player

on:
  push:
    paths:
      - 'media-player/**'
      - '.github/workflows/build-media-player.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MEDIA_PLAYER_KEYSTORE_PATH: ${{ github.workspace }}/media-player-fixed.keystore
      MEDIA_PLAYER_KEYSTORE_PASSWORD: android
      MEDIA_PLAYER_KEY_ALIAS: androiddebugkey
      MEDIA_PLAYER_KEY_PASSWORD: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$MEDIA_PLAYER_KEYSTORE_PATH"
          chmod 600 "$MEDIA_PLAYER_KEYSTORE_PATH"
          keytool -list -keystore "$MEDIA_PLAYER_KEYSTORE_PATH" -alias "$MEDIA_PLAYER_KEY_ALIAS" -storepass "$MEDIA_PLAYER_KEYSTORE_PASSWORD" >/dev/null

      - name: Export public signing certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -exportcert -rfc \
            -keystore "$MEDIA_PLAYER_KEYSTORE_PATH" \
            -storepass "$MEDIA_PLAYER_KEYSTORE_PASSWORD" \
            -alias "$MEDIA_PLAYER_KEY_ALIAS" \
            -file media-player-signing-cert.pem

      - name: Upload public signing certificate
        uses: actions/upload-artifact@v4
        with:
          name: media-player-public-cert
          path: media-player-signing-cert.pem

      - name: Restore encrypted private Xtream source
        shell: bash
        run: |
          set -euo pipefail
          ENC=".github/media-player-private-source.enc.b64"
          test -s "$ENC"

          base64 -d "$ENC" > /tmp/media-player-source.enc

          keytool -importkeystore \
            -srckeystore "$MEDIA_PLAYER_KEYSTORE_PATH" \
            -srcstorepass "$MEDIA_PLAYER_KEYSTORE_PASSWORD" \
            -srcalias "$MEDIA_PLAYER_KEY_ALIAS" \
            -destkeystore /tmp/media-player-signing.p12 \
            -deststoretype PKCS12 \
            -deststorepass changeit \
            -destkeypass changeit \
            -noprompt >/dev/null

          openssl pkcs12 \
            -in /tmp/media-player-signing.p12 \
            -passin pass:changeit \
            -nodes -nocerts \
            -out /tmp/media-player-private.pem >/dev/null 2>&1

          openssl pkeyutl -decrypt \
            -inkey /tmp/media-player-private.pem \
            -in /tmp/media-player-source.enc \
            -out /tmp/media-player-source.json \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256

          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qs
          import json

          src = json.loads(Path("/tmp/media-player-source.json").read_text(encoding="utf-8"))
          m3u = str(src.get("m3u_url", "")).strip()
          parsed = urlsplit(m3u)
          qs = parse_qs(parsed.query)
          username = (qs.get("username") or [""])[0]
          password = (qs.get("password") or [""])[0]
          server = f"{parsed.scheme}://{parsed.netloc}"

          if not (server.startswith("http") and username and password):
              raise SystemExit("Encrypted private source is not a valid Xtream-style M3U URL")

          out = Path("media-player/app/src/main/assets")
          out.mkdir(parents=True, exist_ok=True)
          (out / "private_xtream.json").write_text(
              json.dumps(
                  {"server": server, "username": username, "password": password},
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          (out / "private_source.txt").write_text(m3u + "\n", encoding="utf-8")
          print("Private Media Player source restored securely")
          PY

          rm -f \
            /tmp/media-player-source.enc \
            /tmp/media-player-source.json \
            /tmp/media-player-signing.p12 \
            /tmp/media-player-private.pem

      - name: Keep working YouTube configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("the-one-update/app/build.gradle").read_text(encoding="utf-8")
          m = re.search(r'YOUTUBE_API_KEY.*?\?:\s*\'([^\']+)\'', source, re.S)
          if not m:
              raise SystemExit("YouTube build configuration unavailable")
          Path("media-player/app/src/main/assets/private_youtube_key.txt").write_text(m.group(1), encoding="utf-8")
          PY

      - name: Resolve Media Player version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(grep -E 'versionCode[[:space:]]*=' media-player/app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')"
          test -n "$VERSION_CODE"
          echo "MEDIA_PLAYER_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build signed Media Player update
        run: gradle -p media-player clean assembleRelease --no-daemon

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          APK="media-player/app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "media-player/app/build/outputs/apk/release/The-One-Media-Player-v$MEDIA_PLAYER_VERSION_CODE.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: the-one-media-player-v${{ env.MEDIA_PLAYER_VERSION_CODE }}
          path: media-player/app/build/outputs/apk/release/The-One-Media-Player-v${{ env.MEDIA_PLAYER_VERSION_CODE }}.apk

      - name: Publish in-app update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="media-player-v$MEDIA_PLAYER_VERSION_CODE"
          APK="media-player/app/build/outputs/apk/release/The-One-Media-Player-v$MEDIA_PLAYER_VERSION_CODE.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "The One Media Player v$MEDIA_PLAYER_VERSION_CODE" --notes "V19-basis met alleen de gevraagde Media Player-aanpassingen. Zelfde vaste signing-key voor update over de bestaande app."
          fi

      - name: Smoke-test Media Player on Android emulator
        continue-on-error: true
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r media-player/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.theone.mediaplayer/com.theone.mediaplayer.MainActivity
            sleep 4
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee /tmp/activity.txt
            adb logcat -d > /tmp/logcat.txt
            ! grep -q 'FATAL EXCEPTION' /tmp/logcat.txt
            grep -q 'com.theone.mediaplayer' /tmp/activity.txt
            echo 'MEDIA_PLAYER_SMOKE_TEST_OK'
