name: Build The One Kids Google TV (Learn and Play, no songs)
on:
  push:
    branches: [feature/kids-google-tv-learn-play-no-songs-20261105]
    paths:
      - 'kids-build-1130/**'
      - '.github/workflows/build-kids-google-tv.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: kids-google-tv-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore verified sanitized Kids source and image archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kids-build-1130/buildroot
          base64 -d kids-build-1130/source.zip.b64 > /tmp/kids-source.zip
          base64 -d kids-build-1130/images.zip.b64 > /tmp/kids-images.zip
          echo '366a95965282d09c4b71aba8e799ce8d2b69fab664c59933a80ec44e640c23e6  /tmp/kids-source.zip' | sha256sum -c
          echo '81fb267c7bdb5d283fb68cf15266980dc627a7a3338b368034b8bd801a1b519e  /tmp/kids-images.zip' | sha256sum -c
          unzip -q /tmp/kids-source.zip -d kids-build-1130/buildroot
          unzip -q /tmp/kids-images.zip -d kids-build-1130/buildroot/kids/src/main/res
      - name: Apply TV-specific navigation, learning and games overlay
        run: python3 kids-build-1130/patches/add-google-tv-no-songs.py
      - name: Verify strict absence of songs menu and source in TV variant
        shell: bash
        run: |
          set -euo pipefail
          test ! -e kids-build-1130/buildroot/kids/src/main/java/com/gmailorg/kids/KidsSongs.kt
          ! grep -R -E 'Kid[s]?Songs|Kinderliedjes|\"songs\"' kids-build-1130/buildroot/kids/src/main/java
          grep -q 'LEANBACK_LAUNCHER' kids-build-1130/buildroot/kids/src/main/AndroidManifest.xml
          grep -q '"learning" to ' kids-build-1130/buildroot/kids/src/main/java/com/gmailorg/kids/KidsSections.kt
      - name: Restore stable personal app signing identity
        env:
          SIGNING_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_KEY"
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEY" | base64 -d > "$HOME/.android/debug.keystore"
      - name: Build and test Google TV app
        run: gradle -p kids-build-1130/buildroot :kids:testDebugUnitTest :kids:assembleDebug --no-daemon --no-build-cache -PappVersionCode=1001
      - name: Verify Google TV launcher, package, signer and binary assets
        shell: bash
        run: |
          set -euo pipefail
          APK=kids-build-1130/buildroot/kids/build/outputs/apk/debug/kids-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/kids-tv-signer.txt
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file /tmp/kids-tv-owner.der >/dev/null
          grep -i "certificate SHA-256 digest: $(sha256sum /tmp/kids-tv-owner.der | cut -d ' ' -f1)" /tmp/kids-tv-signer.txt
          "$BT/aapt" dump badging "$APK" > /tmp/kids-tv-badging.txt
          grep "package: name='com.gmailorg.kids.tv' versionCode='1001'" /tmp/kids-tv-badging.txt
          grep 'leanback-launchable-activity' /tmp/kids-tv-badging.txt
          grep "uses-feature: name='android.software.leanback'" /tmp/kids-tv-badging.txt
          ! unzip -Z1 "$APK" | grep -q '^assets/private_'
          mkdir -p kids-build-1130/deliverable
          cp "$APK" kids-build-1130/deliverable/The-One-Kids-Google-TV-v1.0.1.apk
          sha256sum kids-build-1130/deliverable/The-One-Kids-Google-TV-v1.0.1.apk > kids-build-1130/deliverable/SHA256SUMS.txt
      - name: Smoke test on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r kids-build-1130/buildroot/kids/build/outputs/apk/debug/kids-debug.apk
            adb shell am start -n com.gmailorg.kids.tv/com.gmailorg.kids.MainActivity
            sleep 6
            adb shell pidof com.gmailorg.kids.tv
      - name: Save signed Google TV test APK and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: the-one-kids-google-tv-1001-signed-test
          path: kids-build-1130/deliverable/
          retention-days: 14
      - name: Save unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-google-tv-test-reports
          path: kids-build-1130/buildroot/kids/build/reports/tests/
          retention-days: 14
