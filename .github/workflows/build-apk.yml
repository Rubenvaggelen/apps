name: Build APK

on:
  push:
    branches: [ main, feature/jade-orders ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android >/dev/null

      - name: Build debug APKs with fixed key
        run: gradle clean assembleDebug --no-daemon --no-build-cache -PappVersionCode=${{ github.run_number }}

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          KEY_CERT=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          for APK in \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "carradio/build/outputs/apk/debug/carradio-debug.apk" \
            "jadeorders/build/outputs/apk/debug/jadeorders-debug.apk" \
            "rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk"; do
            APK_CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
            test -n "$KEY_CERT" && test -n "$APK_CERT" && test "$KEY_CERT" = "$APK_CERT"
          done

      - name: Upload The One APK
        uses: actions/upload-artifact@v4
        with:
          name: gmail-org-hub-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload The One Car APK
        uses: actions/upload-artifact@v4
        with:
          name: the-one-car-radio-apk
          path: carradio/build/outputs/apk/debug/carradio-debug.apk

      - name: Upload Jade Orders APK
        uses: actions/upload-artifact@v4
        with:
          name: jade-orders-apk
          path: jadeorders/build/outputs/apk/debug/jadeorders-debug.apk

      - name: Upload Rutu Business Android APK
        uses: actions/upload-artifact@v4
        with:
          name: rutu-business-android-apk
          path: rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk

      - name: Publish Rutu Android in-app update
        if: github.ref == 'refs/heads/feature/jade-orders'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          apk="jadeorders/build/outputs/apk/debug/jadeorders-debug.apk"
          test -s "$apk"
          version="${{ github.run_number }}"
          sha=$(sha256sum "$apk" | awk '{print $1}')
          meta=$(mktemp)
          printf '{"versionCode":%s,"url":"https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Android.apk","sha256":"%s"}\n' "$version" "$sha" > "$meta"

          keydir=$(mktemp -d)
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$keydir" "$meta"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$keydir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$keydir/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$keydir/askpass"
          chmod 600 "$keydir/key"
          chmod 700 "$keydir/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$keydir/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$keydir/key" </dev/null
          opts=(-i "$keydir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          stage=$(ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" 'mktemp -d "$HOME/.rutu-update.XXXXXXXX"')
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" "$apk" "$remote:$stage/Rutu-BBQ-Android.apk"
          scp -O -P "$DEPLOY_PORT" "${opts[@]}" "$meta" "$remote:$stage/android.json"
          ssh -p "$DEPLOY_PORT" "${opts[@]}" "$remote" "mkdir -p ~/public_html/rutu-updates && mv '$stage/Rutu-BBQ-Android.apk' ~/public_html/rutu-updates/Rutu-BBQ-Android.apk && mv '$stage/android.json' ~/public_html/rutu-updates/android.json && chmod 644 ~/public_html/rutu-updates/Rutu-BBQ-Android.apk ~/public_html/rutu-updates/android.json && rmdir '$stage'"

      - name: Create GitHub Release with APKs
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "The One — build ${{ github.run_number }}"
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            carradio/build/outputs/apk/debug/carradio-debug.apk
            jadeorders/build/outputs/apk/debug/jadeorders-debug.apk
            rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
