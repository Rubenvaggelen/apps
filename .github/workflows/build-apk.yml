name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android >/dev/null

      - name: Inject API keys
        run: |
          sed -i "s|GEMINI_API_KEY=PLAATS_HIER_JE_KEY|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" gradle.properties

      - name: Print signing certificate
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Compare build 77 with this APK
        shell: bash
        run: |
          set -euo pipefail

          NEW_APK="app/build/outputs/apk/debug/app-debug.apk"
          OLD_APK="/tmp/app-v77.apk"
          REPORT="update-diagnostics.txt"

          curl -L --fail --retry 3 \
            "https://github.com/Rubenvaggelen/apps/releases/download/v77/app-debug.apk" \
            -o "$OLD_APK"

          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" >/tmp/v77-sign.txt 2>&1
          "$APKSIGNER" verify --verbose --print-certs "$NEW_APK" >/tmp/new-sign.txt 2>&1

          CERT77="$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/v77-sign.txt | sed 's/.*digest: //')"
          CERTNEW="$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/new-sign.txt | sed 's/.*digest: //')"

          BADGE77="$("$AAPT" dump badging "$OLD_APK" | grep -m1 '^package:')"
          BADGENEW="$("$AAPT" dump badging "$NEW_APK" | grep -m1 '^package:')"

          PKG77="$(echo "$BADGE77" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          PKGNEW="$(echo "$BADGENEW" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          VC77="$(echo "$BADGE77" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VCNEW="$(echo "$BADGENEW" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VN77="$(echo "$BADGE77" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          VNNEW="$(echo "$BADGENEW" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          SIG_MATCH=NO
          PKG_MATCH=NO
          VERSION_HIGHER=NO
          [ "$CERT77" = "$CERTNEW" ] && SIG_MATCH=YES
          [ "$PKG77" = "$PKGNEW" ] && PKG_MATCH=YES
          if [ "$VCNEW" -gt "$VC77" ]; then VERSION_HIGHER=YES; fi

          COMPATIBLE=NO
          if [ "$SIG_MATCH" = YES ] && [ "$PKG_MATCH" = YES ] && [ "$VERSION_HIGHER" = YES ]; then
            COMPATIBLE=YES
          fi

          {
            echo "THE ONE UPDATE DIAGNOSTICS"
            echo "Generated by GitHub Actions run ${{ github.run_number }}"
            echo
            echo "BUILD 77"
            echo "package=$PKG77"
            echo "versionCode=$VC77"
            echo "versionName=$VN77"
            echo "certificate_sha256=$CERT77"
            echo "apk_sha256=$(sha256sum "$OLD_APK" | awk '{print $1}')"
            echo
            echo "NEW BUILD"
            echo "package=$PKGNEW"
            echo "versionCode=$VCNEW"
            echo "versionName=$VNNEW"
            echo "certificate_sha256=$CERTNEW"
            echo "apk_sha256=$(sha256sum "$NEW_APK" | awk '{print $1}')"
            echo
            echo "RESULT"
            echo "same_package=$PKG_MATCH"
            echo "same_signing_certificate=$SIG_MATCH"
            echo "new_versionCode_is_higher=$VERSION_HIGHER"
            echo "android_update_compatible=$COMPATIBLE"
            echo
            echo "BUILD 77 APKSIGNER"
            cat /tmp/v77-sign.txt
            echo
            echo "NEW BUILD APKSIGNER"
            cat /tmp/new-sign.txt
          } | tee "$REPORT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmail-org-hub-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload update diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: update-diagnostics
          path: update-diagnostics.txt

      - name: Create GitHub Release with APK and diagnostics
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "The One — build ${{ github.run_number }}"
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            update-diagnostics.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
