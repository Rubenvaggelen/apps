name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android >/dev/null

      - name: Inject API keys
        run: |
          if [ -f gradle.properties ]; then
            sed -i "s|GEMINI_API_KEY=PLAATS_HIER_JE_KEY|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" gradle.properties
          fi

      - name: Print fixed signing certificate
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android

      - name: Build clean debug APK with fixed key
        run: gradle clean assembleDebug --no-daemon --no-build-cache -PappVersionCode=${{ github.run_number }}

      - name: Verify APK uses fixed signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          KEY_CERT=$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          APK_CERT=$($APKSIGNER verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          echo "Keystore certificate: $KEY_CERT"
          echo "APK certificate:      $APK_CERT"

          if [ -z "$KEY_CERT" ] || [ -z "$APK_CERT" ]; then
            echo "ERROR: Could not read one of the signing certificates."
            exit 1
          fi

          if [ "$KEY_CERT" != "$APK_CERT" ]; then
            echo "ERROR: APK was NOT signed with DEBUG_KEYSTORE_BASE64. Release blocked."
            exit 1
          fi

          echo "OK: APK is signed with the fixed keystore."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmail-org-hub-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "The One — build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
