name: Build and verify The One Cinema Google TV
on:
  push:
    branches: [feature/cinema-google-tv-20261012]
    paths: [cinema-tv/**, .github/workflows/cinema-google-tv.yml]
permissions:
  contents: read
concurrency:
  group: cinema-google-tv
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v3
        with: {gradle-version: '8.7'}
      - name: Restore stable owner signing identity
        env:
          SIGNING_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_KEY"
          mkdir -p ~/.android
          printf '%s' "$SIGNING_KEY" | base64 -d > ~/.android/debug.keystore
      - name: Restore verified existing Media Player configuration
        run: |
          set -euo pipefail
          umask 077
          curl -fLsS --max-time 120 'https://github.com/Rubenvaggelen/apps/releases/download/media-player-v2400/The-One-Media-Player-v2400.apk' -o /tmp/cinema-source.apk
          echo 'a76dfa81c8670d1c044776fa1f10264eff958eca64339d6dd0d6f6ccedb3e04b  /tmp/cinema-source.apk' | sha256sum --check --status
          python3 - <<'PY'
          import zipfile,json,pathlib,hmac,hashlib
          with zipfile.ZipFile('/tmp/cinema-source.apk') as z:
              c=json.loads(z.read('assets/private_xtream.json'))
          if not all(isinstance(c.get(k),str) and c[k].strip() for k in ['server','username','password']):
              raise SystemExit('Media Player configuration unavailable')
          p=pathlib.Path('cinema-tv/app/src/main/assets/private_cinema.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          token=hmac.new(c['password'].encode(),b'the-one-cinema-relay-v1',hashlib.sha256).hexdigest()
          p.write_text(json.dumps({'relay_url':'https://rubenvanaggelen.com/the-one-remote-api/cinema.php','relay_token':token}))
          PY
          rm /tmp/cinema-source.apk
      - name: Verify native playback test fixture
        run: |
          python3 - <<'PY_FIXTURE'
          import pathlib,base64,hashlib
          root=pathlib.Path('cinema-tv')
          data=base64.b64decode((root/'tests/test-clip.mp4.base64').read_text(),validate=False)
          digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()
          assert digest=='5f9ae34ede49119e518895d59deccba6f242ade0', 'Fixture integrity mismatch'
          p=root/'app/src/debug/assets/test-clip.mp4'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(data)
          PY_FIXTURE
      - name: Build and unit test independent TV APK
        working-directory: cinema-tv
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Verify Google TV package and signature
        working-directory: cinema-tv
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" > /tmp/cinema-badging.txt
          grep "package: name='com.theone.cinema.tv' versionCode='100'" /tmp/cinema-badging.txt
          grep 'leanback-launchable-activity' /tmp/cinema-badging.txt
          mkdir -p deliverable
          cp "$APK" deliverable/The-One-Cinema-Google-TV-v1.0.0.apk
          sha256sum deliverable/The-One-Cinema-Google-TV-v1.0.0.apk > deliverable/SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test remote navigation on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd cinema-tv && gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Encrypt personal APK before artifact publication
        if: success()
        working-directory: cinema-tv
        run: |
          set -euo pipefail
          umask 077
          mkdir -p protected-deliverable
          openssl rand 32 > /tmp/cinema-artifact-key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass file:/tmp/cinema-artifact-key -in deliverable/The-One-Cinema-Google-TV-v1.0.0.apk -out protected-deliverable/The-One-Cinema-Google-TV-v1.0.0.apk.enc
          openssl pkeyutl -encrypt -pubin -inkey owner-artifact-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/cinema-artifact-key -out protected-deliverable/key.enc
          cp deliverable/SHA256SUMS.txt protected-deliverable/SHA256SUMS.txt
          rm /tmp/cinema-artifact-key
      - name: Save personal installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: the-one-cinema-google-tv-v100
          path: cinema-tv/protected-deliverable/
          retention-days: 7
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-google-tv-test-reports
          path: |
            cinema-tv/app/build/reports/tests/
            cinema-tv/app/build/reports/androidTests/
          retention-days: 7
