name: Rutu Bedrijf v944 - onafhankelijke status per bestelling
on:
  push:
    branches: [fix/rutu-bedrijf-status-map-index-v944-20261028]
    paths: [.github/workflows/rutu-business-status-v944.yml]
permissions:
  contents: write
concurrency:
  group: rutu-business-v944-status
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Validate status transitions, history UI, and deployment guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/deploy-rutu-business-status-v944.sh
          php -l rutu-server/index.php
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('rutubusinessandroid/src/main/assets/business.html','utf8');
          const match=html.match(/<script>\s*([\s\S]*?)<\/script>/);
          assert(match,'Inline business script found');
          new Function(match[1]);
          const code=match[1];
          const a=code.indexOf('function actionButton('),b=code.indexOf('async function sync(){',a);
          const c=code.indexOf('function renderFullHistory(){'),d=code.indexOf('function openHistory(',c);
          assert(a>0&&b>a&&c>b&&d>c);
          const elements={};
          const ctx={
            orders:[],historyScreenOpen:true,
            openStatuses:o=>!['Afgerond','Uitverkocht','Geweigerd','Geannuleerd'].includes(o.status),
            esc:s=>String(s),
            money:()=> '€ 10',when:()=>'',paymentLine:()=>'',console,
            document:{getElementById:id=>elements[id]||(elements[id]={textContent:'',innerHTML:''})}
          };
          vm.createContext(ctx);
          vm.runInContext(code.slice(a,b)+'\n'+code.slice(c,d),ctx);
          const order={id:123,status:'Nieuw',items:[],total:10,customer:'Test',delivery:false,historyCleared:false,paymentMethod:''};
          ctx.orders=[order];
          ctx.renderFullHistory();
          assert(elements.fullHistoryList.innerHTML.includes('Accepteren'));
          assert(elements.fullHistoryList.innerHTML.includes('setStatus(123,'));
          order.status='In bereiding';
          ctx.renderFullHistory();
          assert(elements.fullHistoryList.innerHTML.includes('Markeer klaar'));
          order.status='Afgerond';
          ctx.renderFullHistory();
          assert(!elements.fullHistoryList.innerHTML.includes('setStatus('));
          assert(code.includes('orderCard(o,!openStatuses(o));m.classList.add'));
          assert(code.includes("api('business_status','POST'"));
          // Regression: multiple active orders must each have their own controls.
          const second={...order,id:1142,status:'In bereiding'};
          const third={...order,id:1143,status:'Nieuw'};
          ctx.orders=[order,second,third];
          ctx.renderFullHistory();
          const visible=elements.fullHistoryList.innerHTML;
          assert(visible.includes('Bestelling #123')&&visible.includes('Bestelling #1142')&&visible.includes('Bestelling #1143'));
          assert(visible.includes('setStatus(1142,'));
          assert(visible.includes('Markeer klaar'));
          assert(visible.includes('applySelectedOrderStatus(this,1142)'));
          assert(visible.includes('applySelectedOrderStatus(this,1143)'));
          assert(!visible.includes('applySelectedOrderStatus(this,123)'));
          const cards=ctx.orders.map(o=>ctx.orderCard(o,false));
          assert(cards[0].includes('Accepteren')===false); // #123 is already complete
          assert(cards[1].includes('Markeer klaar'));
          assert(cards[2].includes('Accepteren'));
          assert(cards[2].includes('Status opslaan'));
          assert(cards[1].includes('Status opslaan'));
          assert(!html.includes('.map(orderCard)'));
          assert(html.includes('active.map(o=>orderCard(o,false))'));
          assert(html.includes('other.map(o=>orderCard(o,false))'));
          assert(html.includes('open.map(o=>orderCard(o,false))'));
          ctx.rememberOrderStatus({value:'Klaar'},1142);
          assert(ctx.orderCard(second,false).includes('value="Klaar" selected'));
          console.log('RUTU_BUSINESS_V944_MULTI_ORDER_STATUS_SELECTOR_OK');
          console.log('RUTU_BUSINESS_V944_ORDER_STATUS_TRANSITIONS_OK');
          JS
      - name: Restore original Rutu Business signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64"
          install -d -m 0700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 0600 "$HOME/.android/debug.keystore"
      - name: Build only Rutu Bedrijf v944
        run: gradle :rutubusinessandroid:assembleDebug --no-daemon --no-build-cache -PappVersionCode=944
      - name: Verify identity and upgrade signature against current Business v943
        shell: bash
        run: |
          set -euo pipefail
          apk=rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk
          test -s "$apk"
          sdk="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          aapt="$sdk/aapt"
          signer="$sdk/apksigner"
          "$aapt" dump badging "$apk" | grep -F "versionCode='944'"
          curl -fLsS --retry 2 --max-time 90 'https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Bedrijf-Android.apk' -o /tmp/business-v943.apk
          printf '%s  %s\n' 5f7d40c0ec366e5c1f4b846bd2b36e1e319e9e8126cf0dda10b8c4f0b4de51fc /tmp/business-v943.apk | sha256sum --check
          # Compare the new package's known v943 applicationId, then compare
          # the signing certificate of old and new APKs for in-place upgrades.
          "$aapt" dump badging "$apk" | grep -F "package: name='com.vanaggelen.rutubusiness'"
          old="$("$signer" verify --print-certs /tmp/business-v943.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          new="$("$signer" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          test -n "$old" && test "$old" = "$new"
          echo RUTU_BUSINESS_V944_IN_PLACE_UPDATE_SIGNING_OK
      - uses: actions/upload-artifact@v4
        with:
          name: rutu-bedrijf-v944-status-fix
          path: rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk
          if-no-files-found: error
      - name: Deploy Business UI only to existing updater and Dev Hub download
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE DEPLOY_KNOWN_HOSTS;do
            test -n "$(printenv "$key")" || { echo "Missing deploy secret $key"; exit 1; }
          done
          apk=rutubusinessandroid/build/outputs/apk/debug/rutubusinessandroid-debug.apk
          new_sha="$(sha256sum "$apk" | awk '{print $1}')"
          umask 077
          d="$(mktemp -d)"
          meta="$(mktemp)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$d" "$meta"' EXIT
          printf '{"versionCode":944,"url":"https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Bedrijf-Android.apk","sha256":"%s"}\n' "$new_sha" > "$meta"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$d/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$d/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$d/askpass"
          chmod 0600 "$d/key" "$d/known_hosts"
          chmod 0700 "$d/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$d/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$d/key" </dev/null
          unset DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE
          opts=(-i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=20)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          stage="$(ssh -p "$DEPLOY_PORT" ${opts[@]} "$remote" 'mktemp -d "$HOME/.rutu-business-status-944.XXXXXXXX"')"
          scp -O -P "$DEPLOY_PORT" ${opts[@]} "$apk" "$remote:$stage/business.apk"
          scp -O -P "$DEPLOY_PORT" ${opts[@]} "$meta" "$remote:$stage/business.json"
          ssh -p "$DEPLOY_PORT" ${opts[@]} "$remote" "bash -s -- '$stage' '$new_sha'" < ci/deploy-rutu-business-status-v944.sh
          verified="$(curl -fLsS --retry 2 --max-time 90 https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Bedrijf-Android.apk | sha256sum | awk '{print $1}')"
          test "$verified" = "$new_sha"
          curl -fsS --max-time 20 https://rubenvanaggelen.com/rutu-updates/business-android.json | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["versionCode"]==944'
          curl -fsS --max-time 20 https://rubenvanaggelen.com/rutu-updates/android.json | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["versionCode"]==940'
          cp "$apk" RUTU-Bedrijf-v944-Status-Selectie.apk
          echo 'Business v944 available through original updater and Dev Hub, customer remains v940.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified Business APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rutu-bedrijf-v944-status-selectie
          target_commitish: fix/rutu-bedrijf-status-map-index-v944-20261028
          name: Rutu Bedrijf v944 - status per bestelling
          make_latest: false
          prerelease: false
          body: |
            Elke actieve bestelling heeft onafhankelijk van de volgorde eigen statusknoppen en een dropdown om de status te selecteren en op te slaan.
            Veranderingen zijn direct zichtbaar na verversen. Definitief gesloten bestellingen blijven alleen-lezen.
            De zakelijke server, bestaande bestellingen, klantapp v940 en QR blijven ongewijzigd.
            Installeer over v943. Bedrijfsleutel en bestellingen blijven behouden.
          files: RUTU-Bedrijf-v944-Status-Selectie.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
