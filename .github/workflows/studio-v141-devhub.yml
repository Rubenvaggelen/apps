name: Studio 1.4.1 Dev Hub release
on:
  push:
    branches: [release/studio-windows-v141-devhub-20261021]
    paths: ['.github/workflows/studio-v141-devhub.yml']
permissions:
  contents: read
concurrency:
  group: studio-windows-v141-devhub
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect current Studio links and protected download layout
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$tmp/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$tmp/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$tmp/askpass"
          chmod 600 "$tmp/key" "$tmp/known_hosts"; chmod 700 "$tmp/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$tmp/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$tmp/key" </dev/null
          unset DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          sshdo() { ssh -p "$DEPLOY_PORT" -i "$tmp/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known_hosts" -o ConnectTimeout=20 "$remote" "$@"; }
          scpdo() { scp -O -P "$DEPLOY_PORT" -i "$tmp/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known_hosts" -o ConnectTimeout=20 "$@"; }
          
          sshdo 'bash -s' <<'REMOTE'
          set -euo pipefail
          dir="$HOME/dev.vanaggelen.com"
          echo 'CURRENT WINDOWS DOWNLOAD COMPONENT'
          cat "$dir/windows-dj-studio-20261016.php"
          echo 'CURRENT FAMILY CATALOG TOP'
          head -45 "$dir/family-installaties.php"
          echo 'UPDATES EXISTING FILES'
          find "$dir/updates" -maxdepth 2 -type f -name '.htaccess' -o -path '*/studio/*' 2>/dev/null || true
          echo 'DOCUMENT ROOT AUTH'
          cat "$dir/.htaccess" | sed -E 's/^(AuthUserFile|AuthGroupFile).*/\1 [redacted]/'
          echo 'CHUNK UPLOAD PROGRESS'
          ls -lh "$HOME/.studio141-release-20261021"
          REMOTE
