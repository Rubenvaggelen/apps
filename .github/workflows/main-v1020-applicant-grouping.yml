name: Main 1020 one applicant requests
on:
  push:
    branches: [feature/main-android-app-tiles-license-prep-20261014]
    paths: [.github/workflows/main-v1020-applicant-grouping.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check approval dialog was integrated
        run: |
          grep -q 'requestFamilyOwnerAuthorization(scope, label)' app/src/main/java/com/gmailorg/hub/WakePcActivity.kt
          grep -q 'requestFamilyOwnerAuthorization(scope, "\$label weigeren")' app/src/main/java/com/gmailorg/hub/WakePcActivity.kt
      - name: Verify only selected device is shown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path("app/src/main/java/com/gmailorg/hub/WakePcActivity.kt").read_text()
          start=code.index("private fun showManagedDevices(")
          end=code.index("private fun managedDeviceStateText(",start)
          chooser=code[start:end]
          assert 'val selector = android.widget.Spinner(this)' in chooser
          assert 'val groups = FamilyApplicantGroups.groupDevices(devices)' in chooser
          assert 'selected.devices.forEach { renderManagedDevice(details, it) }' in chooser
          assert 'if (familyApp.isNotEmpty())' in chooser
          assert 'details.removeAllViews()' in chooser
          assert 'devices.forEach' not in chooser
          assert 'requestFamilyOwnerAuthorization(scope, label)' in chooser
          assert 'requestFamilyOwnerAuthorization(scope, "$label weigeren")' in chooser
          notifications=Path("app/src/main/java/com/gmailorg/hub/AccessRequestNotificationWorker.kt").read_text()
          assert 'FamilyAccessRequestGrouping.group(requests)' in notifications
          assert 'requestFamilyOwnerAuthorization(scope, label)' in chooser
          print("One applicant, multiple apps, permission isolation and PIN guards verified")
          PY
      - name: Validate isolated licensing server tests
        run: php the-one-remote-server/tests/family-license-smoke.php
      - name: Restore existing Main signing identity
        env:
          SIGNING_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          umask 077
          mkdir -p ~/.android
          printf '%s' "$SIGNING_KEY" | base64 -d > ~/.android/debug.keystore
      - name: Prepare offline supermarket data
        run: python3 .github/scripts/supermarket-snapshot.py
      - name: Test and assemble Main v1020
        env:
          ORG_GRADLE_PROJECT_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ORG_GRADLE_PROJECT_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug -PappVersionCode=1020 --no-daemon
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: the-one-main-v1020-applicant-grouping
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
