name: Build Remote dark launcher icon
on:
  push:
    branches: [feature/android-family-icons-20261013]
    paths: [.github/workflows/remote-dark-icon.yml, remote-icon-update/res/**]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore exact existing owner Remote APK
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          curl -fLsS -H "Authorization: Bearer $GH_ARTIFACT_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Rubenvaggelen/apps/actions/artifacts/10565282947/zip -o original.zip
          unzip -q original.zip -d original
          echo 'e368eacfc742b0456de6aae3c9ba6dbd4fc9c90b4dc0b70fd9f4fde35564e531  original/The-One-Remote-Clean.apk' | sha256sum -c -
          curl -fLsS https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          java -jar apktool.jar d -f -s original/The-One-Remote-Clean.apk -o decoded
      - name: Apply launcher resources only
        run: |
          cp -r remote-icon-update/res/. decoded/res/
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path('decoded/AndroidManifest.xml');ET.register_namespace('android','http://schemas.android.com/apk/res/android');tree=ET.parse(p)
          app=tree.getroot().find('application');ns='{http://schemas.android.com/apk/res/android}'
          app.set(ns+'icon','@mipmap/ic_launcher');app.set(ns+'roundIcon','@mipmap/ic_launcher')
          tree.write(p,encoding='utf-8',xml_declaration=True)
          y=pathlib.Path('decoded/apktool.yml');s=y.read_text();assert 'versionCode: 2067' in s;y.write_text(s.replace('versionCode: 2067','versionCode: 2068'))
          PY
          java -jar apktool.jar b decoded -o unsigned.apk
      - name: Owner-sign update
        env:
          OWNER_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.android
          printf '%s' "$OWNER_KEY" | base64 -d > ~/.android/debug.keystore
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ~/.android/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out The-One-Remote-Android-v2068.apk aligned.apk
          "$BT/apksigner" verify The-One-Remote-Android-v2068.apk
          "$BT/aapt" dump badging The-One-Remote-Android-v2068.apk | head -1
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('original/The-One-Remote-Clean.apk') as a,zipfile.ZipFile('The-One-Remote-Android-v2068.apk') as b:
              names=[n for n in a.namelist() if n.startswith(('lib/','assets/')) or n.endswith('.dex')]
              assert all(a.read(n)==b.read(n) for n in names)
          print('Existing code, assets and native libraries unchanged')
          PY
          sha256sum The-One-Remote-Android-v2068.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: the-one-remote-dark-v2068
          path: |
            The-One-Remote-Android-v2068.apk
            SHA256SUMS.txt
          retention-days: 7
