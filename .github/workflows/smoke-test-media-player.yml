name: Smoke Test Media Player v7

on:
  push:
    paths:
      - 'media-player/**'
      - '.github/workflows/smoke-test-media-player.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p media-player clean assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Launch-test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r media-player/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.theone.mediaplayer/com.theone.mediaplayer.MainActivity
            sleep 2
            adb shell run-as com.theone.mediaplayer am start -W -n com.theone.mediaplayer/com.theone.mediaplayer.XtreamCatalogActivity --es mode live
            sleep 1
            adb shell run-as com.theone.mediaplayer am start -W -n com.theone.mediaplayer/com.theone.mediaplayer.XtreamCatalogActivity --es mode movie
            sleep 1
            adb shell run-as com.theone.mediaplayer am start -W -n com.theone.mediaplayer/com.theone.mediaplayer.XtreamCatalogActivity --es mode series
            sleep 2
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee /tmp/activity.txt
            adb logcat -d > /tmp/logcat.txt
            grep -q 'FATAL EXCEPTION' /tmp/logcat.txt && exit 1 || true
            grep -q 'com.theone.mediaplayer' /tmp/activity.txt
            echo 'MEDIA_PLAYER_XTREAM_SMOKE_TEST_OK'
