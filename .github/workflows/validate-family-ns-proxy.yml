name: Validate The One NS Proxy
on:
  push:
    branches: [feature/studio-license-management-20261009]
    paths:
      - 'the-one-remote-server/ns-reisinformatie-proxy.php'
      - '.github/workflows/validate-family-ns-proxy.yml'
permissions:
  contents: read
jobs:
  php-lint-and-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: php -l the-one-remote-server/ns-reisinformatie-proxy.php
      - name: Assert no private key is embedded
        run: |
          python3 - <<'PY'
          from pathlib import Path
          content = Path('the-one-remote-server/ns-reisinformatie-proxy.php').read_text()
          assert 'ns-subscription.key' in content
          assert 'Ocp-Apim-Subscription-Key: ' in content
          assert 'CURLOPT_FOLLOWLOCATION => false' in content
          assert 'allowedOrigins' in content
          assert 'ns-proxy-rates' in content
          print('PASSED: no static NS key, bounded endpoint and rate-limited backend')
          PY
