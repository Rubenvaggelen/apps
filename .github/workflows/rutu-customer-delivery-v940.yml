name: Rutu Klant v940 - bezorgen vanaf 18:30
on:
  push:
    branches: [feature/rutu-klant-bezorging-1830-v940-20261028]
    paths: [.github/workflows/rutu-customer-delivery-v940.yml]
permissions:
  contents: write
concurrency:
  group: rutu-customer-v940-delivery
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Verify delivery notice, stock behaviour and deployment guard
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/deploy-rutu-customer-delivery-v940.sh
          php -l rutu-server/index.php
          python3 scripts/test-rutu-stock.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('jadeorders/src/main/java/com/vanaggelen/jadeorders/MainActivity.kt').read_text()
          assert 'if (deliverySelected) {\n            label("Bezorgen vanaf 18:30 uur\\nDelivery from 6:30 PM"' in s
          assert s.count('Bezorgen vanaf 18:30 uur')==1
          assert 'text = "Bezorgen / Delivery"' in s
          assert 'if (!checked)' in s
          assert 'sendOnlineOrder(LinkedHashMap(cart)' in s
          assert 'val soldInCart = cart.keys.filter' in s
          print('RUTU_CUSTOMER_V940_DELIVERY_NOTICE_CONTRACT_OK')
          PY
      - name: Restore original customer signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64"
          install -d -m 0700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 0600 "$HOME/.android/debug.keystore"
      - name: Build Rutu Klant 940 only
        run: gradle :jadeorders:assembleDebug --no-daemon --no-build-cache -PappVersionCode=940
      - name: Verify APK, original signing identity, current deployed app
        shell: bash
        run: |
          set -euo pipefail
          apk=jadeorders/build/outputs/apk/debug/jadeorders-debug.apk
          test -s "$apk"
          sdk="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          aapt="$sdk/aapt"
          signer="$sdk/apksigner"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.vanaggelen.jadeorders'"
          "$aapt" dump badging "$apk" | grep -F "versionCode='940'"
          curl -fLsS --retry 2 --max-time 90 'https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Android.apk' -o /tmp/rutu-customer-v939.apk
          printf '%s  %s\n' c05d1a4991012d5505a9beb07389af4445441cedbb2881eb425168e47fc3a6e4 /tmp/rutu-customer-v939.apk | sha256sum --check
          "$aapt" dump badging /tmp/rutu-customer-v939.apk | grep -F "versionCode='939'"
          old="$("$signer" verify --print-certs /tmp/rutu-customer-v939.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          new="$("$signer" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          test -n "$old" && test "$old" = "$new"
          echo RUTU_CUSTOMER_V940_UPGRADE_SIGNING_OK
      - uses: actions/upload-artifact@v4
        with:
          name: rutu-klant-v940-bezorging-1830
          path: jadeorders/build/outputs/apk/debug/jadeorders-debug.apk
          if-no-files-found: error
      - name: Safely deploy customer app to original in-app updater URL
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE DEPLOY_KNOWN_HOSTS; do
            test -n "$(printenv "$key")" || { echo "Missing deployment configuration: $key"; exit 1; }
          done
          apk=jadeorders/build/outputs/apk/debug/jadeorders-debug.apk
          new_sha="$(sha256sum "$apk" | awk '{print $1}')"
          umask 077
          d="$(mktemp -d)"
          meta="$(mktemp)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf "$d" "$meta"' EXIT
          printf '{"versionCode":940,"url":"https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Android.apk","sha256":"%s"}\n' "$new_sha" > "$meta"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$d/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$d/known_hosts"
          printf '#!/bin/sh\nprintf "%%s\n" "$DEPLOY_SSH_PASSPHRASE"\n' > "$d/askpass"
          chmod 0600 "$d/key" "$d/known_hosts"
          chmod 0700 "$d/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$d/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$d/key" </dev/null
          unset DEPLOY_SSH_KEY DEPLOY_SSH_PASSPHRASE
          opts=(-i "$d/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=20)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          stage="$(ssh -p "$DEPLOY_PORT" ${opts[@]} "$remote" 'mktemp -d "$HOME/.rutu-customer-delivery-940.XXXXXXXX"')"
          scp -O -P "$DEPLOY_PORT" ${opts[@]} "$apk" "$remote:$stage/customer.apk"
          scp -O -P "$DEPLOY_PORT" ${opts[@]} "$meta" "$remote:$stage/android.json"
          ssh -p "$DEPLOY_PORT" ${opts[@]} "$remote" "bash -s -- '$stage' '$new_sha'" < ci/deploy-rutu-customer-delivery-v940.sh
          verified="$(curl -fLsS --retry 2 --max-time 90 https://rubenvanaggelen.com/rutu-updates/Rutu-BBQ-Android.apk | sha256sum | awk '{print $1}')"
          test "$verified" = "$new_sha"
          curl -fsS --max-time 20 https://rubenvanaggelen.com/rutu-updates/android.json | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["versionCode"]==940'
          cp "$apk" RUTU-Klant-v940-Bezorgen-1830.apk
          echo 'Rutu Klant v940 deployed. Business, QR, order server and customer data preserved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified customer APK to GitHub releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rutu-klant-v940-bezorging-1830
          target_commitish: feature/rutu-klant-bezorging-1830-v940-20261028
          name: Rutu Klant v940 - Bezorgen vanaf 18:30 uur
          make_latest: false
          prerelease: false
          body: |
            Rutu Klant Android v940: bij Bezorgen verschijnt duidelijk 'Bezorgen vanaf 18:30 uur'.
            De melding wordt alleen getoond bij bezorgen; afhalen en alle overige bestelfuncties zijn ongewijzigd.
            De huidige QR-downloadlink, in-app update, klantenbestellingen en Rutu Bedrijf blijven behouden.
            Installeer over v939 zonder te verwijderen.
          files: RUTU-Klant-v940-Bezorgen-1830.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
