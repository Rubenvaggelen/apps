name: Prepare owner-signed Remote icon update
on:
  push:
    branches: [feature/android-family-icons-20261013]
    paths: [.github/workflows/remote-icon-signing.yml, remote-icon-update/**]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrap owner signing identity for local APK packaging
        env:
          OWNER_SIGNING: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p protected
          printf '%s' "$OWNER_SIGNING" | base64 -d > /tmp/owner-signing.keystore
          openssl rand -hex 32 > /tmp/wrap-password
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in /tmp/owner-signing.keystore -out protected/owner-signing.enc -pass file:/tmp/wrap-password
          openssl pkeyutl -encrypt -pubin -inkey remote-icon-update/owner-artifact-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/wrap-password -out protected/key.enc
          rm /tmp/owner-signing.keystore /tmp/wrap-password
      - uses: actions/upload-artifact@v4
        with:
          name: owner-remote-icon-signing
          path: protected/
          retention-days: 1
