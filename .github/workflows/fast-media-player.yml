name: Fast Media Player APK

on:
  push:
    paths:
      - 'media-player/**'
      - '.github/workflows/fast-media-player.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore permanent repository signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android >/dev/null

      - name: Build APK
        run: gradle -p media-player assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: media-player-fast
          path: media-player/app/build/outputs/apk/debug/app-debug.apk

# v18 premium build trigger
