name: Fast Media Player APK

on:
  push:
    paths:
      - 'media-player/**'
      - '.github/workflows/fast-media-player.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Keep working YouTube configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("the-one-update/app/build.gradle").read_text(encoding="utf-8")
          m = re.search(r"YOUTUBE_API_KEY.*?\\?:\\s*'([^']+)'", source, re.S)
          if not m:
              raise SystemExit("YouTube build configuration unavailable")
          Path("media-player/app/src/main/assets/private_youtube_key.txt").write_text(m.group(1), encoding="utf-8")
          PY

      - name: Build APK
        run: gradle -p media-player assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: media-player-v12-fast
          path: media-player/app/build/outputs/apk/debug/app-debug.apk

# v18 premium build trigger
