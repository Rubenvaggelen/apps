name: One-Time Wake THEONE-HUB Only
on:
  push:
    branches: [feature/dj-shared-media-identity-io-fix-20261010]
    paths: ['.github/workflows/one-shot-wake-hub-20261011.yml']
permissions:
  contents: read
jobs:
  wake-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Wake only THEONE-HUB (do not send to Ruben or Surface)
        shell: bash
        run: |
          python3 - <<'PY'
          import re,socket,time
          from pathlib import Path
          source=Path("app/src/main/java/com/gmailorg/hub/WakePcActivity.kt").read_text()
          def read(pattern,name):
              match=re.search(pattern,source,re.S|re.I)
              if not match: raise SystemExit("No verified "+name+" in current configuration")
              return match.group(1)
          address=read(r'HOME_PUBLIC_IPV4\s*=\s*"([0-9.]+)"',"public WOL address")
          port=int(read(r'HOME_PUBLIC_PORT\s*=\s*(\d+)',"public WOL port"))
          mac=read(r'WakeTarget\(\s*id\s*=\s*"hub".*?mac\s*=\s*"([A-Fa-f0-9:-]+)"',"Hub MAC")
          if port!=40009: raise SystemExit("Unexpected wake port")
          if len(address.split("."))!=4: raise SystemExit("Unexpected address")
          raw=bytes.fromhex(mac.replace("-","").replace(":",""))
          if len(raw)!=6: raise SystemExit("Unexpected MAC size")
          payload=b"\xff"*6+raw*16
          with socket.socket(socket.AF_INET,socket.SOCK_DGRAM) as connection:
              for number in range(1,7):
                  sent=connection.sendto(payload,(address,port))
                  if sent!=len(payload): raise SystemExit("Incomplete WOL packet")
                  time.sleep(.25)
          print("THEONE-HUB ONLY: 6 Wake-on-LAN packets sent")
          print("Wake request submitted; power-on and network availability not yet confirmed")
          PY
