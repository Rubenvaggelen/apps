name: Diagnose Media Player Streams

on:
  push:
    branches: [ media-player-v19-requested-only ]
    paths:
      - '.github/workflows/diagnose-media-player-streams.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      MEDIA_PLAYER_KEYSTORE_PATH: ${{ github.workspace }}/media-player-fixed.keystore

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}"
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$MEDIA_PLAYER_KEYSTORE_PATH"
          chmod 600 "$MEDIA_PLAYER_KEYSTORE_PATH"

      - name: Decrypt private source for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/media-player-private-source.enc.b64 > /tmp/source.enc
          keytool -importkeystore \
            -srckeystore "$MEDIA_PLAYER_KEYSTORE_PATH" \
            -srcstorepass android \
            -srcalias androiddebugkey \
            -destkeystore /tmp/signing.p12 \
            -deststoretype PKCS12 \
            -deststorepass changeit \
            -destkeypass changeit \
            -noprompt >/dev/null
          openssl pkcs12 -in /tmp/signing.p12 -passin pass:changeit -nodes -nocerts -out /tmp/private.pem >/dev/null 2>&1
          openssl pkeyutl -decrypt \
            -inkey /tmp/private.pem \
            -in /tmp/source.enc \
            -out /tmp/source.json \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256

      - name: Test encoded versus raw Xtream stream paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          from pathlib import Path

          src = json.loads(Path("/tmp/source.json").read_text())
          m3u = src["m3u_url"]
          p = urllib.parse.urlsplit(m3u)
          q = urllib.parse.parse_qs(p.query)
          user = (q.get("username") or [""])[0]
          pw = (q.get("password") or [""])[0]
          server = f"{p.scheme}://{p.netloc}"

          def api(action, **extra):
              params = {"username": user, "password": pw, "action": action}
              params.update(extra)
              return server + "/player_api.php?" + urllib.parse.urlencode(params)

          def get_json(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent":"TheOneMediaPlayer/0.9",
                  "Cache-Control":"no-cache",
                  "Connection":"close",
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8", "replace"))

          def probe(label, url):
              req = urllib.request.Request(url, headers={
                  "User-Agent":"TheOneMediaPlayer/0.9",
                  "Range":"bytes=0-1023",
                  "Accept":"*/*",
                  "Connection":"close",
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      chunk = r.read(1024)
                      print(f"{label}_status={r.status}")
                      print(f"{label}_type={r.headers.get('Content-Type','')}")
                      print(f"{label}_bytes={len(chunk)}")
              except urllib.error.HTTPError as e:
                  print(f"{label}_status={e.code}")
                  print(f"{label}_type={e.headers.get('Content-Type','') if e.headers else ''}")
                  print(f"{label}_bytes=0")
              except Exception as e:
                  print(f"{label}_error={type(e).__name__}")

          def stream_paths(kind, sid, ext):
              raw = server + f"/{kind}/" + user + "/" + pw + "/" + sid + "." + ext
              encoded = server + f"/{kind}/" + urllib.parse.quote(user, safe="") + "/" + urllib.parse.quote(pw, safe="") + "/" + sid + "." + ext
              return raw, encoded

          vod_categories = get_json(api("get_vod_categories"))
          if vod_categories:
              cid = str(vod_categories[0].get("category_id",""))
              vod = get_json(api("get_vod_streams", category_id=cid))
          else:
              vod = []
          movie = next((x for x in vod if str(x.get("stream_id",""))), None)
          if movie:
              mid = str(movie["stream_id"])
              ext = str(movie.get("container_extension") or "mp4").lstrip(".")
              raw, encoded = stream_paths("movie", mid, ext)
              print("movie_extension=" + ext)
              probe("movie_raw", raw)
              probe("movie_encoded", encoded)
          else:
              print("movie_error=no_item")

          series_categories = get_json(api("get_series_categories"))
          if series_categories:
              cid = str(series_categories[0].get("category_id",""))
              shows = get_json(api("get_series", category_id=cid))
          else:
              shows = []
          show = next((x for x in shows if str(x.get("series_id") or x.get("id") or "")), None)
          if show:
              sid = str(show.get("series_id") or show.get("id"))
              info = get_json(api("get_series_info", series_id=sid))

              def find_ep(node):
                  if isinstance(node, dict):
                      eid = node.get("id") or node.get("stream_id") or node.get("episode_id")
                      if eid and any(k in node for k in ("episode_num","episode","episode_number","container_extension","title")):
                          return node
                      for v in node.values():
                          r = find_ep(v)
                          if r: return r
                  elif isinstance(node, list):
                      for v in node:
                          r = find_ep(v)
                          if r: return r
                  return None

              ep = find_ep(info)
              if ep:
                  eid = str(ep.get("id") or ep.get("stream_id") or ep.get("episode_id"))
                  ext = str(ep.get("container_extension") or ep.get("extension") or "mp4").lstrip(".")
                  raw, encoded = stream_paths("series", eid, ext)
                  print("series_extension=" + ext)
                  probe("series_raw", raw)
                  probe("series_encoded", encoded)
              else:
                  print("series_error=no_episode")
          else:
              print("series_error=no_show")
          PY

      - name: Remove decrypted diagnostics data
        if: always()
        shell: bash
        run: |
          rm -f /tmp/source.enc /tmp/source.json /tmp/signing.p12 /tmp/private.pem
