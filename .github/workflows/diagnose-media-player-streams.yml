name: Diagnose Media Player Stream Format

on:
  push:
    branches: [ media-player-v19-requested-only ]
    paths:
      - '.github/workflows/diagnose-media-player-streams.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      MEDIA_PLAYER_KEYSTORE_PATH: ${{ github.workspace }}/media-player-fixed.keystore

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$MEDIA_PLAYER_KEYSTORE_PATH"

      - name: Decrypt source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/media-player-private-source.enc.b64 > /tmp/source.enc
          keytool -importkeystore -srckeystore "$MEDIA_PLAYER_KEYSTORE_PATH" -srcstorepass android -srcalias androiddebugkey -destkeystore /tmp/signing.p12 -deststoretype PKCS12 -deststorepass changeit -destkeypass changeit -noprompt >/dev/null
          openssl pkcs12 -in /tmp/signing.p12 -passin pass:changeit -nodes -nocerts -out /tmp/private.pem >/dev/null 2>&1
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/source.enc -out /tmp/source.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256

      - name: Inspect account and playlist stream format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          from pathlib import Path

          src=json.loads(Path("/tmp/source.json").read_text())
          m3u=src["m3u_url"]
          p=urllib.parse.urlsplit(m3u)
          q=urllib.parse.parse_qs(p.query)
          user=(q.get("username") or [""])[0]
          pw=(q.get("password") or [""])[0]
          server=f"{p.scheme}://{p.netloc}"

          def read_json(url):
              req=urllib.request.Request(url,headers={"User-Agent":"TheOneMediaPlayer/0.9","Connection":"close"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode("utf-8","replace"))

          account=read_json(server+"/player_api.php?"+urllib.parse.urlencode({"username":user,"password":pw}))
          ui=account.get("user_info") or {}
          print("account_status="+str(ui.get("status","")))
          print("active_cons="+str(ui.get("active_cons","")))
          print("max_connections="+str(ui.get("max_connections","")))
          print("allowed_output_formats="+",".join(map(str,ui.get("allowed_output_formats") or [])))
          print("m3u_output="+str((q.get("output") or [""])[0]))

          req=urllib.request.Request(m3u,headers={"User-Agent":"TheOneMediaPlayer/0.9","Connection":"close"})
          movie_ext=""
          series_ext=""
          with urllib.request.urlopen(req,timeout=25) as r:
              for _ in range(20000):
                  line=r.readline().decode("utf-8","replace").strip()
                  if not line: continue
                  low=line.lower()
                  if not movie_ext and "/movie/" in low:
                      path=urllib.parse.urlsplit(line).path
                      movie_ext=path.rsplit(".",1)[-1].lower() if "." in path.rsplit("/",1)[-1] else "none"
                  if not series_ext and "/series/" in low:
                      path=urllib.parse.urlsplit(line).path
                      series_ext=path.rsplit(".",1)[-1].lower() if "." in path.rsplit("/",1)[-1] else "none"
                  if movie_ext and series_ext:
                      break
          print("playlist_movie_extension="+movie_ext)
          print("playlist_series_extension="+series_ext)
          PY

      - name: Cleanup
        if: always()
        run: rm -f /tmp/source.enc /tmp/source.json /tmp/signing.p12 /tmp/private.pem
