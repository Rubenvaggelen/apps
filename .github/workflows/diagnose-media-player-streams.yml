name: Diagnose Media Player Extensions

on:
  push:
    branches: [ media-player-v19-requested-only ]
    paths:
      - '.github/workflows/diagnose-media-player-streams.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      MEDIA_PLAYER_KEYSTORE_PATH: ${{ github.workspace }}/media-player-fixed.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and decrypt source
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$MEDIA_PLAYER_KEYSTORE_PATH"
          base64 -d .github/media-player-private-source.enc.b64 > /tmp/source.enc
          keytool -importkeystore -srckeystore "$MEDIA_PLAYER_KEYSTORE_PATH" -srcstorepass android -srcalias androiddebugkey -destkeystore /tmp/signing.p12 -deststoretype PKCS12 -deststorepass changeit -destkeypass changeit -noprompt >/dev/null
          openssl pkcs12 -in /tmp/signing.p12 -passin pass:changeit -nodes -nocerts -out /tmp/private.pem >/dev/null 2>&1
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/source.enc -out /tmp/source.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - name: Probe current Xtream account and source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          from pathlib import Path

          src=json.loads(Path("/tmp/source.json").read_text())
          p=urllib.parse.urlsplit(src["m3u_url"])
          q=urllib.parse.parse_qs(p.query)
          user=(q.get("username") or [""])[0]
          pw=(q.get("password") or [""])[0]
          server=f"{p.scheme}://{p.netloc}"

          def redact(value):
              if value is None:
                  return ""
              value=str(value)
              if user:
                  value=value.replace(user,"<user>")
              if pw:
                  value=value.replace(pw,"<pass>")
              return value[:300].replace("\n"," ")

          def request(url, ua="TheOneMediaPlayer/0.9", read=700):
              req=urllib.request.Request(url,headers={"User-Agent":ua,"Connection":"close"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(read)
                      return r.status, dict(r.headers), body
              except urllib.error.HTTPError as e:
                  try:
                      body=e.read(read)
                  except Exception:
                      body=b""
                  return e.code, dict(e.headers or {}), body
              except Exception as e:
                  return -1, {}, str(type(e).__name__+":"+str(e)).encode()

          def show(label,url,ua="TheOneMediaPlayer/0.9"):
              code,headers,body=request(url,ua)
              print(label+"_status="+str(code))
              print(label+"_content_type="+redact(headers.get("Content-Type","")))
              print(label+"_body="+redact(body.decode("utf-8","replace")))
              return code,headers,body

          params={"username":user,"password":pw}
          bare=server+"/player_api.php?"+urllib.parse.urlencode(params)
          code,headers,body=show("player_api",bare)

          try:
              data=json.loads(body.decode("utf-8","replace"))
              ui=data.get("user_info") if isinstance(data,dict) else None
              if isinstance(ui,dict):
                  for key in ("auth","status","active_cons","max_connections","exp_date","is_trial"):
                      if key in ui:
                          print("user_info_"+key+"="+redact(ui.get(key)))
          except Exception:
              pass

          for action in ("get_live_categories","get_vod_categories","get_series_categories"):
              url=bare+"&action="+urllib.parse.quote(action)
              show(action,url)

          show("m3u",src["m3u_url"])

          # Also try the two common output variants without exposing credentials.
          base_get=server+"/get.php?"+urllib.parse.urlencode({
              "username":user,
              "password":pw,
              "type":"m3u_plus",
          })
          show("m3u_ts",base_get+"&output=ts")
          show("m3u_m3u8",base_get+"&output=m3u8")
          PY
      - name: Cleanup
        if: always()
        run: rm -f /tmp/source.enc /tmp/source.json /tmp/signing.p12 /tmp/private.pem
