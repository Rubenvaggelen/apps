plugins { id 'com.android.application' }
android {
 namespace 'com.theone.series.tv'
 compileSdk 36
 defaultConfig {
  applicationId 'com.theone.series.tv'
  minSdk 23
  targetSdk 35
  versionCode 136
  versionName '1.2.9-visionquest-stability'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { buildConfig true }
 signingConfigs {
  owner {
   storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 buildTypes {
  debug { signingConfig signingConfigs.owner }
  release { minifyEnabled false; signingConfig signingConfigs.owner }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.core:core:1.13.1'
 implementation 'androidx.media3:media3-exoplayer:1.11.0'
 implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
 implementation 'androidx.media3:media3-exoplayer-dash:1.11.0'
 implementation 'androidx.media3:media3-ui:1.11.0'
 implementation 'org.videolan.android:libvlc-all:3.6.5'
 implementation 'io.github.anilbeesetti:nextlib-media3ext:1.11.0-0.15.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
