plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gmailorg.hub'
    compileSdk 34

    defaultConfig {
        applicationId "com.gmailorg.hub"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // TMDB API key voor de "Film zoeken"-functie onder Huishouden.
        // Zet je eigen key in gradle.properties als TMDB_API_KEY=... (niet hier hardcoden).
        buildConfigField "String", "TMDB_API_KEY", "\"${project.findProperty('TMDB_API_KEY') ?: ''}\""

        // OpenAI API key voor de "Vraag het"-tegel (ChatGPT).
        // Zet je eigen key in gradle.properties als OPENAI_API_KEY=... (niet hier hardcoden).
        buildConfigField "String", "OPENAI_API_KEY", "\"${project.findProperty('OPENAI_API_KEY') ?: ''}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}
