<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goedkoopste tankstations — Route tegel</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #171a21;
    --border: #262b35;
    --text: #e8eaed;
    --muted: #8a8f9a;
    --accent: #4fd1a5;
    --accent-dim: rgba(79, 209, 165, 0.12);
    --danger: #e0665f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .tegel {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .tegel-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .tegel-header h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .fuel-switch {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    margin-bottom: 14px;
  }
  .fuel-switch button {
    flex: 1;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  .fuel-switch button.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .nav-switch {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .nav-switch span {
    font-size: 11px;
    color: var(--muted);
    align-self: center;
    margin-right: 2px;
  }
  .nav-switch button {
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
  }
  .nav-switch button.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .station-row {
    cursor: pointer;
    transition: background 0.15s;
  }
  .station-row:hover {
    background: rgba(255,255,255,0.04);
  }
  .station-row:nth-child(1):hover {
    background: var(--accent-dim);
  }
  .status {
    font-size: 13px;
    color: var(--muted);
    padding: 20px 0;
    text-align: center;
  }
  .status.error { color: var(--danger); }
  .station-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .station-row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-radius: 10px;
  }
  .station-row:nth-child(1) { background: var(--accent-dim); }
  .rank {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .station-row:nth-child(1) .rank { color: var(--accent); font-weight: 700; }
  .station-name {
    font-size: 14px;
    line-height: 1.3;
  }
  .station-name .sub {
    display: block;
    font-size: 12px;
    color: var(--muted);
  }
  .station-price {
    text-align: right;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .station-price .dist {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }
  .refresh-note {
    margin-top: 12px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  .retry-btn {
    display: block;
    margin: 10px auto 0;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="tegel" id="tegel">
  <div class="tegel-header">
    <h2>Goedkoopste tanken</h2>
  </div>
  <div class="fuel-switch" id="fuelSwitch"></div>
  <div class="nav-switch" id="navSwitch">
    <span>Navigeren met:</span>
  </div>
  <div id="content" class="status">Locatie ophalen…</div>
</div>

<script>
/*
  =========================================================================
  Goedkoopste tankstations — tegel voor de Route-pagina
  =========================================================================

  Databron: de publieke (niet-officiële, reverse-engineered) REST API die
  de ANWB-app zelf gebruikt. Geen eigen account of registratie nodig, maar
  dit is GEEN officieel gedocumenteerde/ondersteunde API:
    - de sleutel hieronder is een gedeelde app-key uit meerdere open-source
      projecten (o.a. github.com/bartmachielsen/ANWB-Fuel-Prices), niet iets
      wat exclusief voor jou is uitgegeven
    - ANWB kan de key op elk moment intrekken of het endpoint wijzigen,
      zonder aankondiging — dit kan dus op een dag stoppen met werken
    - er is geen rate-limit-documentatie; bij twijfel niet te vaak verversen

  Praktisch: dit fetcht direct vanuit de browser (geen eigen backend nodig),
  precies zoals je bestaande auto-route module met OSRM/Nominatim werkt.
  =========================================================================
*/

const ANWB_BASE = "https://api.anwb.nl/v1";
const ANWB_API_KEY = "GNYXLHxCa14zfA1nVJkVV8ldQZHbPTcu";
const SEARCH_RADIUS_KM = 10;  // straal om je actuele locatie
const MAX_RESULTS = 5;

// Vaste-adressen fallback (zelfde idee als je "vast vertrekadres" bij Auto-route,
// voor als geolocation geblokkeerd is door de werk-Chrome restrictie)
const FALLBACK_LOCATION = { lat: 52.3508, lng: 5.2647, label: "Almere (standaard)" };

let allStations = [];
let fuelTypes = [];
let selectedFuelTypeId = null;
let navApp = localStorage.getItem("route-nav-app") || "waze"; // "waze" of "google"

const contentEl = document.getElementById("content");
const fuelSwitchEl = document.getElementById("fuelSwitch");
const navSwitchEl = document.getElementById("navSwitch");

function renderNavSwitch() {
  navSwitchEl.querySelectorAll("button").forEach(b => b.remove());
  [["waze", "Waze"], ["google", "Google Maps"]].forEach(([id, label]) => {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.className = navApp === id ? "active" : "";
    btn.onclick = (e) => {
      e.stopPropagation();
      navApp = id;
      localStorage.setItem("route-nav-app", id);
      renderNavSwitch();
    };
    navSwitchEl.appendChild(btn);
  });
}
renderNavSwitch();

function openRoute(lat, lng) {
  const url = navApp === "waze"
    ? `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`
    : `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  window.open(url, "_blank");
}

function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function boundingBox(lat, lng, radiusKm) {
  const latDelta = radiusKm / 111; // ~111 km per breedtegraad
  const lngDelta = radiusKm / (111 * Math.cos(lat * Math.PI / 180));
  return {
    sw: [lat - latDelta, lng - lngDelta],
    ne: [lat + latDelta, lng + lngDelta]
  };
}

async function anwbGet(path) {
  const res = await fetch(ANWB_BASE + path, {
    headers: { apiKey: ANWB_API_KEY }
  });
  if (!res.ok) throw new Error("ANWB API gaf status " + res.status);
  return res.json();
}

async function loadFuelTypes() {
  const data = await anwbGet("/fuel/types");
  fuelTypes = data.items || data || [];
  // Zoek Euro 95 als standaard-selectie; val terug op de eerste
  const e95 = fuelTypes.find(t =>
    (t.name || t.description || "").toLowerCase().includes("95")
  );
  selectedFuelTypeId = e95 ? e95.id : (fuelTypes[0] && fuelTypes[0].id);
  renderFuelSwitch();
}

function renderFuelSwitch() {
  fuelSwitchEl.innerHTML = "";
  fuelTypes.forEach(t => {
    const btn = document.createElement("button");
    btn.textContent = t.name || t.description || ("Type " + t.id);
    btn.className = t.id === selectedFuelTypeId ? "active" : "";
    btn.onclick = () => {
      selectedFuelTypeId = t.id;
      renderFuelSwitch();
      renderStations();
    };
    fuelSwitchEl.appendChild(btn);
  });
}

// Zoekt de prijs voor het gekozen brandstoftype in een station-item.
// De exacte veldnamen van de ANWB-response zijn niet publiek gedocumenteerd,
// dus dit probeert een paar bekende varianten voordat het opgeeft.
function extractPrice(station) {
  const candidates = station.prices || station.fuels || station.fuelPrices || [];
  for (const p of candidates) {
    const typeId = p.fuelTypeId ?? p.typeId ?? p.id;
    if (typeId === selectedFuelTypeId) {
      return p.price ?? p.value ?? p.amount ?? null;
    }
  }
  // fallback: direct veld met het type-id als key
  if (station[selectedFuelTypeId] != null) return station[selectedFuelTypeId];
  return null;
}

function getStationCoords(station) {
  if (station.location) return [station.location.lat, station.location.lng];
  if (station.lat != null && station.lng != null) return [station.lat, station.lng];
  if (station.coordinates) return [station.coordinates[1], station.coordinates[0]];
  return null;
}

async function loadStations(lat, lng) {
  const { sw, ne } = boundingBox(lat, lng, SEARCH_RADIUS_KM);
  const data = await anwbGet(`/fuel/stations?sw=${sw[0]},${sw[1]}&ne=${ne[0]},${ne[1]}`);
  allStations = (data.items || data || []).map(s => {
    const coords = getStationCoords(s);
    return {
      raw: s,
      name: s.name || s.brand || "Onbekend station",
      brand: s.brand || "",
      lat: coords ? coords[0] : null,
      lng: coords ? coords[1] : null,
      distanceKm: coords ? haversineKm(lat, lng, coords[0], coords[1]) : null
    };
  });
}

function renderStations() {
  const withPrice = allStations
    .map(s => ({ ...s, price: extractPrice(s.raw) }))
    .filter(s => s.price != null)
    .sort((a, b) => a.price - b.price)
    .slice(0, MAX_RESULTS);

  if (withPrice.length === 0) {
    contentEl.className = "status error";
    contentEl.textContent = "Geen prijzen gevonden voor dit brandstoftype in de buurt.";
    return;
  }

  contentEl.className = "";
  contentEl.innerHTML = "";

  const list = document.createElement("div");
  list.className = "station-list";

  withPrice.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "station-row";
    row.innerHTML = `
      <div class="rank">${i + 1}</div>
      <div class="station-name">${s.name}<span class="sub">${s.brand}</span></div>
      <div class="station-price">€${s.price.toFixed(3)}
        <span class="dist">${s.distanceKm != null ? s.distanceKm.toFixed(1) + " km" : ""}</span>
      </div>
    `;
    if (s.lat != null && s.lng != null) {
      row.onclick = () => openRoute(s.lat, s.lng);
    } else {
      row.style.cursor = "default";
    }
    list.appendChild(row);
  });

  contentEl.appendChild(list);

  const note = document.createElement("div");
  note.className = "refresh-note";
  note.textContent = "Bron: ANWB (niet-officiële API) · straal " + SEARCH_RADIUS_KM + " km · tik op een station voor de route";
  contentEl.appendChild(note);
}

async function init(lat, lng) {
  try {
    contentEl.className = "status";
    contentEl.textContent = "Prijzen ophalen…";
    if (fuelTypes.length === 0) await loadFuelTypes();
    await loadStations(lat, lng);
    renderStations();
  } catch (err) {
    contentEl.className = "status error";
    contentEl.innerHTML = "Kon prijzen niet ophalen: " + err.message +
      "<button class='retry-btn' onclick='start()'>Opnieuw proberen</button>";
  }
}

function start() {
  if (!navigator.geolocation) {
    init(FALLBACK_LOCATION.lat, FALLBACK_LOCATION.lng);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => init(pos.coords.latitude, pos.coords.longitude),
    () => init(FALLBACK_LOCATION.lat, FALLBACK_LOCATION.lng), // geblokkeerd op werk-Chrome -> fallback
    { timeout: 6000 }
  );
}

start();
</script>

</body>
</html>
