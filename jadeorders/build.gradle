plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vanaggelen.jadeorders'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    def appVersionCode = project.hasProperty('appVersionCode') ? project.property('appVersionCode').toString().toInteger() : 1

    defaultConfig {
        applicationId "com.vanaggelen.jadeorders"
        minSdk 26
        targetSdk 36
        versionCode appVersionCode
        versionName "1.${appVersionCode}"
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Play Store gets a dedicated upload key, never the shared debug key.
        if (System.getenv('RUTU_PLAY_UPLOAD_KEYSTORE_PATH')) {
            playUpload {
                storeFile file(System.getenv('RUTU_PLAY_UPLOAD_KEYSTORE_PATH'))
                storePassword System.getenv('RUTU_PLAY_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RUTU_PLAY_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('RUTU_PLAY_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (signingConfigs.findByName('playUpload') != null) {
                signingConfig signingConfigs.playUpload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
