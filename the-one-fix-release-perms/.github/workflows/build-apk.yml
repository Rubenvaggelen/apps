name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Restore fixed debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
      - name: Inject API keys
        run: |
          sed -i "s|GEMINI_API_KEY=PLAATS_HIER_JE_KEY|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" gradle.properties
      - name: Print signing SHA-1 (voor Google OAuth)
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android || true
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmail-org-hub-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "The One — build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
