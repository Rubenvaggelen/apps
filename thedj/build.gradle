// Dev Hub standalone DJ APK - synced with Windows build 221
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gmailorg.thedj'
    compileSdk 34

    def appVersionCode = project.hasProperty('appVersionCode') ?
        project.property('appVersionCode').toString().toInteger() : 1

    defaultConfig {
        applicationId 'com.gmailorg.thedj'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName "1.${appVersionCode}"
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // LGPL audio build; supports WMA, AAC/ALAC, FLAC, Vorbis/Opus, AC3, AMR and container demuxing.
    implementation 'io.github.maxrave-dev:ffmpeg-kit-audio:6.0.1'
}


tasks.register("syncDjEngine", Copy) {
    from rootProject.file("windows/the-one-dj")
    include "index.html", "dj-logo.jpg", "dj-logo.svg"
    into project.file("src/main/assets")
}

tasks.named("preBuild").configure {
    dependsOn("syncDjEngine")
}


tasks.register("syncDjBranding", Copy) {
    from rootProject.file("windows/the-one-dj/dj-logo.jpg")
    into project.file("src/main/res/drawable-nodpi")
    rename { "the_one_dj_logo.jpg" }
}
tasks.named("preBuild").configure { dependsOn("syncDjBranding") }
