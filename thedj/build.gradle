// Dev Hub standalone DJ APK
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gmailorg.thedj'
    compileSdk 34

    def appVersionCode = project.hasProperty('appVersionCode') ?
        project.property('appVersionCode').toString().toInteger() : 1

    defaultConfig {
        applicationId 'com.gmailorg.thedj'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName "1.${appVersionCode}"
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
