<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rutu BBQ — Klant</title><link rel="stylesheet" href="brand.css"></head><body><header><div class="identity"><img class="brand-logo" src="assets/rutu-logo.png" alt="Rutu BBQ"><div><div class="brand">RUTU BBQ</div><div class="tag">Klantomgeving</div></div></div></header><main class="wrap"><section class="hero"><p class="eyebrow">RUTU BBQ • MORE THAN FOOD</p><h1>Fire. Roots. Flavour.</h1><p>Van het vuur, met aandacht bereid. Kies je favorieten en geniet.</p></section><div class="products" id="products"></div><div class="cart"><h3>Jouw winkelmand</h3><div id="cart"></div><div class="line total"><span>Totaal</span><span id="total">€ 0,00</span></div><button class="send" onclick="placeOrder()">Bestelling versturen</button></div><h3>Mijn bestellingen</h3><div id="orders"></div><footer class="footer">More than food. It’s an experience.</footer></main><script>const products=[['BBQ Regular',10,'1 bout • 2 stokjes saté • salade'],['BBQ Extra',15,'2 bouten • 2 stokjes saté • salade'],['BBQ Gezin',25,'3 bouten • 6 stokjes saté • 3 salades'],['Extra bout',3,'Los bij te bestellen'],['Extra salade',2.5,'Los bij te bestellen'],['Portie saté',5,'Los bij te bestellen']];let cart={};let orders=[];const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);function renderProducts(){productsEl.innerHTML=products.map(([n,p,d])=>`<div class="card"><b>${n}</b><div class="small" style="margin:6px 0 10px">${d}</div><span class="price">${money(p)}</span><button class="add" onclick='add(${JSON.stringify(n)})'>+ Toevoegen</button></div>`).join('')}function add(n){cart[n]=(cart[n]||0)+1;renderCart()}function renderCart(){let total=0;cartEl.innerHTML=Object.entries(cart).map(([n,q])=>{const p=products.find(x=>x[0]===n)[1];total+=p*q;return `<div class="line"><span>${q}× ${n}</span><span>${money(p*q)}</span></div>`}).join('')||'<div class="small">Nog niets toegevoegd.</div>';totalEl.textContent=money(total)}async function placeOrder(){if(!Object.keys(cart).length)return alert('Voeg eerst iets toe.');let total=0;const items=Object.entries(cart).map(([name,qty])=>{const price=products.find(x=>x[0]===name)[1];total+=price*qty;return{name,qty,price}});await rutu.placeOrder({items,total,customer:'Windows testklant'});cart={};renderCart()}function renderOrders(){ordersEl.innerHTML=orders.map(o=>`<div class="order"><b>#${o.id} — ${money(o.total)}</b><div class="small">${o.created}</div><div>${o.items.map(i=>`${i.qty}× ${i.name}`).join('<br>')}</div><div class="status">Status: ${o.status}</div></div>`).join('')||'<div class="small">Nog geen bestellingen.</div>'}const productsEl=document.getElementById('products'),cartEl=document.getElementById('cart'),totalEl=document.getElementById('total'),ordersEl=document.getElementById('orders');renderProducts();renderCart();rutu.getOrders().then(x=>{orders=x;renderOrders()});rutu.onOrdersUpdated(x=>{orders=x;renderOrders()});</script></body></html>
