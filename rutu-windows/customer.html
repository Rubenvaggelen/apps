<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rutu BBQ — Klant</title><style>body{margin:0;background:#09090b;color:#f7f1e7;font-family:Segoe UI,Arial,sans-serif}header{padding:20px;background:linear-gradient(180deg,#1d1309,#111);border-bottom:1px solid #3a2d18}.brand{font:800 26px Georgia,serif;color:#f0c66b}.tag{color:#aaa;font-size:13px}.wrap{padding:18px}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#17171c;border:1px solid #2d2d34;border-radius:16px;padding:14px}.card b{display:block;margin-bottom:5px}.price{color:#f0c66b;font-weight:800}.add{margin-top:10px;width:100%;padding:9px;border:0;border-radius:10px;background:#d7a548;font-weight:800}.cart{margin-top:18px;background:#15120d;border:1px solid #493819;border-radius:16px;padding:14px}.line{display:flex;justify-content:space-between;padding:5px 0}.total{font-weight:900;font-size:18px;margin:12px 0}.send{width:100%;padding:12px;border:0;border-radius:10px;background:#e2b653;font-weight:900}.order{margin-top:12px;padding:12px;border-radius:14px;background:#15151a;border-left:4px solid #d7a548}.status{color:#f0c66b;font-weight:800;margin-top:6px}.small{color:#999;font-size:13px}@media(max-width:520px){.products{grid-template-columns:1fr}}</style></head><body><header><div class="brand">RUTU BBQ</div><div class="tag">Klanttelefoon • testomgeving</div></header><div class="wrap"><div class="products" id="products"></div><div class="cart"><h3>🛒 Winkelmand</h3><div id="cart"></div><div class="line total"><span>Totaal</span><span id="total">€ 0,00</span></div><button class="send" onclick="placeOrder()">Bestelling versturen</button></div><h3>Mijn bestellingen</h3><div id="orders"></div></div><script>const products=[['Teriyaki Chicken',12.5],['The Emperor Burger',14.95],['Ube Cheesecake',6.95],['Nasi Special',11.5],['Roti Kip',13.5],['Friet groot',4.25],['Cola',2.75],['Iced Tea',2.75]];let cart={};let orders=[];const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);function renderProducts(){productsEl.innerHTML=products.map(([n,p])=>`<div class="card"><b>${n}</b><span class="price">${money(p)}</span><button class="add" onclick='add(${JSON.stringify(n)})'>+ Toevoegen</button></div>`).join('')}function add(n){cart[n]=(cart[n]||0)+1;renderCart()}function renderCart(){let total=0;cartEl.innerHTML=Object.entries(cart).map(([n,q])=>{const p=products.find(x=>x[0]===n)[1];total+=p*q;return `<div class="line"><span>${q}× ${n}</span><span>${money(p*q)}</span></div>`}).join('')||'<div class="small">Nog niets toegevoegd.</div>';totalEl.textContent=money(total)}async function placeOrder(){if(!Object.keys(cart).length)return alert('Voeg eerst iets toe.');let total=0;const items=Object.entries(cart).map(([name,qty])=>{const price=products.find(x=>x[0]===name)[1];total+=price*qty;return{name,qty,price}});await rutu.placeOrder({items,total,customer:'Windows testklant'});cart={};renderCart()}function renderOrders(){ordersEl.innerHTML=orders.map(o=>`<div class="order"><b>#${o.id} — ${money(o.total)}</b><div class="small">${o.created}</div><div>${o.items.map(i=>`${i.qty}× ${i.name}`).join('<br>')}</div><div class="status">Status: ${o.status}</div></div>`).join('')||'<div class="small">Nog geen bestellingen.</div>'}const productsEl=document.getElementById('products'),cartEl=document.getElementById('cart'),totalEl=document.getElementById('total'),ordersEl=document.getElementById('orders');renderProducts();renderCart();rutu.getOrders().then(x=>{orders=x;renderOrders()});rutu.onOrdersUpdated(x=>{orders=x;renderOrders()});</script></body></html>
