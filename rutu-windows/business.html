<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rutu BBQ — Bedrijf</title><style>body{margin:0;background:#09090b;color:#f7f1e7;font-family:Segoe UI,Arial,sans-serif}header{padding:20px;background:linear-gradient(180deg,#1d1309,#111);border-bottom:1px solid #3a2d18;display:flex;justify-content:space-between;align-items:center}.brand{font:800 26px Georgia,serif;color:#f0c66b}.tag{color:#aaa;font-size:13px}.badge{background:#8d1f1f;color:#fff;border-radius:999px;padding:6px 10px;font-weight:800}.wrap{padding:18px}.order{padding:14px;margin-bottom:12px;border-radius:16px;background:#17171c;border:1px solid #2d2d34;border-left:4px solid #d7a548}.meta{color:#999;font-size:13px;margin:4px 0 8px}.status{color:#f0c66b;font-weight:900;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 12px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.green{background:#2e9d5b;color:#fff}.red{background:#c13c3c;color:#fff}.orange{background:#c77b23;color:#fff}.gray{background:#303039;color:#fff}.empty{padding:30px;text-align:center;color:#999;border:1px dashed #333;border-radius:16px}</style></head><body><header><div><div class="brand">RUTU BBQ</div><div class="tag">Bedrijfstelefoon • testomgeving</div></div><div class="badge" id="count">0 nieuw</div></header><div class="wrap"><div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="gray" onclick="resetAll()">Alles wissen</button></div><div id="orders"></div></div><script>let orders=[];const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);async function setStatus(id,status){await rutu.setStatus(id,status)}async function resetAll(){if(confirm('Alle testbestellingen wissen?'))await rutu.resetOrders()}function actions(o){if(o.status==='Nieuw')return `<button class="green" onclick="setStatus(${o.id},'In bereiding')">Accepteren</button><button class="red" onclick="setStatus(${o.id},'Geweigerd')">Weigeren</button>`;if(o.status==='In bereiding')return `<button class="orange" onclick="setStatus(${o.id},'Klaar')">Markeer klaar</button>`;if(o.status==='Klaar')return `<button class="green" onclick="setStatus(${o.id},'Afgerond')">Afronden</button>`;return ''}function render(){const count=orders.filter(o=>o.status==='Nieuw').length;document.getElementById('count').textContent=`${count} nieuw`;document.getElementById('orders').innerHTML=orders.map(o=>`<div class="order"><b>#${o.id} — ${money(o.total)}</b><div class="meta">${o.created} • ${o.customer}</div><div>${o.items.map(i=>`${i.qty}× ${i.name}`).join('<br>')}</div><div class="status">Status: ${o.status}</div><div class="actions">${actions(o)}</div></div>`).join('')||'<div class="empty">Wachten op een bestelling van de klanttelefoon…</div>'}rutu.getOrders().then(x=>{orders=x;render()});rutu.onOrdersUpdated(x=>{orders=x;render()});</script></body></html>
