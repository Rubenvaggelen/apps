<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Build</title><link rel="stylesheet" href="brand.css"><style>
body{min-height:100vh;display:grid;place-items:center}.welcome{width:min(960px,100%);padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center}.logo{display:block;width:100%;max-width:400px;margin:auto}.welcome h1{font-size:42px}.welcome p{color:var(--muted)}.choices{display:grid;gap:12px;margin-top:30px}.choices button{text-align:left;padding:17px 20px}.choices small{display:block;margin-top:4px;font-weight:400;font-size:13px}.secondary{background:#211c14;color:var(--light);border-color:var(--line)}.note{font-size:12px;line-height:1.7}@media(max-width:660px){.welcome{grid-template-columns:1fr;gap:16px;padding:24px}.logo{max-width:260px}.welcome h1{font-size:32px}.choices{margin-top:20px}}
</style></head><body><main class="welcome"><img class="logo" src="assets/rutu-logo.png" alt="Rutu BBQ — gouden levensboom met vlammen"><section><div class="eyebrow">RUTU BBQ • COMPANY BUILD</div><h1>Made in fire.<br>Unique taste.</h1><div class="choices"><button class="send" onclick="openBusinessSecure()">Open bedrijfsomgeving<small>Ontvang en verwerk je bestellingen</small></button></div></section></main><script>
async function openBusinessSecure(){
  const pin=prompt('Voer de bedrijfscode in:');
  if(pin===null)return;
  try{await rutu.openBusiness(pin)}
  catch(e){alert(e&&e.message?e.message:'Onjuiste bedrijfscode.')}
}
</script></body></html>
