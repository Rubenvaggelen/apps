<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rutu BBQ Simulator</title><style>body{margin:0;background:radial-gradient(circle at top,#221509,#080808 48%);color:#f8f2e8;font-family:Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(560px,88vw);background:#111116;border:1px solid #3a2d18;border-radius:28px;padding:34px;box-shadow:0 28px 80px #000a;text-align:center}.brand{font-family:Georgia,serif;color:#f0c66b;font-size:42px;font-weight:800;letter-spacing:2px}.flame{font-size:58px;margin:8px}.sub{color:#b8afa2;margin:4px 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{padding:20px;border-radius:16px;border:1px solid #5a4321;background:linear-gradient(180deg,#e9bd60,#ba7d23);color:#1a1006;font-weight:800;font-size:17px;cursor:pointer}button.secondary{background:#1b1b20;color:#f0c66b}.note{margin-top:24px;color:#999;font-size:13px;line-height:1.5}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><div class="flame">🔥</div><div class="brand">RUTU BBQ</div><div class="sub">More than food. It’s an experience.</div><div class="grid"><button onclick="rutu.openCustomer()">📱 Open klanttelefoon</button><button class="secondary" onclick="rutu.openBusiness()">🏪 Open bedrijfstelefoon</button></div><div class="note">Open beide vensters tegelijk. Plaats een bestelling in het klantvenster en verwerk hem in het bedrijfsvenster. Statusupdates verschijnen direct aan beide kanten.</div></main></body></html>
