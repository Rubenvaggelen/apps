:root{

body::after{content:"";position:fixed;inset:0;z-index:-2;background:var(--console)}
body{
  margin:0;color:var(--ink);
  font-family:Roboto,system-ui,"Segoe UI",Arial,sans-serif;
  font-size:15px;line-height:1.3;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.app{max-width:1500px;margin:0 auto;padding:10px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand-text{display:flex;flex-direction:column}
.brand-sub{white-space:nowrap;font-size:11px;font-weight:700;color:#20B8FF;letter-spacing:.16em;margin-top:1px}
.brand-title{white-space:nowrap;font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-weight:700;font-size:30px;line-height:1.1;
  color:#20B8FF;letter-spacing:.04em;text-shadow:0 0 8px rgba(32,184,255,.6)}
.logo{width:54px;height:54px;border-radius:50%;display:block}
.top-actions{display:flex;align-items:center;gap:6px}
.hp-btn svg,.cue-hp svg,#fsBtn svg{width:18px;height:18px;flex:none}
.hp-btn.on{border:2px solid #E8AA4E;color:#F4D08A;padding:0 11px}
.cue-hp{padding:0 9px}
body:not(.hp-on) .cue-hp{display:none}
.cue-hp.on{border:2px solid #E8AA4E;color:#F4D08A;background:linear-gradient(180deg,#3A2A10,#1A1206);padding:0 8px;box-shadow:0 0 10px rgba(232,170,78,.35)}

/* library */
const lib=[];let autoLoad=true,playlistRestoring=true,dragId=null;
const libList=document.getElementById("libList"),libEmpty=document.getElementById("libEmpty");
const autoBtn=document.getElementById("autoLoad");
const sharedLoaded=new Set();
const playlistId=()=>crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+"-"+Math.random().toString(36).slice(2));

async function playlistWrite(){
  if(playlistRestoring) return;
  try{
    const db=await sfxDB();
    const rows=lib.map((t,index)=>({
      id:t.id,index,name:t.name,status:t.status,file:t.file,sharedName:t.sharedName||""
    }));
    await new Promise((res,rej)=>{
      const tx=db.transaction("playlist","readwrite");
      tx.objectStore("playlist").put(rows,"current");
      tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
}
async function playlistRead(){
  try{
    const db=await sfxDB();
    const rows=await new Promise((res,rej)=>{
      const tx=db.transaction("playlist");
      const rq=tx.objectStore("playlist").get("current");
      rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);
    });
    if(Array.isArray(rows)){
      rows.sort((a,b)=>(a.index??0)-(b.index??0));
      for(const r of rows){
        if(!r||!r.file) continue;
        const status=["played","error"].includes(r.status)?r.status:"queued";
        const item={id:r.id||playlistId(),file:r.file,name:r.name||baseName(r.file),status,sharedName:r.sharedName||""};
        lib.push(item);
        if(item.sharedName) sharedLoaded.add(item.sharedName);
      }
    }
  }catch(e){}
  playlistRestoring=false;
  renderLib();autoFill();playlistWrite();
}
async function clearStoredPlaylist(){
  try{
    const db=await sfxDB();
    await new Promise((res,rej)=>{
      const tx=db.transaction("playlist","readwrite");
      tx.objectStore("playlist").delete("current");
      tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
}
function addToLib(files,sharedNames=[]){
  files.forEach((f,i)=>{
    if(!f||/^(image|text)\//.test(f.type)) return;
    lib.push({id:playlistId(),file:f,name:baseName(f),status:"queued",sharedName:sharedNames[i]||""});
  });
  renderLib();playlistWrite();autoFill();
}
document.getElementById("libInput").addEventListener("change",e=>{addToLib([...e.target.files]);e.target.value=""});

async function loadSharedMediaImports(showStatus=false){
  const btn=document.getElementById("sharedMediaImport");
  const old=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent="Laden…";}
  let added=0;
  try{
    const mr=await fetch("imports/shared-media.json?t="+Date.now(),{cache:"no-store"});
    if(!mr.ok) throw new Error("no manifest");
    const names=await mr.json();
    if(!Array.isArray(names)) throw new Error("bad manifest");
    const files=[],sharedNames=[];
    for(const name of names){
      if(typeof name!=="string"||!name||sharedLoaded.has(name)) continue;
      const r=await fetch("imports/"+encodeURIComponent(name)+"?t="+Date.now(),{cache:"no-store"});
      if(!r.ok) continue;
      const blob=await r.blob();
      files.push(new File([blob],name,{type:blob.type||"audio/mpeg"}));
      sharedNames.push(name);
      sharedLoaded.add(name);
      added++;
    }
    if(files.length) addToLib(files,sharedNames);
    if(showStatus) alert(added?added+" nummer(s) uit Shared Media toegevoegd.":"Geen nieuwe Shared Media-nummers gevonden.");
  }catch(e){
    if(showStatus) alert("Nog geen Shared Media-nummers geïmporteerd.");
  }finally{
    if(btn){btn.disabled=false;btn.textContent=old;}
  }
}
document.getElementById("sharedMediaImport")?.addEventListener("click",()=>loadSharedMediaImports(true));
setTimeout(()=>loadSharedMediaImports(false),500);

autoBtn.addEventListener("click",()=>{
  autoLoad=!autoLoad;autoBtn.setAttribute("aria-pressed",autoLoad);autoBtn.classList.toggle("on",autoLoad);
  renderLib();autoFill();
});
function nextQueued(){return lib.find(t=>t.status==="queued")}
function autoFill(){
  if(!autoLoad) return;
  for(const d of decks){
    if(d.loading||d.playing||d.scr) continue;
    if(d.buffer&&!d.done) continue;
    const t=nextQueued();if(!t) return;
    t.status="loading";renderLib();playlistWrite();d.load(t.file,t);
  }
}
function removeLibItem(t){
  const d=decks.find(x=>x.libItem===t);
  if(d&&d.playing) d.pause();
  if(d&&d.libItem===t){d.libItem=null;d.buffer=null;d.done=false;d.pos=0;d.dur=0;d.ui.title.textContent="Geen nummer geladen";d.ui.sub.textContent="";d.drawBase?.()}
  const i=lib.indexOf(t);if(i>=0) lib.splice(i,1);
  if(t.sharedName) sharedLoaded.delete(t.sharedName);
  renderLib();playlistWrite();autoFill();
}
function renderLib(){
  libEmpty.hidden=lib.length>0;libList.innerHTML="";
  const next=autoLoad?nextQueued():null;
  lib.forEach(t=>{
    const li=document.createElement("li");li.dataset.status=t.status;li.draggable=true;li.dataset.id=t.id;
    const drag=document.createElement("span");drag.className="lib-drag";drag.textContent="☰";drag.title="Sleep om te verplaatsen";
    const tag=document.createElement("span");tag.className="lib-tag";
    tag.textContent={A:"Deck A",B:"Deck B",played:"Gespeeld",loading:"Laden…",error:"Niet af te spelen"}[t.status]||(t===next?"Volgende":"");
    if(t===next) li.dataset.status="next";
    const name=document.createElement("span");name.className="lib-name";name.textContent=t.name;
    const a=document.createElement("button");a.className="btn small to-a";a.textContent="A";a.setAttribute("aria-label","Laad "+t.name+" in deck A");
    const b=document.createElement("button");b.className="btn small to-b";b.textContent="B";b.setAttribute("aria-label","Laad "+t.name+" in deck B");
    const x=document.createElement("button");x.className="btn small lib-remove";x.textContent="×";x.title="Verwijder uit playlist";x.setAttribute("aria-label","Verwijder "+t.name+" uit playlist");
    a.onclick=()=>{decks[0].load(t.file,t);playlistWrite()};
    b.onclick=()=>{decks[1].load(t.file,t);playlistWrite()};
    x.onclick=e=>{e.stopPropagation();removeLibItem(t)};
    li.addEventListener("dragstart",e=>{dragId=t.id;li.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
    li.addEventListener("dragend",()=>{dragId=null;li.classList.remove("dragging");[...libList.children].forEach(n=>n.classList.remove("drag-over"))});
    li.addEventListener("dragover",e=>{e.preventDefault();li.classList.add("drag-over");e.dataTransfer.dropEffect="move"});
    li.addEventListener("dragleave",()=>li.classList.remove("drag-over"));
    li.addEventListener("drop",e=>{
      e.preventDefault();li.classList.remove("drag-over");
      if(!dragId||dragId===t.id) return;
      const from=lib.findIndex(x=>x.id===dragId),to=lib.indexOf(t);
      if(from<0||to<0) return;
      const [m]=lib.splice(from,1);lib.splice(to,0,m);
      renderLib();playlistWrite();
    });
    li.append(drag,tag,name,a,b,x);libList.appendChild(li);
  });
}
document.getElementById("clearPlaylist")?.addEventListener("click",()=>{
  if(!lib.length) return;
  if(!confirm("Hele playlist wissen?")) return;
  for(const d of decks){
    if(d.playing) d.pause();
    d.libItem=null;d.buffer=null;d.done=false;d.pos=0;d.dur=0;
    d.ui.title.textContent="Geen nummer geladen";d.ui.sub.textContent="";
  }
  lib.length=0;sharedLoaded.clear();renderLib();clearStoredPlaylist();
});
playlistRead();

const library=document.querySelector(".library");
document.getElementById("libBtn").addEventListener("click",()=>library.classList.add("open"));
document.getElementById("libClose").addEventListener("click",()=>library.classList.remove("open"));
libList.addEventListener("click",e=>{if(e.target.closest("button")) library.classList.remove("open")});

const WINDOWS_BUILD=206;
const updateBtn=document.getElementById("updateBtn");
updateBtn?.addEventListener("click",async()=>{
  const old=updateBtn.textContent;updateBtn.disabled=true;updateBtn.textContent="Controleren…";
  try{
    const r=await fetch("https://api.github.com/repos/Rubenvaggelen/apps/contents/windows/the-one-dj/version.json?ref=main",{cache:"no-store",headers:{"Accept":"application/vnd.github.raw+json"}});
    if(!r.ok) throw new Error("check failed");
    const v=await r.json();
    if((v.build||0)>WINDOWS_BUILD) alert("Update beschikbaar (build "+v.build+"). Sluit The One DJ en open hem opnieuw; de update wordt automatisch geïnstalleerd.");
    else alert("The One DJ is up-to-date. Build "+WINDOWS_BUILD+".");
  }catch(e){alert("Kon nu niet op updates controleren. Controleer je internetverbinding en probeer opnieuw.");}
  finally{updateBtn.disabled=false;updateBtn.textContent=old;}
});

const IN_APP=new URLSearchParams(location.search).get("app")==="android";
if(IN_APP) document.documentElement.classList.add("in-app");
if(!IN_APP&&"serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
const fsBtn=document.getElementById("fsBtn"),fsRotate=document.getElementById("fsRotate");
async function goFullscreen(){
  try{if(!document.fullscreenElement) await document.documentElement.requestFullscreen({navigationUI:"hide"})}catch(e){}
  try{await screen.orientation?.lock?.("landscape")}catch(e){}
}
if(document.fullscreenEnabled&&!IN_APP){
  fsBtn.hidden=false;fsRotate.hidden=false;
  fsBtn.addEventListener("click",()=>{document.fullscreenElement?document.exitFullscreen():goFullscreen()});
  fsRotate.addEventListener("click",goFullscreen);
  document.addEventListener("fullscreenchange",()=>{fsBtn.setAttribute("aria-label",document.fullscreenElement?"Volledig scherm verlaten":"Volledig scherm")});
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>decks.forEach(d=>d.drawBase()));
</script>
