name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android >/dev/null

      - name: Inject API keys
        run: |
          sed -i "s|GEMINI_API_KEY=PLAATS_HIER_JE_KEY|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" gradle.properties

      - name: Print signing certificate
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Compare build 77 with this APK
        shell: bash
        run: |
          set -uo pipefail

          NEW_APK="app/build/outputs/apk/debug/app-debug.apk"
          OLD_APK="/tmp/app-v77.apk"
          REPORT="update-diagnostics.txt"
          EXPECTED_V77_SHA256="8bb515f9ec3b53fbb2584a6102c0e7c19a9fed7186b754763cf7c3945436c817"

          echo "Downloading build 77 APK..."
          curl -L --fail --retry 3 \
            "https://github.com/Rubenvaggelen/apps/releases/download/v77/app-debug.apk" \
            -o "$OLD_APK"
          CURL_STATUS=$?

          OLD_SIZE=$(stat -c%s "$OLD_APK" 2>/dev/null || echo 0)
          NEW_SIZE=$(stat -c%s "$NEW_APK" 2>/dev/null || echo 0)
          OLD_SHA=$(sha256sum "$OLD_APK" 2>/dev/null | awk '{print $1}')
          NEW_SHA=$(sha256sum "$NEW_APK" 2>/dev/null | awk '{print $1}')

          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          echo "Using build-tools: $BUILD_TOOLS"
          echo "apksigner: $APKSIGNER"
          echo "aapt: $AAPT"

          : > /tmp/v77-sign.txt
          : > /tmp/new-sign.txt
          : > /tmp/v77-badging.txt
          : > /tmp/new-badging.txt

          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" >/tmp/v77-sign.txt 2>&1
            OLD_VERIFY=$?
            "$APKSIGNER" verify --verbose --print-certs "$NEW_APK" >/tmp/new-sign.txt 2>&1
            NEW_VERIFY=$?
          else
            OLD_VERIFY=127
            NEW_VERIFY=127
            echo "apksigner not found/executable: $APKSIGNER" > /tmp/v77-sign.txt
            cp /tmp/v77-sign.txt /tmp/new-sign.txt
          fi

          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$OLD_APK" >/tmp/v77-badging.txt 2>&1
            OLD_AAPT=$?
            "$AAPT" dump badging "$NEW_APK" >/tmp/new-badging.txt 2>&1
            NEW_AAPT=$?
          else
            OLD_AAPT=127
            NEW_AAPT=127
            echo "aapt not found/executable: $AAPT" > /tmp/v77-badging.txt
            cp /tmp/v77-badging.txt /tmp/new-badging.txt
          fi

          CERT77="$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/v77-sign.txt 2>/dev/null | sed 's/.*digest: //' || true)"
          CERTNEW="$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/new-sign.txt 2>/dev/null | sed 's/.*digest: //' || true)"

          BADGE77="$(grep -m1 '^package:' /tmp/v77-badging.txt 2>/dev/null || true)"
          BADGENEW="$(grep -m1 '^package:' /tmp/new-badging.txt 2>/dev/null || true)"

          PKG77="$(echo "$BADGE77" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          PKGNEW="$(echo "$BADGENEW" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          VC77="$(echo "$BADGE77" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VCNEW="$(echo "$BADGENEW" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VN77="$(echo "$BADGE77" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          VNNEW="$(echo "$BADGENEW" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          SIG_MATCH=UNKNOWN
          PKG_MATCH=UNKNOWN
          VERSION_HIGHER=UNKNOWN
          V77_SHA_MATCH=NO

          [ "$OLD_SHA" = "$EXPECTED_V77_SHA256" ] && V77_SHA_MATCH=YES
          if [ -n "$CERT77" ] && [ -n "$CERTNEW" ]; then
            SIG_MATCH=NO
            [ "$CERT77" = "$CERTNEW" ] && SIG_MATCH=YES
          fi
          if [ -n "$PKG77" ] && [ -n "$PKGNEW" ]; then
            PKG_MATCH=NO
            [ "$PKG77" = "$PKGNEW" ] && PKG_MATCH=YES
          fi
          if [[ "$VC77" =~ ^[0-9]+$ ]] && [[ "$VCNEW" =~ ^[0-9]+$ ]]; then
            VERSION_HIGHER=NO
            [ "$VCNEW" -gt "$VC77" ] && VERSION_HIGHER=YES
          fi

          COMPATIBLE=NO
          if [ "$SIG_MATCH" = YES ] && [ "$PKG_MATCH" = YES ] && [ "$VERSION_HIGHER" = YES ]; then
            COMPATIBLE=YES
          fi

          {
            echo "THE ONE UPDATE DIAGNOSTICS V2"
            echo "Generated by GitHub Actions run ${{ github.run_number }}"
            echo
            echo "DOWNLOAD / FILE CHECK"
            echo "curl_status=$CURL_STATUS"
            echo "build77_size_bytes=$OLD_SIZE"
            echo "new_build_size_bytes=$NEW_SIZE"
            echo "build77_expected_sha256=$EXPECTED_V77_SHA256"
            echo "build77_actual_sha256=$OLD_SHA"
            echo "build77_sha256_matches_release=$V77_SHA_MATCH"
            echo "new_apk_sha256=$NEW_SHA"
            echo
            echo "TOOLS"
            echo "build_tools=$BUILD_TOOLS"
            echo "apksigner=$APKSIGNER"
            echo "aapt=$AAPT"
            echo "build77_apksigner_exit=$OLD_VERIFY"
            echo "new_apksigner_exit=$NEW_VERIFY"
            echo "build77_aapt_exit=$OLD_AAPT"
            echo "new_aapt_exit=$NEW_AAPT"
            echo
            echo "BUILD 77"
            echo "package=$PKG77"
            echo "versionCode=$VC77"
            echo "versionName=$VN77"
            echo "certificate_sha256=$CERT77"
            echo
            echo "NEW BUILD"
            echo "package=$PKGNEW"
            echo "versionCode=$VCNEW"
            echo "versionName=$VNNEW"
            echo "certificate_sha256=$CERTNEW"
            echo
            echo "RESULT"
            echo "same_package=$PKG_MATCH"
            echo "same_signing_certificate=$SIG_MATCH"
            echo "new_versionCode_is_higher=$VERSION_HIGHER"
            echo "android_update_compatible=$COMPATIBLE"
            echo
            echo "BUILD 77 APKSIGNER OUTPUT"
            cat /tmp/v77-sign.txt
            echo
            echo "NEW BUILD APKSIGNER OUTPUT"
            cat /tmp/new-sign.txt
            echo
            echo "BUILD 77 AAPT OUTPUT"
            cat /tmp/v77-badging.txt
            echo
            echo "NEW BUILD AAPT OUTPUT"
            cat /tmp/new-badging.txt
          } | tee "$REPORT"

          # Important: diagnostics must never stop the workflow.
          # The report above is the output we need to diagnose the update failure.
          exit 0

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmail-org-hub-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-diagnostics
          path: update-diagnostics.txt

      - name: Create GitHub Release with APK and diagnostics
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "The One — build ${{ github.run_number }}"
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            update-diagnostics.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
